name: bit platform CI - Borm

# Build, unit tests and MCP server tests. The browser suite lives in bit.ci.Borm.e2e.yml and runs on demand only.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
    - 'src/Utilities/Borm/**'

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

jobs:
  build-Borm:
    if: startsWith(github.event.pull_request.title, 'Prerelease') != true && startsWith(github.event.pull_request.title, 'Release') != true && startsWith(github.event.pull_request.title, 'Version') != true
    name: build Bit.Borm
    runs-on: ubuntu-26.04

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: src/global.json

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 10.0.x

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 9.0.x

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 8.0.x

    # Bit.Borm targets up to net10.0 but runs on .NET 11 too, whose runtime converts numbers differently
    # (a double cast to decimal keeps its exact binary value). The net10.0 tests are run on it below.
    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 11.0.x
        dotnet-quality: preview

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: dotnet workload restore
      run:  cd src/Utilities/Borm && dotnet workload restore

    - name: dotnet build
      run: dotnet build src/Utilities/Borm/Bit.Borm.slnx

    - name: dotnet test
      # Run from inside src so src/global.json's "test" runner setting applies
      # (from the repo root the SDK falls back to the unsupported VSTest path).
      run: cd src/Utilities/Borm/Tests/Bit.Borm.Tests && dotnet test --no-build

    - name: dotnet test (.NET 11 runtime)
      # Rolls the net10.0 test build forward onto the newest runtime installed: .NET 11.
      run: cd src/Utilities/Borm/Tests/Bit.Borm.Tests && dotnet exec --roll-forward LatestMajor bin/Debug/net10.0/Bit.Borm.Tests.dll

    - name: dotnet test (MCP server)
      run: cd src/Utilities/Borm/Tests/Bit.Borm.Tests.Mcp && dotnet test --no-build
