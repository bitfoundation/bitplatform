name: All Other CI

on:
  workflow_dispatch:
    inputs:
      nuget_packages:
        description: NuGet packages
        type: boolean
        default: true
      prerelease_packages:
        description: Bit packages of the latest CD Prerelease nuget packages run instead of nuget.org (the Boilerplate build and website jobs)
        type: boolean
        default: false
      blazorui:
        description: BlazorUI solution
        type: boolean
        default: true
      bswup:
        description: Bswup solution
        type: boolean
        default: true
      butil:
        description: Butil solution
        type: boolean
        default: true
      brouter:
        description: Brouter solution
        type: boolean
        default: true

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read
  actions: read

jobs:

  boilerplate:
    name: boilerplate
    uses: ./.github/workflows/ci.templates.yml
    with:
      prerelease_packages: ${{ inputs.prerelease_packages }}



  build_nuget_packages:
    name: build nuget packages locally
    if: ${{ inputs.nuget_packages }}
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Build and pack BlazorUI
      run: |
        dotnet build src/BlazorUI/Bit.BlazorUI/Bit.BlazorUI.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/BlazorUI/Bit.BlazorUI/Bit.BlazorUI.csproj --output ./packages --configuration Release

    - name: Build and pack BlazorUI.Extras
      run: |
        dotnet build src/BlazorUI/Bit.BlazorUI.Extras/Bit.BlazorUI.Extras.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/BlazorUI/Bit.BlazorUI.Extras/Bit.BlazorUI.Extras.csproj --output ./packages --configuration Release

    - name: Build and pack BlazorUI.Legacy
      run: |
        dotnet build src/BlazorUI/Bit.BlazorUI.Legacy/Bit.BlazorUI.Legacy.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/BlazorUI/Bit.BlazorUI.Legacy/Bit.BlazorUI.Legacy.csproj --output ./packages --configuration Release

    - name: Build and pack BlazorUI.AI.Core
      run: |
        dotnet build src/BlazorUI/Bit.BlazorUI.AI/Bit.BlazorUI.AI.Core/Bit.BlazorUI.AI.Core.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/BlazorUI/Bit.BlazorUI.AI/Bit.BlazorUI.AI.Core/Bit.BlazorUI.AI.Core.csproj --output ./packages --configuration Release

    - name: Build and pack BlazorUI.AI
      run: |
        dotnet build src/BlazorUI/Bit.BlazorUI.AI/Bit.BlazorUI.AI/Bit.BlazorUI.AI.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/BlazorUI/Bit.BlazorUI.AI/Bit.BlazorUI.AI/Bit.BlazorUI.AI.csproj --output ./packages --configuration Release

    - name: Build and pack BlazorUI.AI.Server
      run: |
        dotnet build src/BlazorUI/Bit.BlazorUI.AI/Bit.BlazorUI.AI.Server/Bit.BlazorUI.AI.Server.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/BlazorUI/Bit.BlazorUI.AI/Bit.BlazorUI.AI.Server/Bit.BlazorUI.AI.Server.csproj --output ./packages --configuration Release

    - name: Build and pack BlazorUI.AI.SignalR
      run: |
        dotnet build src/BlazorUI/Bit.BlazorUI.AI/Bit.BlazorUI.AI.SignalR/Bit.BlazorUI.AI.SignalR.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/BlazorUI/Bit.BlazorUI.AI/Bit.BlazorUI.AI.SignalR/Bit.BlazorUI.AI.SignalR.csproj --output ./packages --configuration Release

    - name: Build and pack BlazorUI.AI.ChatClient
      run: |
        dotnet build src/BlazorUI/Bit.BlazorUI.AI/Bit.BlazorUI.AI.ChatClient/Bit.BlazorUI.AI.ChatClient.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/BlazorUI/Bit.BlazorUI.AI/Bit.BlazorUI.AI.ChatClient/Bit.BlazorUI.AI.ChatClient.csproj --output ./packages --configuration Release

    - name: Build and pack BlazorUI.Assets
      run: |
        dotnet build src/BlazorUI/Bit.BlazorUI.Assets/Bit.BlazorUI.Assets.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/BlazorUI/Bit.BlazorUI.Assets/Bit.BlazorUI.Assets.csproj --output ./packages --configuration Release

    - name: Build and pack BlazorUI.Icons
      run: |
        dotnet build src/BlazorUI/Bit.BlazorUI.Icons/Bit.BlazorUI.Icons.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/BlazorUI/Bit.BlazorUI.Icons/Bit.BlazorUI.Icons.csproj --output ./packages --configuration Release

    - name: Build and pack Bswup
      run: |
        dotnet build src/Bswup/Bit.Bswup/Bit.Bswup.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Bswup/Bit.Bswup/Bit.Bswup.csproj --output ./packages --configuration Release

    - name: Build and pack Butil
      run: |
        dotnet build src/Butil/Bit.Butil/Bit.Butil.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Butil/Bit.Butil/Bit.Butil.csproj --output ./packages --configuration Release

    - name: Build and pack Brouter
      run: |
        dotnet build src/Brouter/Bit.Brouter/Bit.Brouter.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Brouter/Bit.Brouter/Bit.Brouter.csproj --output ./packages --configuration Release

    - name: Build and pack Brouter.Generators
      run: |
        dotnet build src/Brouter/Bit.Brouter.Generators/Bit.Brouter.Generators.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Brouter/Bit.Brouter.Generators/Bit.Brouter.Generators.csproj --output ./packages --configuration Release

    - name: Pack Boilerplate template
      run: dotnet pack src/Templates/Boilerplate/Bit.Boilerplate.ProjectTemplate.csproj --output ./packages --configuration Release

    - name: Pack BlazorEmpty template
      run: dotnet pack src/Templates/BlazorEmpty/Bit.BlazorEmpty.ProjectTemplate.csproj --output ./packages --configuration Release

    - name: Upload NuGet packages artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: nuget-packages
        path: ./packages/*.nupkg
        retention-days: 30



  blazorui:
    name: blazorui
    if: ${{ inputs.blazorui }}
    uses: ./.github/workflows/ci.blazorui.yml

  bswup:
    name: bswup
    if: ${{ inputs.bswup }}
    uses: ./.github/workflows/ci.bswup.yml

  butil:
    name: butil
    if: ${{ inputs.butil }}
    uses: ./.github/workflows/ci.butil.yml

  brouter:
    name: brouter
    if: ${{ inputs.brouter }}
    uses: ./.github/workflows/ci.brouter.yml

  websites:
    name: websites
    uses: ./.github/workflows/ci.websites.yml
    with:
      prerelease_packages: ${{ inputs.prerelease_packages }}
