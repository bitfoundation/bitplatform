name: CI BbScanner E2E

# The demo app in Chromium whose camera is a generated video file: continuous scanning of six symbologies, the
# camera lifecycle, permissions, keyboard and layout, and every demo page, against the Release build that ships - and
# the Blazor Server sample, where the same scanner runs on a circuit - and the published lazy loading sample, which
# downloads Bit.BbScanner.wasm only when its scanner page opens, trimmed and, in a job of its own, compiled ahead of time.
# It takes far longer than the build-and-unit pipeline (bit.ci.BbScanner.yml), so it runs only when started by
# hand. See src/Utilities/BbScanner/Tests/Bit.BbScanner.Tests.E2E/README.md for what the suite proves and how to run it
# locally.

on:
  workflow_dispatch:
  workflow_call:

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

jobs:

  e2e:
    name: BbScanner E2E (Chromium)
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Install wasm-tools
      run: cd src && dotnet workload install wasm-tools

    # The tests drive the demo published the way bbscanner.demo.cd.yml publishes it, not a build output: only a publish
    # trims the WebAssembly client and compiles it ahead of time, and an interop payload the trimmer breaks works in
    # every build and fails only there.
    - name: Publish the demo
      run: dotnet publish src/Utilities/BbScanner/Demo/Server/Bit.BbScanner.Demo.Server.csproj -c Release -o demo -p:InvariantGlobalization=true

    # The Blazor Server tests boot the sample from its build output themselves: on a circuit .NET runs on the server,
    # so there is no trimmed or ahead of time compiled client for a publish to produce.
    - name: Build the Blazor Server sample
      run: dotnet build src/Utilities/BbScanner/Samples/Server/Bit.BbScanner.Samples.Server.csproj -c Release

    # Published rather than built: LazyLoadingTests drives what an app that lazy loads ships, and only a publish trims the
    # client and writes the lazy mark into its boot configuration. Not ahead of time here: the lazy-loading-aot job below
    # covers that.
    - name: Publish the lazy loading sample
      run: dotnet publish src/Utilities/BbScanner/Samples/Lazy/Bit.BbScanner.Samples.Lazy/Bit.BbScanner.Samples.Lazy.csproj -c Release

    - name: Build the E2E suite
      run: dotnet build src/Utilities/BbScanner/Tests/Bit.BbScanner.Tests.E2E/Bit.BbScanner.Tests.E2E.csproj -c Release

    - name: Install Playwright Chromium
      run: pwsh src/Utilities/BbScanner/Tests/Bit.BbScanner.Tests.E2E/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

    - name: Start the published demo
      run: |
        cd demo
        nohup dotnet Bit.BbScanner.Demo.Server.dll --urls http://127.0.0.1:5000 > ../demo.log 2>&1 &
        for attempt in $(seq 1 60); do
          curl --silent --fail --output /dev/null http://127.0.0.1:5000/ && exit 0
          sleep 2
        done
        cat ../demo.log
        exit 1

    - name: Run E2E tests
      env:
        BBSCANNER_E2E_BASE_URL: http://127.0.0.1:5000
      # Run from inside src so src/global.json's Microsoft.Testing.Platform runner setting applies.
      run: >
        cd src/Utilities/BbScanner/Tests/Bit.BbScanner.Tests.E2E &&
        dotnet test -c Release --no-build
        --report-trx --report-trx-filename bbscanner-e2e.trx

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bbscanner-e2e
        path: |
          **/bbscanner-e2e.trx
          demo.log
        if-no-files-found: ignore

  # The lazy loading sample compiled ahead of time, as the README says an app that scans with the camera should be: its
  # project file then leaves the lazy mark and the router's switch out, as the README says an AOT build must, and
  # LazyLoadingTests checks that it loads Bit.BbScanner with the app and scans all the same.
  lazy-loading-aot:
    name: BbScanner lazy loading (AOT)
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    # From inside src, so src/global.json picks the SDK: the workload has to be installed for the SDK that publishes.
    - name: Install wasm-tools
      run: cd src && dotnet workload install wasm-tools

    - name: Publish the lazy loading sample ahead of time
      run: dotnet publish src/Utilities/BbScanner/Samples/Lazy/Bit.BbScanner.Samples.Lazy/Bit.BbScanner.Samples.Lazy.csproj -c Release -p:RunAOTCompilation=true

    # Every test of the suite starts the demo before it runs (Infrastructure/PlaywrightSession.cs), so it is built too,
    # although LazyLoadingTests drives only the sample. A build, not a publish: nothing of the demo is under test here.
    - name: Build the demo and the E2E suite
      run: |
        dotnet build src/Utilities/BbScanner/Demo/Server/Bit.BbScanner.Demo.Server.csproj -c Release
        dotnet build src/Utilities/BbScanner/Tests/Bit.BbScanner.Tests.E2E/Bit.BbScanner.Tests.E2E.csproj -c Release

    - name: Install Playwright Chromium
      run: pwsh src/Utilities/BbScanner/Tests/Bit.BbScanner.Tests.E2E/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

    - name: Run the lazy loading tests
      env:
        BBSCANNER_E2E_LAZY_AOT: 1
      # Run from inside src so src/global.json's Microsoft.Testing.Platform runner setting applies.
      run: >
        cd src/Utilities/BbScanner/Tests/Bit.BbScanner.Tests.E2E &&
        dotnet test -c Release --no-build
        --filter "FullyQualifiedName~LazyLoadingTests"
        --report-trx --report-trx-filename bbscanner-lazy-aot.trx

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bbscanner-lazy-aot
        path: '**/bbscanner-lazy-aot.trx'
        if-no-files-found: ignore
