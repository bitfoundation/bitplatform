name: bit platform CI - Blex

# Build, unit, source-generator and MCP tests, and a pack of every package. The browser, hybrid and publish-gate
# suites live in bit.ci.Blex.e2e.yml and run on demand only.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
    - 'src/Blex/**'

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

jobs:

  # Its `if:` skips the job on Release/Prerelease/Version PRs.
  build-Blex:
    if: startsWith(github.event.pull_request.title, 'Prerelease') != true && startsWith(github.event.pull_request.title, 'Release') != true && startsWith(github.event.pull_request.title, 'Version') != true
    name: build Bit.Blex
    runs-on: ubuntu-24.04

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: src/global.json

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 9.0.x

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 8.0.x

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: dotnet build
      run: dotnet build src/Blex/Bit.Blex.slnx

    - name: dotnet test (runtime, Blazor, MAUI and generated code - net8.0/net9.0/net10.0)
      # Run from inside src so src/global.json's "test" runner setting applies
      # (from the repo root the SDK falls back to the unsupported VSTest path).
      run: cd src/Blex/Tests/Bit.Blex.Tests && dotnet test --no-build

    - name: dotnet test (source generator)
      run: cd src/Blex/Tests/Bit.Blex.Tests.Generators && dotnet test --no-build

    - name: dotnet test (MCP server)
      run: cd src/Blex/Tests/Bit.Blex.Tests.Mcp && dotnet test --no-build

    # Packing on every run means a broken nuspec, a missing analyzer or a stale readme path is caught
    # here rather than at release time. Each project is built in Release with GeneratePackageOnBuild
    # off before it is packed, as all.ci.yml and nuget.org.yml do: Bit.Build.props turns that
    # property on for Release, and a bare `dotnet pack` of a multi-targeted project with it on fails
    # with NU5026 (the pack-on-build step runs before every TFM's assembly is on disk).
    - name: dotnet pack
      run: |
        for project in Bit.Blex Bit.Blex.Generators Bit.Blex.Blazor Bit.Blex.Maui Bit.Blex.Testing; do
          dotnet build src/Blex/$project/$project.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
          dotnet pack src/Blex/$project/$project.csproj --output ./packages --configuration Release
        done
