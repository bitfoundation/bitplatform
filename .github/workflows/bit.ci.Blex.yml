name: bit platform CI - Blex

# One pipeline per package: the build/unit stage gates the browser, hybrid and publish-gate stages below, so a
# broken build fails once instead of burning a runner per E2E leg. See
# src/Blex/Tests/Bit.Blex.Tests.E2E/README.md for what each E2E job proves and how to run it locally.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
    - 'src/Blex/**'

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

jobs:

  # Stage 1 - build, unit, source-generator and MCP tests, and a pack of every package. Every stage below
  # depends on this one, so its `if:` is the single switch that skips the whole pipeline on
  # Release/Prerelease/Version PRs.
  build-Blex:
    if: startsWith(github.event.pull_request.title, 'Prerelease') != true && startsWith(github.event.pull_request.title, 'Release') != true && startsWith(github.event.pull_request.title, 'Version') != true
    name: build Bit.Blex
    runs-on: ubuntu-24.04

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: src/global.json

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 9.0.x

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 8.0.x

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: dotnet build
      run: dotnet build src/Blex/Bit.Blex.slnx

    - name: dotnet test (runtime, Blazor, MAUI and generated code - net8.0/net9.0/net10.0)
      # Run from inside src so src/global.json's "test" runner setting applies
      # (from the repo root the SDK falls back to the unsupported VSTest path).
      run: cd src/Blex/Tests/Bit.Blex.Tests && dotnet test --no-build

    - name: dotnet test (source generator)
      run: cd src/Blex/Tests/Bit.Blex.Tests.Generators && dotnet test --no-build

    - name: dotnet test (MCP server)
      run: cd src/Blex/Tests/Bit.Blex.Tests.Mcp && dotnet test --no-build

    # Packing on every run means a broken nuspec, a missing analyzer or a stale readme path is caught
    # here rather than at release time.
    - name: dotnet pack
      run: |
        dotnet pack src/Blex/Bit.Blex/Bit.Blex.csproj --output ./packages --configuration Release
        dotnet pack src/Blex/Bit.Blex.Generators/Bit.Blex.Generators.csproj --output ./packages --configuration Release
        dotnet pack src/Blex/Bit.Blex.Blazor/Bit.Blex.Blazor.csproj --output ./packages --configuration Release
        dotnet pack src/Blex/Bit.Blex.Maui/Bit.Blex.Maui.csproj --output ./packages --configuration Release
        dotnet pack src/Blex/Bit.Blex.Testing/Bit.Blex.Testing.csproj --output ./packages --configuration Release

  # Stage 2 - every web render mode (static SSR, Server, WebAssembly, Auto, with and without prerendering) in
  # Chromium, on each runtime the library ships for.
  e2e-web:
    needs: build-Blex
    name: Blex E2E - web render modes (${{ matrix.framework }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        framework: [ net10.0, net9.0, net8.0 ]

    steps:
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: src/global.json

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 9.0.x

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 8.0.x

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Build the web harness host
      run: dotnet build src/Blex/Tests/Bit.Blex.Tests.Harness.Web/Bit.Blex.Tests.Harness.Web.csproj -c Release -f ${{ matrix.framework }}

    - name: Build the E2E suite
      run: dotnet build src/Blex/Tests/Bit.Blex.Tests.E2E/Bit.Blex.Tests.E2E.csproj -c Release

    - name: Install Playwright Chromium
      run: pwsh src/Blex/Tests/Bit.Blex.Tests.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

    - name: Run E2E tests
      env:
        BLEX_E2E_FRAMEWORK: ${{ matrix.framework }}
        BLEX_E2E_CONFIGURATION: Release
        BLEX_E2E_SKIP_BUILD: 1
      # Run from inside src so src/global.json's Microsoft.Testing.Platform runner setting applies.
      run: >
        cd src/Blex/Tests/Bit.Blex.Tests.E2E &&
        dotnet test -c Release --no-build
        --filter "FullyQualifiedName!~HybridModeTests"
        --report-trx --report-trx-filename blex-e2e-web-${{ matrix.framework }}.trx

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: blex-e2e-web-${{ matrix.framework }}
        path: '**/blex-e2e-web-*.trx'
        if-no-files-found: ignore

  # Stage 2 - Blazor Hybrid: the harness in a WinForms BlazorWebView (the WebView core MAUI Blazor Hybrid uses),
  # driven through WebView2's DevTools port.
  e2e-hybrid:
    needs: build-Blex
    name: Blex E2E - Blazor Hybrid (WebView2)
    runs-on: windows-2025

    steps:
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: src/global.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    # windows-2025 ships the Edge browser but not the WebView2 Runtime, which BlazorWebView needs.
    - name: Install the WebView2 Runtime
      shell: pwsh
      run: |
        $clientKey = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
        $version = (Get-ItemProperty $clientKey -ErrorAction SilentlyContinue).pv
        if (-not $version -or $version -eq '0.0.0.0') {
          $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
          Start-Process $installer -ArgumentList '/silent', '/install' -Wait
          $version = (Get-ItemProperty $clientKey -ErrorAction SilentlyContinue).pv
        }
        if (-not $version -or $version -eq '0.0.0.0') { throw 'The WebView2 Runtime did not install.' }
        Write-Host "WebView2 Runtime $version"

    - name: Build the hybrid harness host
      run: dotnet build src/Blex/Tests/Bit.Blex.Tests.Harness.Hybrid/Bit.Blex.Tests.Harness.Hybrid.csproj -c Release

    - name: Build the E2E suite
      run: dotnet build src/Blex/Tests/Bit.Blex.Tests.E2E/Bit.Blex.Tests.E2E.csproj -c Release

    # No Playwright browser download: it attaches to the WebView2 Runtime installed above.
    - name: Run hybrid E2E tests
      env:
        BLEX_E2E_CONFIGURATION: Release
        BLEX_E2E_SKIP_BUILD: 1
      run: >
        cd src/Blex/Tests/Bit.Blex.Tests.E2E &&
        dotnet test -c Release --no-build
        --filter "FullyQualifiedName~HybridModeTests"
        --report-trx --report-trx-filename blex-e2e-hybrid.trx

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: blex-e2e-hybrid
        path: '**/blex-e2e-hybrid.trx'
        if-no-files-found: ignore

  # Stage 3 - publishes the harness the way a WebAssembly app ships - trimmed, and in a second leg AOT-compiled -
  # failing on any trim analysis warning raised inside Bit.Blex, then runs the browser suite against that
  # published output. Trimming is where reflection-based snapshots, the JS bridges' [JSInvokable] callbacks and
  # the prerender state handoff break, and none of it is visible in a Debug build.
  publish-gate:
    needs: build-Blex
    name: Blex publish gate (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: trimmed
          properties: ''
        - name: aot
          properties: '-p:RunAOTCompilation=true'

    steps:
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: src/global.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Install wasm-tools
      if: matrix.name == 'aot'
      run: dotnet workload install wasm-tools

    - name: Publish the web harness host (fails on trim/AOT warnings from Bit.Blex)
      run: bash src/Blex/Tests/Bit.Blex.Tests.E2E/publish-gate.sh ${{ github.workspace }}/artifacts/harness-${{ matrix.name }} ${{ matrix.properties }}

    - name: Build the E2E suite
      run: dotnet build src/Blex/Tests/Bit.Blex.Tests.E2E/Bit.Blex.Tests.E2E.csproj -c Release

    - name: Install Playwright Chromium
      run: pwsh src/Blex/Tests/Bit.Blex.Tests.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

    - name: Run E2E tests against the published host
      env:
        BLEX_E2E_PUBLISHED_HOST: ${{ github.workspace }}/artifacts/harness-${{ matrix.name }}
      run: >
        cd src/Blex/Tests/Bit.Blex.Tests.E2E &&
        dotnet test -c Release --no-build
        --filter "FullyQualifiedName!~HybridModeTests"
        --report-trx --report-trx-filename blex-publish-${{ matrix.name }}.trx

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: blex-publish-${{ matrix.name }}
        path: '**/blex-publish-*.trx'
        if-no-files-found: ignore
