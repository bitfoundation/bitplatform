name: CI Templates E2E

on:
  workflow_dispatch:
    inputs:
      prerelease_packages:
        description: Bit packages of the latest CD Prerelease nuget packages run instead of nuget.org
        type: boolean
        default: false
      boilerplate_postgres:
        description: Boilerplate tests with PostgreSQL
        type: boolean
        default: true
      boilerplate_mysql:
        description: Boilerplate tests with MySQL
        type: boolean
        default: true
      boilerplate_mssql:
        description: Boilerplate tests with SQL Server
        type: boolean
        default: true
      boilerplate_workbench:
        description: Boilerplate Workbench tests
        type: boolean
        default: true
      boilerplate_configurations:
        description: Boilerplate configurations
        type: boolean
        default: true
  workflow_call:
    inputs:
      prerelease_packages:
        type: boolean
        default: false
      boilerplate_postgres:
        type: boolean
        default: true
      boilerplate_mysql:
        type: boolean
        default: true
      boilerplate_mssql:
        type: boolean
        default: true
      boilerplate_workbench:
        type: boolean
        default: true
      boilerplate_configurations:
        type: boolean
        default: true

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
  ConnectionStrings__mssqldb: 'Data Source=localhost; Initial Catalog=BoilerplateTestDb;Application Name=Boilerplate;TrustServerCertificate=True;User Id=sa;Password=P@ssw0rdP@ssw0rd;'

permissions:
  contents: read
  actions: read

jobs:

  test_boilerplate_postgres:
    name: create project with bit new with postgresql and test it
    if: ${{ inputs.boilerplate_postgres }}
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json
        dotnet-version: 10.0.x

    - name: Use prerelease packages
      if: inputs.prerelease_packages
      uses: ./.github/actions/use-prerelease-packages
      with:
        project-folder: src/Templates/Boilerplate/Bit.Boilerplate

    - name: Setup bit CLI
      uses: ./.github/actions/setup-bit-cli

    - name: Create project with bit new
      run: bit new TestPostgreSQL --framework net10.0 --database PostgreSQL --module Sales --signalR --aspire --redis --advancedTests --template-package "$BIT_TEMPLATE_PACKAGE" --yes --no-trust

    - name: Verify the new project passes its own CI's code checks
      working-directory: TestPostgreSQL
      run: |
        dotnet format whitespace --folder . --verify-no-changes
        dotnet build src/Server/TestPostgreSQL.Server.Api --no-restore --no-incremental -p:EnforceCodeStyleInBuild=true

    - name: Create appsettings.json for Client.Web
      run: |
        echo '{"ServerAddress":"/"}' > TestPostgreSQL/src/Client/TestPostgreSQL.Client.Web/wwwroot/appsettings.json

    - name: Run tests (Blazor Server)
      id: test-postgresql-blazorserver
      working-directory: TestPostgreSQL/src/Tests
      run: dotnet test

    - name: Upload Blazor Server test results on failure
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() && steps.test-postgresql-blazorserver.outcome == 'failure' }}
      with:
        name: postgres-tests-blazorserver
        path: ./TestPostgreSQL/src/Tests/TestResults
        retention-days: 14

    - name: Run UI tests (Blazor WebAssembly)
      id: test-postgresql-blazorwasm
      working-directory: TestPostgreSQL/src/Tests
      run: WebAppRender__BlazorMode=BlazorWebAssembly dotnet test --filter "TestCategory=UITest" --no-build

    - name: Upload Blazor WebAssembly test results on failure
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() && steps.test-postgresql-blazorwasm.outcome == 'failure' }}
      with:
        name: postgres-tests-blazorwasm
        path: ./TestPostgreSQL/src/Tests/TestResults
        retention-days: 14

    - name: Run UI tests (Blazor WebAssembly, prerender, Firefox)
      id: test-postgresql-blazorwasm-prerender
      working-directory: TestPostgreSQL/src/Tests
      run: WebAppRender__BlazorMode=BlazorWebAssembly WebAppRender__PrerenderEnabled=true ResponseCaching__EnableOutputCaching=true BROWSER=firefox dotnet test --filter "TestCategory=UITest" --no-build

    - name: Upload Blazor WebAssembly prerender test results on failure
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() && steps.test-postgresql-blazorwasm-prerender.outcome == 'failure' }}
      with:
        name: postgres-tests-blazorwasm-prerender-firefox
        path: ./TestPostgreSQL/src/Tests/TestResults
        retention-days: 14

    - name: Run UI tests (InvariantGlobalization)
      id: test-postgresql-invariantglobalization
      working-directory: TestPostgreSQL/src/Tests
      run: WebAppRender__BlazorMode=BlazorWebAssembly WebAppRender__PrerenderEnabled=true ResponseCaching__EnableOutputCaching=true dotnet test -p:InvariantGlobalization=true --filter "TestCategory=UITest&TestCategory!=Localization"

    - name: Upload InvariantGlobalization test results on failure
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() && steps.test-postgresql-invariantglobalization.outcome == 'failure' }}
      with:
        name: postgres-tests-invariantglobalization
        path: ./TestPostgreSQL/src/Tests/TestResults
        retention-days: 14

    - name: Run landing page tests (InvariantGlobalization)
      if: ${{ !cancelled() }}
      working-directory: TestPostgreSQL/src/LandingPage/TestPostgreSQL.LandingPage.Tests
      run: dotnet test -p:InvariantGlobalization=true

  test_boilerplate_mysql:
    name: create project with bit new with mysql and test it
    if: ${{ inputs.boilerplate_mysql }}
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json
        dotnet-version: 10.0.x

    - name: Use prerelease packages
      if: inputs.prerelease_packages
      uses: ./.github/actions/use-prerelease-packages
      with:
        project-folder: src/Templates/Boilerplate/Bit.Boilerplate

    - name: Setup bit CLI
      uses: ./.github/actions/setup-bit-cli

    - name: Create project with bit new
      run: bit new TestMySql --framework net10.0 --database MySql --module Sales --signalR --aspire --redis --advancedTests --template-package "$BIT_TEMPLATE_PACKAGE" --yes --no-trust

    - name: Create appsettings.json for Client.Web
      run: |
        echo '{"ServerAddress":"/"}' > TestMySql/src/Client/TestMySql.Client.Web/wwwroot/appsettings.json

    - name: Run tests (Blazor Server)
      id: test-mysql-blazorserver
      working-directory: TestMySql/src/Tests
      run: dotnet test

    - name: Upload Blazor Server test results on failure
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() && steps.test-mysql-blazorserver.outcome == 'failure' }}
      with:
        name: mysql-tests-blazorserver
        path: ./TestMySql/src/Tests/TestResults
        retention-days: 14

    - name: Run UI tests (Blazor WebAssembly)
      id: test-mysql-blazorwasm
      working-directory: TestMySql/src/Tests
      run: WebAppRender__BlazorMode=BlazorWebAssembly dotnet test --filter "TestCategory=UITest" --no-build

    - name: Upload Blazor WebAssembly test results on failure
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() && steps.test-mysql-blazorwasm.outcome == 'failure' }}
      with:
        name: mysql-tests-blazorwasm
        path: ./TestMySql/src/Tests/TestResults
        retention-days: 14

    - name: Run UI tests (Blazor WebAssembly, prerender, Firefox)
      id: test-mysql-blazorwasm-prerender
      working-directory: TestMySql/src/Tests
      run: WebAppRender__BlazorMode=BlazorWebAssembly WebAppRender__PrerenderEnabled=true ResponseCaching__EnableOutputCaching=true BROWSER=firefox dotnet test --filter "TestCategory=UITest" --no-build

    - name: Upload Blazor WebAssembly prerender test results on failure
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() && steps.test-mysql-blazorwasm-prerender.outcome == 'failure' }}
      with:
        name: mysql-tests-blazorwasm-prerender-firefox
        path: ./TestMySql/src/Tests/TestResults
        retention-days: 14

    - name: Run UI tests (InvariantGlobalization)
      id: test-mysql-invariantglobalization
      working-directory: TestMySql/src/Tests
      run: WebAppRender__BlazorMode=BlazorWebAssembly WebAppRender__PrerenderEnabled=true ResponseCaching__EnableOutputCaching=true dotnet test -p:InvariantGlobalization=true --filter "TestCategory=UITest&TestCategory!=Localization"

    - name: Upload InvariantGlobalization test results on failure
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() && steps.test-mysql-invariantglobalization.outcome == 'failure' }}
      with:
        name: mysql-tests-invariantglobalization
        path: ./TestMySql/src/Tests/TestResults
        retention-days: 14

  test_boilerplate_mssql:
    name: create project with bit new with sql server and test it
    if: ${{ inputs.boilerplate_mssql }}
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - name: Use prerelease packages
      if: inputs.prerelease_packages
      uses: ./.github/actions/use-prerelease-packages
      with:
        project-folder: src/Templates/Boilerplate/Bit.Boilerplate

    - name: Setup bit CLI
      uses: ./.github/actions/setup-bit-cli

    - name: Create project with bit new
      run: bit new TestSqlServer --framework net11.0 --database SqlServer --module Admin --signalR --aspire false --api Standalone --advancedTests --template-package "$BIT_TEMPLATE_PACKAGE" --yes --no-trust

    - name: Create appsettings.json for Client.Web
      run: |
        echo '{"ServerAddress":"/"}' > TestSqlServer/src/Client/TestSqlServer.Client.Web/wwwroot/appsettings.json

    - name: Install sql server
      uses: potatoqualitee/mssqlsuite@bc850f242e5fe551e36cea6fa4bed608c58fa489 # v2
      with:
        version: 2025
        install: sqlengine
        sa-password: P@ssw0rdP@ssw0rd
        show-log: true

    - name: Run tests (Blazor Server)
      id: test-mssql-blazorserver
      working-directory: TestSqlServer/src/Tests
      run: dotnet test

    - name: Upload Blazor Server test results on failure
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() && steps.test-mssql-blazorserver.outcome == 'failure' }}
      with:
        name: sqlserver-tests-blazorserver
        path: ./TestSqlServer/src/Tests/TestResults
        retention-days: 14

    - name: Run UI tests (Blazor WebAssembly)
      id: test-mssql-blazorwasm
      working-directory: TestSqlServer/src/Tests
      run: WebAppRender__BlazorMode=BlazorWebAssembly dotnet test --filter "TestCategory=UITest" --no-build

    - name: Upload Blazor WebAssembly test results on failure
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() && steps.test-mssql-blazorwasm.outcome == 'failure' }}
      with:
        name: sqlserver-tests-blazorwasm
        path: ./TestSqlServer/src/Tests/TestResults
        retention-days: 14

    - name: Run UI tests (Blazor WebAssembly, prerender, Firefox)
      id: test-mssql-blazorwasm-prerender
      working-directory: TestSqlServer/src/Tests
      run: WebAppRender__BlazorMode=BlazorWebAssembly WebAppRender__PrerenderEnabled=true ResponseCaching__EnableOutputCaching=true BROWSER=firefox dotnet test --filter "TestCategory=UITest" --no-build

    - name: Upload Blazor WebAssembly prerender test results on failure
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() && steps.test-mssql-blazorwasm-prerender.outcome == 'failure' }}
      with:
        name: sqlserver-tests-blazorwasm-prerender-firefox
        path: ./TestSqlServer/src/Tests/TestResults
        retention-days: 14

    - name: Run landing page tests
      if: ${{ !cancelled() }}
      working-directory: TestSqlServer/src/LandingPage/TestSqlServer.LandingPage.Tests
      run: dotnet test

    # This job deliberately has no InvariantGlobalization run: Microsoft.Data.SqlClient throws
    # "Globalization Invariant Mode is not supported." out of SqlConnection.Open, so the whole assembly aborts in
    # its initializer before a single browser starts. The PostgreSQL job above covers that configuration.

  test_boilerplate_workbench:
    name: create project with bit new and test its workbench
    if: ${{ inputs.boilerplate_workbench }}
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - name: Use prerelease packages
      if: inputs.prerelease_packages
      uses: ./.github/actions/use-prerelease-packages
      with:
        project-folder: src/Templates/Boilerplate/Bit.Boilerplate

    - name: Setup bit CLI
      uses: ./.github/actions/setup-bit-cli

    # With the options that add to the Workbench (the Admin dashboard, the ads' upgrade section, the tenants, offline
    # data and the rest) on, as they are in the template's own source the Workbench tests are written in. The Workbench
    # reads no database, so the default one is enough.
    - name: Create project with bit new
      run: bit new TestWorkbench --framework net11.0 --module Admin --multitenant --signalR --notification --ads --offlineDb --appInsights --advancedTests --template-package "$BIT_TEMPLATE_PACKAGE" --yes --no-trust

    - name: Run Workbench tests
      id: test-workbench
      working-directory: TestWorkbench/src/WorkbenchTests
      run: dotnet test

    - name: Upload Workbench test results on failure
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ !cancelled() && steps.test-workbench.outcome == 'failure' }}
      with:
        name: tests-workbench
        path: ./TestWorkbench/src/WorkbenchTests/TestResults
        retention-days: 14

  build_boilerplate_configurations:
    name: create several projects with bit new and build them
    if: ${{ inputs.boilerplate_configurations }}
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - name: Use prerelease packages
      if: inputs.prerelease_packages
      uses: ./.github/actions/use-prerelease-packages
      with:
        project-folder: src/Templates/Boilerplate/Bit.Boilerplate

    - name: Setup bit CLI
      uses: ./.github/actions/setup-bit-cli

    - name: Set the git identity bit new commits with
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Build backend setup options
      working-directory: ${{ runner.temp }}
      env:
        EnforceCodeStyleInBuild: true
      run: |
        bit new TestStandalone --framework net11.0 --api Standalone --template-package "$BIT_TEMPLATE_PACKAGE" --yes --no-trust --no-format --no-browsers
        rm -r "TestStandalone"
        bit new TestIntegrated --framework net11.0 --api Integrated --template-package "$BIT_TEMPLATE_PACKAGE" --yes --no-trust --no-format --no-browsers
        rm -r "TestIntegrated"

    - name: Build sample configuration 1
      working-directory: ${{ runner.temp }}
      run: |
        bit new MyCompany.TestProject --framework net11.0 --database SqlServer --filesStorage AzureBlobStorage --api Integrated --captcha reCaptcha --module Admin --offlineDb --appInsights --sentry --signalR --notification --cloudflare --ads --aspire --redis --multitenant --brouter --platforms web,android --template-package "$BIT_TEMPLATE_PACKAGE" --yes --no-trust --no-format --no-browsers -p:InvariantGlobalization=false -p:Environment=Staging -p:EnforceCodeStyleInBuild=true
        cd MyCompany.TestProject
        git log --oneline --decorate --all
        git status --short
        test "$(git branch --show-current)" = main
        test -z "$(git branch --list develop)"
        test -z "$(git status --porcelain)"
        cd ..
        rm -r "MyCompany.TestProject"

    - name: Build sample configuration 2
      working-directory: ${{ runner.temp }}
      run: |
        bit new TestProject2 --framework net11.0 --database Other --filesStorage S3 --api Standalone --captcha None --module None --offlineDb false --appInsights false --sentry false --signalR false --notification false --cloudflare false --ads false --aspire true --redis false --multitenant false --brouter false --platforms web,android --template-package "$BIT_TEMPLATE_PACKAGE" --yes --no-trust --no-browsers -p:InvariantGlobalization=true -p:Environment=Development -p:EnforceCodeStyleInBuild=true
        rm -r "TestProject2"

  build_blazorempty_configurations:
    name: build blazorempty based projects
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Install wasm
      run: cd src && dotnet workload install wasm-tools

    - name: Use prerelease packages
      if: inputs.prerelease_packages
      uses: ./.github/actions/use-prerelease-packages
      with:
        project-folder: .

    - name: Prepare BlazorEmpty template
      run: |
        cd src/Templates/BlazorEmpty && dotnet build -c Release
        dotnet pack -c Release -o . -p:ReleaseVersion=0.0.0 -p:PackageVersion=0.0.0
        dotnet new install Bit.BlazorEmpty.0.0.0.nupkg && cd ../../../

    - name: Create projects from BlazorEmpty template
      run: |
        dotnet new bit-empty --name AutoGlobal --interactivity Auto --all-interactive
        dotnet new bit-empty --name SsrPerPage --interactivity None

    - name: Build blazor empty based projects
      run: |
        dotnet build AutoGlobal/AutoGlobal.sln
        dotnet build SsrPerPage/SsrPerPage.csproj
