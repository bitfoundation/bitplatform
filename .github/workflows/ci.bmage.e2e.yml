name: CI Bmage E2E

# The demo website, the hosting samples and the published lazy loading sample - trimmed, and in a job of its own
# AOT-compiled - driven in Chromium, and the MAUI sample driven in its WebView2. It takes far longer than the build-and-unit pipeline (ci.bmage.yml), so
# it runs only when started by hand. See src/Utilities/Bmage/Tests/Bit.Bmage.Tests.E2E/README.md for what the suite covers and
# how to run it locally.

on:
  workflow_dispatch:
  workflow_call:

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

jobs:

  # The bit-bmage.js bridge, the browser's own codecs, canvas rendering, editor input and every demo page.
  e2e:
    name: Bmage E2E (Chromium)
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Install wasm-tools
      run: cd src && dotnet workload install wasm-tools

    - name: Setup bit CLI
      uses: ./.github/actions/setup-bit-cli

    - name: Collect the AOT profile
      run: bit aot-profile src/Utilities/Bmage/Demo/Server/Bit.Bmage.Demo.Server.csproj -o bmage.aotprofile --include Bit.Bmage --include Bit.Bmage.Blazor -p:InvariantGlobalization=true

    # The tests drive the demo published the way cd.bmage.demo.yml publishes it, not a build output: only a publish
    # trims the WebAssembly client, and an interop payload the trimmer breaks - an anonymous type whose constructor
    # lost its parameter names, a getter nothing but System.Text.Json reads - works in every build and fails only there.
    - name: Publish the demo
      run: dotnet publish src/Utilities/Bmage/Demo/Server/Bit.Bmage.Demo.Server.csproj -c Release -o demo -p:InvariantGlobalization=true -p:WasmAotProfilePath="${{ github.workspace }}/bmage.aotprofile"

    # Published rather than built for the same reason: LazyLoadingTests drives what an app that lazy loads Bmage ships,
    # trimmed, with the lazy marks a publish writes into its boot configuration. Not AOT-compiled here; lazy-loading-aot
    # below does that.
    - name: Publish the lazy loading sample
      run: dotnet publish src/Utilities/Bmage/Samples/Lazy/Bit.Bmage.Samples.Lazy/Bit.Bmage.Samples.Lazy.csproj -c Release

    - name: Build the E2E suite
      run: dotnet build src/Utilities/Bmage/Tests/Bit.Bmage.Tests.E2E/Bit.Bmage.Tests.E2E.csproj -c Release

    # SamplesBrowserTests starts each hosting sample itself (Interactive Server, WebAssembly and Auto); with
    # BMAGE_E2E_SKIP_BUILD set below it expects them built already.
    - name: Build the hosting samples
      run: |
        dotnet build src/Utilities/Bmage/Samples/Server/Bit.Bmage.Samples.Server.csproj -c Release
        dotnet build src/Utilities/Bmage/Samples/Wasm/Bit.Bmage.Samples.Wasm/Bit.Bmage.Samples.Wasm.csproj -c Release
        dotnet build src/Utilities/Bmage/Samples/Auto/Bit.Bmage.Samples.Auto/Bit.Bmage.Samples.Auto.csproj -c Release

    - name: Install Playwright Chromium
      run: pwsh src/Utilities/Bmage/Tests/Bit.Bmage.Tests.E2E/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

    - name: Start the published demo
      run: |
        cd demo
        nohup dotnet Bit.Bmage.Demo.Server.dll --urls http://127.0.0.1:5000 > ../demo.log 2>&1 &
        for attempt in $(seq 1 60); do
          curl --silent --fail --output /dev/null http://127.0.0.1:5000/ && exit 0
          sleep 2
        done
        cat ../demo.log
        exit 1

    - name: Run E2E tests
      env:
        BMAGE_E2E_HOST_URL: http://127.0.0.1:5000
        BMAGE_E2E_CONFIGURATION: Release
        BMAGE_E2E_SKIP_BUILD: 1
      # Run from inside src so src/global.json's Microsoft.Testing.Platform runner setting applies.
      run: >
        cd src/Utilities/Bmage/Tests/Bit.Bmage.Tests.E2E &&
        dotnet test -c Release --no-build
        --filter "FullyQualifiedName!~SamplesMauiTests"
        --report-trx --report-trx-filename bmage-e2e.trx

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bmage-e2e
        path: |
          **/bmage-e2e.trx
          demo.log
        if-no-files-found: ignore

  # The lazy loading sample published with AOT, as an app using Bmage may be: its project file leaves the lazy marks out
  # then, as docs/getting-started.md says an AOT build must, and LazyLoadingTests checks that it loads Bmage with the app
  # and works all the same. It needs no demo: the tests start the published sample themselves.
  lazy-loading-aot:
    name: Bmage lazy loading (AOT)
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Install wasm-tools
      run: cd src && dotnet workload install wasm-tools

    - name: Publish the lazy loading sample with AOT
      run: dotnet publish src/Utilities/Bmage/Samples/Lazy/Bit.Bmage.Samples.Lazy/Bit.Bmage.Samples.Lazy.csproj -c Release -p:RunAOTCompilation=true

    - name: Build the E2E suite
      run: dotnet build src/Utilities/Bmage/Tests/Bit.Bmage.Tests.E2E/Bit.Bmage.Tests.E2E.csproj -c Release

    - name: Install Playwright Chromium
      run: pwsh src/Utilities/Bmage/Tests/Bit.Bmage.Tests.E2E/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

    - name: Run lazy loading E2E tests
      env:
        BMAGE_E2E_CONFIGURATION: Release
        BMAGE_E2E_SKIP_BUILD: 1
        BMAGE_E2E_LAZY_AOT: 1
      # Run from inside src so src/global.json's Microsoft.Testing.Platform runner setting applies.
      run: >
        cd src/Utilities/Bmage/Tests/Bit.Bmage.Tests.E2E &&
        dotnet test -c Release --no-build
        --filter "FullyQualifiedName~LazyLoadingTests"
        --report-trx --report-trx-filename bmage-e2e-lazy-aot.trx

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bmage-e2e-lazy-aot
        path: '**/bmage-e2e-lazy-aot.trx'
        if-no-files-found: ignore

  # The MAUI sample as a Windows app (Blazor Hybrid), its WebView2 driven over the DevTools Protocol.
  e2e-maui:
    name: Bmage E2E - MAUI sample (Windows, WebView2)
    runs-on: windows-2025
    timeout-minutes: 60

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    # Every workload the MAUI project's target frameworks need on Windows: restore evaluates all of them, even for a
    # build of the Windows one alone.
    - name: dotnet workload restore
      run: cd src/Utilities/Bmage/Samples/MAUI && dotnet workload restore

    # windows-2025 ships the Edge browser but not the WebView2 Runtime, which BlazorWebView needs.
    - name: Install the WebView2 Runtime
      shell: pwsh
      run: |
        $clientKey = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
        $version = (Get-ItemProperty $clientKey -ErrorAction SilentlyContinue).pv
        if (-not $version -or $version -eq '0.0.0.0') {
          $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
          Start-Process $installer -ArgumentList '/silent', '/install' -Wait
          $version = (Get-ItemProperty $clientKey -ErrorAction SilentlyContinue).pv
        }
        if (-not $version -or $version -eq '0.0.0.0') { throw 'The WebView2 Runtime did not install.' }
        Write-Host "WebView2 Runtime $version"

    # The runner is elevated, and an elevated app's WebView2 ignores WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS, which is how
    # the suite opens the debugging port elsewhere. The machine-wide policy is honoured; "*" covers whichever app id
    # WebView2 resolves the sample to, and nothing else on this throwaway runner uses WebView2.
    - name: Open the WebView2 debugging port by policy
      shell: pwsh
      run: |
        $key = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
        New-Item -Path $key -Force | Out-Null
        Set-ItemProperty -Path $key -Name '*' -Value '--remote-debugging-port=9333'

    # Unpackaged, with the Windows App SDK inside it, so the suite can start the executable without installing an MSIX.
    - name: Build the MAUI sample
      run: >
        dotnet build src/Utilities/Bmage/Samples/MAUI/Bit.Bmage.Samples.Maui.csproj -c Release
        -f net11.0-windows10.0.19041.0 -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true

    - name: Build the E2E suite
      run: dotnet build src/Utilities/Bmage/Tests/Bit.Bmage.Tests.E2E/Bit.Bmage.Tests.E2E.csproj -c Release

    # No Playwright browser download: it attaches to the WebView2 Runtime installed above.
    - name: Run MAUI E2E tests
      env:
        BMAGE_E2E_CONFIGURATION: Release
        BMAGE_E2E_SKIP_BUILD: 1
        BMAGE_E2E_MAUI_DEBUGGING_PORT: 9333
      run: >
        cd src/Utilities/Bmage/Tests/Bit.Bmage.Tests.E2E &&
        dotnet test -c Release --no-build
        --filter "FullyQualifiedName~SamplesMauiTests"
        --report-trx --report-trx-filename bmage-e2e-maui.trx

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bmage-e2e-maui
        path: '**/bmage-e2e-maui.trx'
        if-no-files-found: ignore
