name: All Other E2E CI

on:
  workflow_dispatch:
    inputs:
      prerelease_packages:
        description: Bit packages of the latest CD Prerelease nuget packages run instead of nuget.org
        type: boolean
        default: false
      blazorui:
        description: BlazorUI E2E suite
        type: boolean
        default: true
      bswup:
        description: Bswup E2E suite
        type: boolean
        default: true
      butil:
        description: Butil E2E suite
        type: boolean
        default: true
      brouter:
        description: Brouter E2E suite
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: all-other-e2e-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  templates_e2e:
    name: templates e2e
    uses: ./.github/workflows/ci.templates.e2e.yml
    with:
      prerelease_packages: ${{ inputs.prerelease_packages }}

  blazorui_e2e:
    name: blazorui e2e
    if: ${{ inputs.blazorui }}
    uses: ./.github/workflows/ci.blazorui.e2e.yml

  bswup_e2e:
    name: bswup e2e
    if: ${{ inputs.bswup }}
    uses: ./.github/workflows/ci.bswup.e2e.yml

  butil_e2e:
    name: butil e2e
    if: ${{ inputs.butil }}
    uses: ./.github/workflows/ci.butil.e2e.yml

  brouter_e2e:
    name: brouter e2e
    if: ${{ inputs.brouter }}
    uses: ./.github/workflows/ci.brouter.e2e.yml
