name: bit platform CI - Bdnd

# Build, unit tests and MCP server tests. The browser suite lives in bit.ci.Bdnd.e2e.yml and runs on demand only.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
    - 'src/Utilities/Bdnd/**'
    # The demo's code highlighter, linked in from there.
    - 'src/Utilities/Shared/Demo/**'

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

concurrency:
  group: bit-ci-Bdnd-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-Bdnd:
    if: startsWith(github.event.pull_request.title, 'Prerelease') != true && startsWith(github.event.pull_request.title, 'Release') != true && startsWith(github.event.pull_request.title, 'Version') != true
    name: build Bit.Bdnd
    runs-on: ubuntu-26.04

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: dotnet workload restore
      run:  cd src/Utilities/Bdnd && dotnet workload restore

    - name: dotnet build
      run: dotnet build src/Utilities/Bdnd/Bit.Bdnd.slnx

    - name: dotnet test
      # Run from inside src so src/global.json's "test" runner setting applies
      # (from the repo root the SDK falls back to the unsupported VSTest path).
      run: cd src/Utilities/Bdnd/Tests/Bit.Bdnd.Tests && dotnet test --no-build

    - name: dotnet test (MCP server)
      run: cd src/Utilities/Bdnd/Tests/Bit.Bdnd.Tests.Mcp && dotnet test --no-build
