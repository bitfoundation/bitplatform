name: CI SourceGenerators

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
    - 'src/Toolings/SourceGenerators/**'

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

concurrency:
  group: bit-ci-SourceGenerators-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-SourceGenerators:
    if: startsWith(github.event.pull_request.title, 'Prerelease') != true && startsWith(github.event.pull_request.title, 'Release') != true && startsWith(github.event.pull_request.title, 'Version') != true
    name: build Bit.SourceGenerators
    runs-on: ubuntu-26.04

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - name: dotnet build
      run: dotnet build src/Toolings/SourceGenerators/Bit.SourceGenerators.slnx

    - name: dotnet test
      run: cd src/Toolings/SourceGenerators/Tests/Bit.SourceGenerators.Tests && dotnet test --no-build
