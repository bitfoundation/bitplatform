name: bit platform CI - BbScanner

# The build/unit stage gates the browser stage below, so a broken build fails once instead of burning a second
# runner. See src/BbScanner/Tests/Bit.BbScanner.Tests.E2E/README.md for what the browser suite proves and how to run it
# locally.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
    - 'src/BbScanner/**'

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

jobs:

  # Stage 1 - build, decoder and component tests, MCP server tests. Every stage below depends on this one, so its
  # `if:` is the single switch that skips the whole pipeline on Release/Prerelease/Version PRs.
  build-BbScanner:
    if: startsWith(github.event.pull_request.title, 'Prerelease') != true && startsWith(github.event.pull_request.title, 'Release') != true && startsWith(github.event.pull_request.title, 'Version') != true
    name: build Bit.BbScanner
    runs-on: ubuntu-24.04

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: src/global.json

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 9.0.x

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 8.0.x

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: dotnet workload restore
      run:  cd src/BbScanner && dotnet workload restore

    - name: dotnet build
      run: dotnet build src/BbScanner/Bit.BbScanner.slnx

    - name: dotnet test (decoder + component tests, net8.0/net9.0/net10.0)
      # Run from inside src so src/global.json's "test" runner setting applies
      # (from the repo root the SDK falls back to the unsupported VSTest path).
      run: cd src/BbScanner/Tests/Bit.BbScanner.Tests && dotnet test --no-build

    - name: dotnet test (MCP server)
      run: cd src/BbScanner/Tests/Bit.BbScanner.Tests.Mcp && dotnet test --no-build

  # Stage 2 - the demo app in Chromium whose camera is a generated video file: continuous scanning of four
  # symbologies, the camera lifecycle, permissions, keyboard and layout, and every demo page, against the Release
  # build that ships.
  e2e:
    needs: build-BbScanner
    name: BbScanner E2E (Chromium)
    runs-on: ubuntu-24.04

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: src/global.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Build the demo and the E2E suite
      run: |
        dotnet build src/BbScanner/Bit.BbScanner.Demo/Server/Bit.BbScanner.Demo.Server.csproj -c Release
        dotnet build src/BbScanner/Tests/Bit.BbScanner.Tests.E2E/Bit.BbScanner.Tests.E2E.csproj -c Release

    - name: Install Playwright Chromium
      run: pwsh src/BbScanner/Tests/Bit.BbScanner.Tests.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

    - name: Run E2E tests
      # Run from inside src so src/global.json's Microsoft.Testing.Platform runner setting applies.
      run: >
        cd src/BbScanner/Tests/Bit.BbScanner.Tests.E2E &&
        dotnet test -c Release --no-build
        --report-trx --report-trx-filename bbscanner-e2e.trx

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bbscanner-e2e
        path: '**/bbscanner-e2e.trx'
        if-no-files-found: ignore
