name: bit platform CI - Bortable E2E

# The browser suite: the demo (prerendered, then running on WebAssembly) and the published lazy loading sample -
# trimmed, and AOT-compiled in a job of its own - driven in Chromium with Playwright. It takes far longer than the
# build-and-unit pipeline (bit.ci.Bortable.yml), so it runs only when started by hand. See
# src/Utilities/Bortable/Tests/Bit.Bortable.Tests.E2E/README.md for what it proves and how to run it locally.

on:
  workflow_dispatch:
  workflow_call:

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

jobs:

  e2e:
    name: Bortable E2E (Chromium)
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: dotnet workload restore
      run: cd src/Utilities/Bortable && dotnet workload restore

    - name: Build the demo, publish the lazy loading sample and build the E2E suite
      # The sample is published rather than built: LazyLoadingTests drives what an app that lazy loads ships, trimmed.
      run: |
        dotnet build src/Utilities/Bortable/Demo/Server/Bit.Bortable.Demo.Server.csproj -c Release
        dotnet publish src/Utilities/Bortable/Samples/Lazy/Bit.Bortable.Samples.Lazy/Bit.Bortable.Samples.Lazy.csproj -c Release
        dotnet build src/Utilities/Bortable/Tests/Bit.Bortable.Tests.E2E/Bit.Bortable.Tests.E2E.csproj -c Release

    - name: Install Playwright Chromium
      run: pwsh src/Utilities/Bortable/Tests/Bit.Bortable.Tests.E2E/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

    - name: Run E2E tests
      # Run from inside src so src/global.json's Microsoft.Testing.Platform runner setting applies.
      run: >
        cd src/Utilities/Bortable/Tests/Bit.Bortable.Tests.E2E &&
        dotnet test -c Release --no-build
        --report-trx --report-trx-filename bortable-e2e.trx

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bortable-e2e
        path: '**/bortable-e2e.trx'
        if-no-files-found: ignore

  # The README's AOT setup: the sample's project file leaves the lazy mark and the router's switch out of an AOT build,
  # which loads Bit.Bortable with the app. The lazy loading tests then check (BORTABLE_E2E_LAZY_AOT) that nothing is
  # downloaded on demand and that the board works all the same.
  lazy-loading-aot:
    name: Bortable lazy loading (AOT)
    runs-on: ubuntu-26.04
    # The publish compiles the entire client ahead of time.
    timeout-minutes: 60

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    # From inside src, so src/global.json picks the SDK: the workload has to be installed for the SDK that publishes.
    - name: Install wasm-tools
      run: cd src && dotnet workload install wasm-tools

    # Every test opens the session the suite shares, which starts the demo before anything else. These tests do not
    # drive it, so its build output is enough here.
    - name: Build the demo, publish the lazy loading sample with AOT and build the E2E suite
      run: |
        dotnet build src/Utilities/Bortable/Demo/Server/Bit.Bortable.Demo.Server.csproj -c Release
        dotnet publish src/Utilities/Bortable/Samples/Lazy/Bit.Bortable.Samples.Lazy/Bit.Bortable.Samples.Lazy.csproj -c Release -p:RunAOTCompilation=true
        dotnet build src/Utilities/Bortable/Tests/Bit.Bortable.Tests.E2E/Bit.Bortable.Tests.E2E.csproj -c Release

    - name: Install Playwright Chromium
      run: pwsh src/Utilities/Bortable/Tests/Bit.Bortable.Tests.E2E/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

    - name: Run the lazy loading tests against the AOT publish
      env:
        BORTABLE_E2E_LAZY_AOT: 1
      # Run from inside src so src/global.json's Microsoft.Testing.Platform runner setting applies.
      run: >
        cd src/Utilities/Bortable/Tests/Bit.Bortable.Tests.E2E &&
        dotnet test -c Release --no-build --filter "FullyQualifiedName~LazyLoadingTests"
        --report-trx --report-trx-filename bortable-e2e-lazy-aot.trx

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bortable-e2e-lazy-aot
        path: '**/bortable-e2e-lazy-aot.trx'
        if-no-files-found: ignore
