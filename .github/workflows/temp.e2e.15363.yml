name: Temp E2E 15363

on:
  push:
    branches: [ 'yasmoradi/15363/bit-json-cli-versions' ]

permissions:
  contents: read

jobs:
  e2e:
    name: project bit E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-26.04, windows-2025, macOS-26 ]

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - name: Pack three versions of bit
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/feed"
        for v in 2301 2302 2303; do
          BitCliBuildRunUrl=https://lab.invalid/runs/$v dotnet pack src/Toolings/Cli/Bit.Cli/Bit.Cli.csproj -c Release -p:ReleaseVersion=11.0.0-pre-$v -o "$RUNNER_TEMP/feed"
        done
        ls -la "$RUNNER_TEMP/feed"

    - name: Run the scenarios
      shell: bash
      run: bash .github/e2e-15363.sh "$RUNNER_TEMP/feed" 11.0.0-pre-2301 11.0.0-pre-2302 11.0.0-pre-2303
