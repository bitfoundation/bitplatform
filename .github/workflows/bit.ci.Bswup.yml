name: bit platform CI - Bswup

# Build plus the MCP, hosting and JS unit tests. The browser E2E suites and the published-output gate are in
# bit.ci.Bswup.e2e.yml and run on demand only.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
    - 'src/Bswup/**'

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

jobs:

  build-Bswup:
    if: startsWith(github.event.pull_request.title, 'Prerelease') != true && startsWith(github.event.pull_request.title, 'Release') != true && startsWith(github.event.pull_request.title, 'Version') != true
    name: build Bit.Bswup
    runs-on: ubuntu-24.04

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: src/global.json

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 9.0.x

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 8.0.x

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm
        # Both lock files feed the shared npm cache: Bit.Bswup's drives the
        # InstallNodejsDependencies build step, the tests' drives `npm ci` below.
        cache-dependency-path: |
          src/Bswup/Bit.Bswup/package-lock.json
          src/Bswup/Tests/bit-bswup-js/package-lock.json

    - name: dotnet workload restore
      run:  cd src/Bswup && dotnet workload restore

    - name: InstallNodejsDependencies
      continue-on-error: true # Error MSB4057, not all csproj files have InstallNodejsDependencies target.
      run: dotnet build src/Bswup/Bit.Bswup.slnx -t:InstallNodejsDependencies -m:1 -f net10.0

    - name: dotnet build
      run: dotnet build src/Bswup/Bit.Bswup.slnx

    - name: dotnet test (MCP server)
      run: cd src/Bswup/Tests/Bit.Bswup.Tests.Mcp && dotnet test -f net10.0 --no-build

    - name: dotnet test (hosting - served assets, host documents and BswupProgress over HTTP, net8.0/net9.0/net10.0)
      run: cd src/Bswup/Tests/Bit.Bswup.Tests.Hosting && dotnet test --no-build

    # Runs against Bit.Bswup/wwwroot/*.js, which the build above produces, so this also covers
    # the build step itself (e.g. the minifier re-introducing downleveled syntax).
    - name: JS tests (service worker, page script, progress UI)
      run: |
        cd src/Bswup/Tests/bit-bswup-js
        npm ci
        npm test
