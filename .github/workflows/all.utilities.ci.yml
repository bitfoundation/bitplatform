name: All Utilities CI

on:
  workflow_dispatch:
    inputs:
      nuget_packages:
        description: NuGet packages
        type: boolean
        default: true

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

jobs:

  build_nuget_packages:
    name: build utilities nuget packages locally
    if: ${{ inputs.nuget_packages }}
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Build and pack Bmotion
      run: |
        dotnet build src/Utilities/Bmotion/Bit.Bmotion/Bit.Bmotion.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bmotion/Bit.Bmotion/Bit.Bmotion.csproj --output ./packages --configuration Release

    - name: Build and pack Bmage
      run: |
        dotnet build src/Utilities/Bmage/Bit.Bmage/Bit.Bmage.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bmage/Bit.Bmage/Bit.Bmage.csproj --output ./packages --configuration Release

    - name: Build and pack Bmage.Blazor
      run: |
        dotnet build src/Utilities/Bmage/Bit.Bmage.Blazor/Bit.Bmage.Blazor.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bmage/Bit.Bmage.Blazor/Bit.Bmage.Blazor.csproj --output ./packages --configuration Release

    - name: Build and pack Bmage.Bink
      run: |
        dotnet build src/Utilities/Bmage/Bit.Bmage.Bink/Bit.Bmage.Bink.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bmage/Bit.Bmage.Bink/Bit.Bmage.Bink.csproj --output ./packages --configuration Release

    - name: Build and pack Bmage.BbScanner
      run: |
        dotnet build src/Utilities/Bmage/Bit.Bmage.BbScanner/Bit.Bmage.BbScanner.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bmage/Bit.Bmage.BbScanner/Bit.Bmage.BbScanner.csproj --output ./packages --configuration Release

    - name: Build and pack Bsqlite
      run: |
        dotnet build src/Utilities/Bsqlite/Bit.Bsqlite/Bit.Bsqlite.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bsqlite/Bit.Bsqlite/Bit.Bsqlite.csproj --output ./packages --configuration Release

    - name: Build and pack Bsqlite.Testing
      run: |
        dotnet build src/Utilities/Bsqlite/Bit.Bsqlite.Testing/Bit.Bsqlite.Testing.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bsqlite/Bit.Bsqlite.Testing/Bit.Bsqlite.Testing.csproj --output ./packages --configuration Release

    - name: Build and pack Bink
      run: |
        dotnet build src/Utilities/Bink/Bit.Bink/Bit.Bink.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bink/Bit.Bink/Bit.Bink.csproj --output ./packages --configuration Release

    - name: Build and pack Balette
      run: |
        dotnet build src/Utilities/Balette/Bit.Balette/Bit.Balette.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Balette/Bit.Balette/Bit.Balette.csproj --output ./packages --configuration Release

    - name: Build and pack BbScanner
      run: |
        dotnet build src/Utilities/BbScanner/Bit.BbScanner/Bit.BbScanner.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/BbScanner/Bit.BbScanner/Bit.BbScanner.csproj --output ./packages --configuration Release

    # Its Android target only, the one a Linux runner builds; the release workflows pack every platform on Windows.
    - name: Build and pack BbScanner.Maui
      run: |
        (cd src/Utilities/BbScanner/Bit.BbScanner.Maui && dotnet workload restore)
        dotnet build src/Utilities/BbScanner/Bit.BbScanner.Maui/Bit.BbScanner.Maui.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/BbScanner/Bit.BbScanner.Maui/Bit.BbScanner.Maui.csproj --output ./packages --configuration Release

    - name: Build and pack BlazeDb
      run: |
        dotnet build src/Utilities/BlazeDb/Bit.BlazeDb/Bit.BlazeDb.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/BlazeDb/Bit.BlazeDb/Bit.BlazeDb.csproj --output ./packages --configuration Release

    - name: Build and pack BlazeDb.EntityFrameworkCore
      run: |
        dotnet build src/Utilities/BlazeDb/Bit.BlazeDb.EntityFrameworkCore/Bit.BlazeDb.EntityFrameworkCore.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/BlazeDb/Bit.BlazeDb.EntityFrameworkCore/Bit.BlazeDb.EntityFrameworkCore.csproj --output ./packages --configuration Release

    - name: Build and pack BlazeDb.Blex
      run: |
        dotnet build src/Utilities/BlazeDb/Bit.BlazeDb.Blex/Bit.BlazeDb.Blex.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/BlazeDb/Bit.BlazeDb.Blex/Bit.BlazeDb.Blex.csproj --output ./packages --configuration Release

    - name: Build and pack BlazeDb.Bcrdt
      run: |
        dotnet build src/Utilities/BlazeDb/Bit.BlazeDb.Bcrdt/Bit.BlazeDb.Bcrdt.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/BlazeDb/Bit.BlazeDb.Bcrdt/Bit.BlazeDb.Bcrdt.csproj --output ./packages --configuration Release

    - name: Build and pack Blow
      run: |
        dotnet build src/Utilities/Blow/Bit.Blow/Bit.Blow.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Blow/Bit.Blow/Bit.Blow.csproj --output ./packages --configuration Release

    - name: Build and pack Bcrdt
      run: |
        dotnet build src/Utilities/Bcrdt/Bit.Bcrdt/Bit.Bcrdt.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bcrdt/Bit.Bcrdt/Bit.Bcrdt.csproj --output ./packages --configuration Release

    - name: Build and pack Bcrdt.SignalR
      run: |
        dotnet build src/Utilities/Bcrdt/Bit.Bcrdt.SignalR/Bit.Bcrdt.SignalR.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bcrdt/Bit.Bcrdt.SignalR/Bit.Bcrdt.SignalR.csproj --output ./packages --configuration Release

    - name: Build and pack Bcrdt.Server
      run: |
        dotnet build src/Utilities/Bcrdt/Bit.Bcrdt.Server/Bit.Bcrdt.Server.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bcrdt/Bit.Bcrdt.Server/Bit.Bcrdt.Server.csproj --output ./packages --configuration Release

    - name: Build and pack Bcrdt.Testing
      run: |
        dotnet build src/Utilities/Bcrdt/Bit.Bcrdt.Testing/Bit.Bcrdt.Testing.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bcrdt/Bit.Bcrdt.Testing/Bit.Bcrdt.Testing.csproj --output ./packages --configuration Release

    - name: Build and pack Bcrdt integrations
      run: |
        for project in Bit.Bcrdt.BlazeDb Bit.Bcrdt.Butil Bit.Bcrdt.Bink Bit.Bcrdt.Blow Bit.Bcrdt.Borm Bit.Bcrdt.Blex; do
          dotnet build src/Utilities/Bcrdt/$project/$project.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
          dotnet pack src/Utilities/Bcrdt/$project/$project.csproj --output ./packages --configuration Release
        done

    - name: Build and pack Blex
      run: |
        dotnet build src/Utilities/Blex/Bit.Blex/Bit.Blex.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Blex/Bit.Blex/Bit.Blex.csproj --output ./packages --configuration Release

    - name: Build and pack Blex.Maui
      run: |
        dotnet build src/Utilities/Blex/Bit.Blex.Maui/Bit.Blex.Maui.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Blex/Bit.Blex.Maui/Bit.Blex.Maui.csproj --output ./packages --configuration Release

    - name: Build and pack Blex.Testing
      run: |
        dotnet build src/Utilities/Blex/Bit.Blex.Testing/Bit.Blex.Testing.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Blex/Bit.Blex.Testing/Bit.Blex.Testing.csproj --output ./packages --configuration Release

    - name: Build and pack Bonboarding
      run: |
        dotnet build src/Utilities/Bonboarding/Bit.Bonboarding/Bit.Bonboarding.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bonboarding/Bit.Bonboarding/Bit.Bonboarding.csproj --output ./packages --configuration Release

    - name: Build and pack Bdnd
      run: |
        dotnet build src/Utilities/Bdnd/Bit.Bdnd/Bit.Bdnd.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bdnd/Bit.Bdnd/Bit.Bdnd.csproj --output ./packages --configuration Release

    - name: Build and pack Borm
      run: |
        dotnet build src/Utilities/Borm/Bit.Borm/Bit.Borm.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Borm/Bit.Borm/Bit.Borm.csproj --output ./packages --configuration Release

    - name: Build and pack Borm.FluentValidation
      run: |
        dotnet build src/Utilities/Borm/Bit.Borm.FluentValidation/Bit.Borm.FluentValidation.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Borm/Bit.Borm.FluentValidation/Bit.Borm.FluentValidation.csproj --output ./packages --configuration Release

    - name: Build and pack Bortable
      run: |
        dotnet build src/Utilities/Bortable/Bit.Bortable/Bit.Bortable.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bortable/Bit.Bortable/Bit.Bortable.csproj --output ./packages --configuration Release

    - name: Build and pack Belemetry
      run: |
        dotnet build src/Utilities/Belemetry/Bit.Belemetry/Bit.Belemetry.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Belemetry/Bit.Belemetry/Bit.Belemetry.csproj --output ./packages --configuration Release

    - name: Build and pack Belemetry.EntityFrameworkCore
      run: |
        dotnet build src/Utilities/Belemetry/Bit.Belemetry.EntityFrameworkCore/Bit.Belemetry.EntityFrameworkCore.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Belemetry/Bit.Belemetry.EntityFrameworkCore/Bit.Belemetry.EntityFrameworkCore.csproj --output ./packages --configuration Release

    - name: Build and pack Belemetry.Hangfire
      run: |
        dotnet build src/Utilities/Belemetry/Bit.Belemetry.Hangfire/Bit.Belemetry.Hangfire.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Belemetry/Bit.Belemetry.Hangfire/Bit.Belemetry.Hangfire.csproj --output ./packages --configuration Release

    - name: Build and pack BevTools.Loader
      run: |
        dotnet build src/Utilities/BevTools/Bit.BevTools.Loader/Bit.BevTools.Loader.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/BevTools/Bit.BevTools.Loader/Bit.BevTools.Loader.csproj --output ./packages --configuration Release

    - name: Build and pack BevTools
      run: |
        dotnet build src/Utilities/BevTools/Bit.BevTools/Bit.BevTools.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/BevTools/Bit.BevTools/Bit.BevTools.csproj --output ./packages --configuration Release

    - name: Build and pack BevTools.Server
      run: |
        dotnet build src/Utilities/BevTools/Bit.BevTools.Server/Bit.BevTools.Server.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/BevTools/Bit.BevTools.Server/Bit.BevTools.Server.csproj --output ./packages --configuration Release

    - name: Build and pack Bheadless
      run: |
        dotnet build src/Utilities/Bheadless/Bit.Bheadless/Bit.Bheadless.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bheadless/Bit.Bheadless/Bit.Bheadless.csproj --output ./packages --configuration Release

    - name: Build and pack Bheadless.Testing
      run: |
        dotnet build src/Utilities/Bheadless/Bit.Bheadless.Testing/Bit.Bheadless.Testing.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bheadless/Bit.Bheadless.Testing/Bit.Bheadless.Testing.csproj --output ./packages --configuration Release

    - name: Upload NuGet packages artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: utilities-nuget-packages
        path: ./packages/*.nupkg
        retention-days: 30



  bmotion:
    name: bmotion
    uses: ./.github/workflows/ci.bmotion.yml

  bmage:
    name: bmage
    uses: ./.github/workflows/ci.bmage.yml

  bsqlite:
    name: bsqlite
    uses: ./.github/workflows/ci.bsqlite.yml

  bink:
    name: bink
    uses: ./.github/workflows/ci.bink.yml

  balette:
