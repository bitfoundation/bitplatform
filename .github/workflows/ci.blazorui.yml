name: CI BlazorUI

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
    - 'src/BlazorUI/**'
    - 'src/Toolings/Minifier/**'

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

concurrency:
  group: ci-blazorui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Two jobs side by side: the Debug build and tests, and the Release pack. Each compiles the libraries once, in the
# configuration it needs, so the run takes as long as the longer of the two rather than both in a row.
jobs:
  build-BlazorUI:
    if: startsWith(github.event.pull_request.title, 'Prerelease') != true && startsWith(github.event.pull_request.title, 'Release') != true && startsWith(github.event.pull_request.title, 'Version') != true
    name: build Bit.BlazorUI
    runs-on: ubuntu-26.04

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    # The runtime the net10.0 unit tests run on.
    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    # Bit.BlazorUI.CI.slnf is the libraries, the web demo, and the test projects this job runs or that check the
    # libraries by compiling (Bit.BlazorUI.Tests.Consumer). It leaves out the MAUI and Windows demo clients, the one
    # projects that need a workload (maui-android here), so there is no `dotnet workload restore` step, and the E2E,
    # performance and trimming suites, which run in CI BlazorUI E2E. BuildAllTfms=true opts back into net10.0, which
    # the Debug configuration skips so that local inner-loop builds only compile the TFM the demo runs on, so the unit
    # tests run on every target framework the packages ship for.
    - name: dotnet build
      run: dotnet build src/BlazorUI/Bit.BlazorUI.CI.slnf -p:BuildAllTfms=true

    - name: Test
      run: cd src/BlazorUI/Tests/Bit.BlazorUI.Tests && dotnet test --no-build --verbosity normal -p:BuildAllTfms=true

    # The MCP server suite boots the demo server as a child process and talks to it over HTTP (about a minute).
    - name: Test MCP server
      run: dotnet run --no-build --project src/BlazorUI/Tests/Bit.BlazorUI.Tests.Mcp

  pack-BlazorUI:
    if: startsWith(github.event.pull_request.title, 'Prerelease') != true && startsWith(github.event.pull_request.title, 'Release') != true && startsWith(github.event.pull_request.title, 'Version') != true
    name: pack Bit.BlazorUI
    runs-on: ubuntu-26.04

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    # Bit.BlazorUI.Packages.slnf is every package CD Nuget packages publishes from src/BlazorUI. Release sets
    # GeneratePackageOnBuild, so one parallel build compiles each of them for every target framework, packs it and runs
    # its package validation - the same packages, flags and configuration as the release pack, with no second build
    # pass that a `dotnet pack` after it would make.
    - name: dotnet pack
      run: dotnet build src/BlazorUI/Bit.BlazorUI.Packages.slnf -c Release -p:PackageOutputPath=$GITHUB_WORKSPACE/packages -p:WarningLevel=0 -p:RunCodeAnalysis=false
