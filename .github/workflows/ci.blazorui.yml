name: CI BlazorUI

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
    - 'src/BlazorUI/**'
    - 'src/Toolings/Minifier/**'

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

concurrency:
  group: bit-ci-BlazorUI-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-BlazorUI:
    if: startsWith(github.event.pull_request.title, 'Prerelease') != true && startsWith(github.event.pull_request.title, 'Release') != true && startsWith(github.event.pull_request.title, 'Version') != true
    name: build Bit.BlazorUI
    runs-on: ubuntu-26.04

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
      
    - name: dotnet workload restore
      run:  cd src/BlazorUI && dotnet workload restore

    # BuildAllTfms=true opts back into net10.0, which the Debug configuration skips so that local
    # inner-loop builds only compile the TFM the demo and the tests actually run on.
    - name: dotnet build
      run: dotnet build src/BlazorUI/Bit.BlazorUI.slnx -p:BuildAllTfms=true

    - name: Test
      run: cd src/BlazorUI/Tests/Bit.BlazorUI.Tests && dotnet test --no-build --verbosity normal -p:BuildAllTfms=true

    # The MCP server suite boots the demo server as a child process and talks to it over HTTP (about a minute).
    - name: Test MCP server
      run: dotnet run --project src/BlazorUI/Tests/Bit.BlazorUI.Tests.Mcp

    - name: dotnet pack
      run: |
        for project in Bit.BlazorUI Bit.BlazorUI.Extras Bit.BlazorUI.Legacy Bit.BlazorUI.Assets Bit.BlazorUI.Icons; do
          dotnet build src/BlazorUI/$project/$project.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
          dotnet pack src/BlazorUI/$project/$project.csproj --output ./packages --configuration Release
        done
        for project in Bit.BlazorUI.AI.Core Bit.BlazorUI.AI Bit.BlazorUI.AI.Server Bit.BlazorUI.AI.SignalR Bit.BlazorUI.AI.ChatClient; do
          dotnet build src/BlazorUI/Bit.BlazorUI.AI/$project/$project.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
          dotnet pack src/BlazorUI/Bit.BlazorUI.AI/$project/$project.csproj --output ./packages --configuration Release
        done
