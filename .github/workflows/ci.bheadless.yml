name: CI Bheadless

# Build plus the unit (component, keyboard, ARIA and audit-engine) and MCP tests. The browser E2E suite is in
# ci.bheadless.e2e.yml and runs on demand only.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
    - 'src/Utilities/Bheadless/**'
    # The demo's code highlighter, linked in from there.
    - 'src/Utilities/Shared/Demo/**'

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

concurrency:
  group: bit-ci-Bheadless-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  build-Bheadless:
    if: startsWith(github.event.pull_request.title, 'Prerelease') != true && startsWith(github.event.pull_request.title, 'Release') != true && startsWith(github.event.pull_request.title, 'Version') != true
    name: build Bit.Bheadless
    runs-on: ubuntu-26.04

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: dotnet workload restore
      run: cd src/Utilities/Bheadless && dotnet workload restore

    # BuildAllTfms=true opts back into net10.0, which the Debug configuration skips so that local
    # builds stay on the latest TFM only.
    - name: dotnet build
      run: dotnet build src/Utilities/Bheadless/Bit.Bheadless.slnx -p:BuildAllTfms=true

    - name: dotnet test (components, keyboard, ARIA and the audit engine - net10.0/net11.0)
      # Run from inside src so src/global.json's "test" runner setting applies
      # (from the repo root the SDK falls back to the unsupported VSTest path).
      run: cd src/Utilities/Bheadless/Tests/Bit.Bheadless.Tests && dotnet test --no-build -p:BuildAllTfms=true

    - name: dotnet test (MCP server)
      run: cd src/Utilities/Bheadless/Tests/Bit.Bheadless.Tests.Mcp && dotnet test --no-build

    - name: dotnet pack
      run: |
        for project in Bit.Bheadless Bit.Bheadless.Testing; do
          dotnet build src/Utilities/Bheadless/$project/$project.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
          dotnet pack src/Utilities/Bheadless/$project/$project.csproj --output ./packages --configuration Release
        done
