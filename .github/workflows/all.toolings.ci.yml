name: All Toolings CI

on:
  workflow_dispatch:

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

jobs:

  blazores2019:
    name: blazores2019
    uses: ./.github/workflows/ci.blazores2019.yml

  cli:
    name: cli
    uses: ./.github/workflows/ci.cli.yml

  codeanalyzers:
    name: codeanalyzers
    uses: ./.github/workflows/ci.codeanalyzers.yml

  minifier:
    name: minifier
    uses: ./.github/workflows/ci.minifier.yml

  sourcegenerators:
    name: sourcegenerators
    uses: ./.github/workflows/ci.sourcegenerators.yml
