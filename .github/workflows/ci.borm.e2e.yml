name: CI Borm E2E

# The browser suite: the demo (prerendered, then running on WebAssembly), published the way cd.borm.demo.yml
# publishes it, driven in Chromium with Playwright. It
# takes far longer than the build-and-unit pipeline (ci.borm.yml), so it runs only when started by hand. See
# src/Utilities/Borm/Tests/Bit.Borm.Tests.E2E/README.md for what it proves and how to run it locally.

on:
  workflow_dispatch:
  workflow_call:

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

concurrency:
  group: ci-borm-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  e2e:
    name: Borm E2E (Chromium)
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    # What cd.borm.demo.yml installs before it publishes the demo, not the workloads of the whole solution, whose MAUI
    # sample would bring maui-android.
    - name: Install wasm-tools
      run: cd src && dotnet workload install wasm-tools

    # The tests drive the demo published the way cd.borm.demo.yml publishes it, not a build output: only a publish
    # trims the WebAssembly client and applies InvariantGlobalization, which the deployed site runs with - Borm itself
    # opts out of trimming, but the client around it and the framework do not.
    - name: Publish the demo
      run: dotnet publish src/Utilities/Borm/Demo/Server/Bit.Borm.Demo.Server.csproj -c Release -p:AspNetCoreHostingModel=OutOfProcess -o demo -p:InvariantGlobalization=true

    - name: Build the E2E suite
      run: dotnet build src/Utilities/Borm/Tests/Bit.Borm.Tests.E2E/Bit.Borm.Tests.E2E.csproj -c Release

    - name: Install Playwright Chromium
      run: pwsh src/Utilities/Borm/Tests/Bit.Borm.Tests.E2E/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

    # Without its appsettings files, as cd.borm.demo.yml ships it, and in the Production environment it is deployed to.
    - name: Start the published demo
      run: |
        rm -fv demo/appsettings*.json
        cd demo
        nohup dotnet Bit.Borm.Demo.Server.dll --urls http://127.0.0.1:5000 > ../demo.log 2>&1 &
        for attempt in $(seq 1 60); do
          curl --silent --fail --output /dev/null http://127.0.0.1:5000/ && exit 0
          sleep 2
        done
        cat ../demo.log
        exit 1

    - name: Run E2E tests
      env:
        BORM_E2E_BASE_URL: http://127.0.0.1:5000
      # Run from inside src so src/global.json's Microsoft.Testing.Platform runner setting applies.
      run: >
        cd src/Utilities/Borm/Tests/Bit.Borm.Tests.E2E &&
        dotnet test -c Release --no-build
        --report-trx --report-trx-filename borm-e2e.trx

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: borm-e2e
        path: |
          **/borm-e2e.trx
          demo.log
        if-no-files-found: ignore
