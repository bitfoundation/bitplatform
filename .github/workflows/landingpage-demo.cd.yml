name: CD Landing Page Demo

on:
  workflow_dispatch:
    inputs:
      prerelease_packages:
        description: Bit packages of the latest Prerelease nuget packages run instead of nuget.org
        type: boolean
        default: false
  workflow_call:
    inputs:
      prerelease_packages:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:

  build_landingpage:
    name: build landing page
    runs-on: windows-2025
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json
        dotnet-version: 10.0.x

    - name: Use prerelease packages
      if: inputs.prerelease_packages
      uses: ./.github/actions/use-prerelease-packages
      with:
        project-folder: src/Templates/Boilerplate/Bit.Boilerplate

    - name: Setup bit CLI
      uses: ./.github/actions/setup-bit-cli

    - name: Create project with bit new
      run: bit new Bit.Boilerplate --framework net10.0 --webAppUrl https://adminpanel.bitplatform.dev --landingPageUrl https://landingpage.bitplatform.dev --template-package "${{ env.BIT_TEMPLATE_PACKAGE }}" --yes --no-build --no-format --no-migration --no-trust

    - name: Update the client's appsettings.json
      uses: devops-actions/variable-substitution@ae7b1f3676ae374dc70282e6b9650bc50b611222 # v1.2
      with:
        files: 'Bit.Boilerplate/src/LandingPage/Bit.Boilerplate.LandingPage.Client/appsettings.json'
      env:
        Belemetry.AzureMonitorConnectionString: ${{ secrets.APPLICATION_INSIGHTS_CONNECTION_STRING }}

    - name: Publish
      working-directory: Bit.Boilerplate
      run: dotnet publish src/LandingPage/Bit.Boilerplate.LandingPage.Server/Bit.Boilerplate.LandingPage.Server.csproj -c Release -o ../server -p:Version="${{ vars.APP_VERSION}}" -p:AspNetCoreHostingModel=OutOfProcess -p:BitMinifyAggressive=true -p:BitMinifyMapOutputPath="${{ github.workspace }}/bit-minifier.map"

    # Every publish renames afresh, so this map reads the stack traces of this release and of no other. It lives in
    # obj, which this checkout throws away - kept here, and never next to the client, which would serve it.
    - name: Upload minifier map artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: LandingPage-minifier-map
        path: bit-minifier.map

    # Server-owned; C:\inetpub keeps its own copies. Also keeps them out of the artifact.
    - name: Strip server-owned files from bundle
      shell: pwsh
      run: |
        Get-ChildItem server -File -Include 'appsettings*.json', 'AppCertificate.*', 'AppleAuthKey.p8', '*.pfx' -Recurse |
          ForEach-Object { Write-Host "Removing $($_.FullName)"; Remove-Item $_.FullName -Force }

    - name: Upload server artifact
      id: server_artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: LandingPage
        path: server
        include-hidden-files: true

    - name: Attest server artifact
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: LandingPage
        subject-digest: sha256:${{ steps.server_artifact.outputs.artifact-digest }}

  deploy_landingpage:
    name: deploy landing page
    needs: build_landingpage
    runs-on: [self-hosted, Windows, X64, bitplatform-iis]
    environment:
      name: production
      url: 'https://landingpage.bitplatform.dev'

    steps:

    - name: Checkout deploy action
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: .github/actions

    - name: Deploy
      uses: ./.github/actions/deploy-to-server
      with:
        artifact-name: LandingPage
        app-pool: LandingPage
        site-path: C:\inetpub\LandingPage
        sentinel-file: Bit.Boilerplate.LandingPage.Server.dll
        health-check-url: 'https://landingpage.bitplatform.dev/'
        cloudflare-zone-id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        cloudflare-token: ${{ secrets.CLOUDFLARE_TOKEN }}
