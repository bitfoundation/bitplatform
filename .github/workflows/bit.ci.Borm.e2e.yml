name: bit platform CI - Borm E2E

# The browser suite: the demo (prerendered, then running on WebAssembly) driven in Chromium with Playwright. It
# takes far longer than the build-and-unit pipeline (bit.ci.Borm.yml), so it runs only when started by hand. See
# src/Utilities/Borm/Tests/Bit.Borm.Tests.E2E/README.md for what it proves and how to run it locally.

on:
  workflow_dispatch:

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

jobs:

  e2e:
    name: Borm E2E (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: src/global.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: dotnet workload restore
      run: cd src/Utilities/Borm && dotnet workload restore

    - name: Build the demo and the E2E suite
      run: |
        dotnet build src/Utilities/Borm/Demo/Server/Bit.Borm.Demo.Server.csproj -c Release
        dotnet build src/Utilities/Borm/Tests/Bit.Borm.Tests.E2E/Bit.Borm.Tests.E2E.csproj -c Release

    - name: Install Playwright Chromium
      run: pwsh src/Utilities/Borm/Tests/Bit.Borm.Tests.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

    - name: Run E2E tests
      # Run from inside src so src/global.json's Microsoft.Testing.Platform runner setting applies.
      run: >
        cd src/Utilities/Borm/Tests/Bit.Borm.Tests.E2E &&
        dotnet test -c Release --no-build
        --report-trx --report-trx-filename borm-e2e.trx

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: borm-e2e
        path: '**/borm-e2e.trx'
        if-no-files-found: ignore
