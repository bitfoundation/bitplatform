name: bit platform CI - Butil

# Build plus the MCP and hosting tests. The browser E2E suites and the trimmed/AOT publish gate are in
# bit.ci.Butil.e2e.yml and run on demand only.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
    - 'src/Butil/**'

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

jobs:

  build-Butil:
    if: startsWith(github.event.pull_request.title, 'Prerelease') != true && startsWith(github.event.pull_request.title, 'Release') != true && startsWith(github.event.pull_request.title, 'Version') != true
    name: build Bit.Butil
    runs-on: ubuntu-24.04

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: src/global.json

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 9.0.x

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 8.0.x

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: dotnet workload restore
      run:  cd src/Butil && dotnet workload restore

    - name: dotnet build
      run: dotnet build src/Butil/Bit.Butil.slnx

    # The MCP suite boots the demo server as a child process and drives it over the wire, so it
    # needs the server's output where the fixture's `dotnet run --artifacts-path` expects it. The
    # solution build above already compiled both projects; this only redirects the server's output.
    - name: Build the demo server the MCP suite boots
      run: >
        dotnet build src/Butil/Bit.Butil.Demo/Server/Bit.Butil.Demo.Server.csproj
        --artifacts-path ${{ runner.temp }}/bit-butil-mcp-tests

    # Run from inside src/ so global.json is in scope: dotnet test resolves it from the working
    # directory, not from the project path, and without it the Microsoft.Testing.Platform runner
    # it selects is never applied - dotnet test falls back to VSTest and rejects --report-trx.
    - name: MCP server tests
      env:
        BUTIL_MCP_ARTIFACTS_PATH: ${{ runner.temp }}/bit-butil-mcp-tests
      run: >
        cd src/Butil/tests/Bit.Butil.Tests.Mcp &&
        dotnet test
        --no-build
        --report-trx --report-trx-filename butil-mcp.trx

    - name: Upload MCP test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: butil-mcp-results
        path: '**/butil-mcp.trx'
        if-no-files-found: ignore

    # Every render mode of the Blazor Web App harness host over HTTP, on net8.0/net9.0/net10.0: the prerendered
    # pages, the served scripts, and every member of every service called during a static render.
    - name: Hosting tests
      run: >
        cd src/Butil/tests/Bit.Butil.Tests.Hosting &&
        dotnet test
        --no-build
        --report-trx --report-trx-filename butil-hosting.trx

    - name: Upload hosting test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: butil-hosting-results
        path: '**/butil-hosting*.trx'
        if-no-files-found: ignore
