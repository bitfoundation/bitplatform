name: Sales Website CD

env:
  APP_SERVICE_NAME: 'bitservices'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build_api_blazor:
    name: build api + blazor web
    runs-on: windows-2025

    steps:
    
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false
    
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: src/global.json
        
    - name: Install wasm
      run:  cd src && dotnet workload install wasm-tools
      
    - name: Generate CSS/JS files
      run: dotnet build src/Websites/Sales/src/Bit.Websites.Sales.Client/Bit.Websites.Sales.Client.csproj -t:BeforeBuildTasks --no-restore -c Release -p:Version="${{ vars.APP_VERSION}}"

    - name: Publish
      run: dotnet publish src/Websites/Sales/src/Bit.Websites.Sales.Server/Bit.Websites.Sales.Server.csproj -c Release -o server -p:Version="${{ vars.APP_VERSION}}"

    # appsettings*.json in C:\inetpub is hand-maintained, so the bundle must not carry a copy of it.
    - name: Strip server-owned files from bundle
      shell: pwsh
      run: |
        Get-ChildItem server -File -Include 'appsettings*.json', 'AppCertificate.*', 'AppleAuthKey.p8', '*.pfx' -Recurse |
          ForEach-Object { Write-Host "Removing $($_.FullName)"; Remove-Item $_.FullName -Force }

    - name: Upload server artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: BitServices
        path: server
        include-hidden-files: true # Required for wwwroot/.well-known folder

  deploy_server:
    name: deploy
    needs: build_api_blazor
    runs-on: [self-hosted, Windows, X64, bitplatform-iis]
    environment:
      name: production
      url: 'https://services.bitplatform.dev'

    steps:

    - name: Checkout deploy action
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: .github/actions

    - name: Deploy
      uses: ./.github/actions/deploy-to-server
      with:
        artifact-name: BitServices
        app-pool: BitServices
        site-path: C:\inetpub\BitServices
        sentinel-file: Bit.Websites.Sales.Server.dll
        health-check-url: 'https://services.bitplatform.dev/'
        cloudflare-zone-id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        cloudflare-token: ${{ secrets.CLOUDFLARE_TOKEN }}
