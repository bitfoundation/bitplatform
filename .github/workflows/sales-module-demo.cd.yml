name: Sales module demo CD

# Project templates come equipped with CI/CD for both Azure DevOps and GitHub, providing you with a hassle-free way to get started with your new project. It is important to note that you should not depend on the contents of this file. More info at https://bitplatform.dev/templates/dev-ops

env:
  SERVER_ADDRESS: 'https://sales.bitplatform.dev'
  R2_BUCKET: 'sales'
  OpenAI__ApiKey: ${{ secrets.OpenAI__ApiKey }}
  OpenAI__Endpoint: ${{ secrets.OpenAI__Endpoint }}
  OPENAI__MODEL: ${{ secrets.OPENAI__MODEL }}

on:
  workflow_dispatch:
    inputs:
      server:
        description: Server web
        type: boolean
        default: true
      windows:
        description: Windows app
        type: boolean
        default: true
  workflow_call:
    inputs:
      server:
        type: boolean
        default: true
      windows:
        type: boolean
        default: true

permissions:
  contents: read

jobs:

  build_api_blazor:
    name: build api + blazor web
    if: inputs.server
    runs-on: windows-2025

    steps:
    
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false
    
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: src/global.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24

    - name: Create project from Boilerplate
      run: |
        cd src/Templates/Boilerplate && dotnet build -c Release
        dotnet pack -c Release -o . -p:ReleaseVersion=0.0.0 -p:PackageVersion=0.0.0
        dotnet new install Bit.Boilerplate.0.0.0.nupkg
        cd ../../../ && dotnet new bit-bp --name SalesModule --database PostgreSQL --module Sales --appInsights --apiServerUrl ${{ env.SERVER_ADDRESS }} --webAppUrl ${{ env.SERVER_ADDRESS }} --filesStorage AzureBlobStorage --notification --captcha reCaptcha --signalR --ads --brouter false

    - name: Update core appsettings.json
      uses: devops-actions/variable-substitution@ae7b1f3676ae374dc70282e6b9650bc50b611222 # v1.2
      with:
        files: 'SalesModule/**/appsettings*json'
      env:
        WebAppRender.PrerenderEnabled: true
        ServerAddress: '/'
        WebAppRender.BlazorMode: 'BlazorWebAssembly'
        AdsPushVapid.PublicKey: ${{ secrets.SALES_PUBLIC_VAPIDKEY }}
        GoogleRecaptchaSiteKey: ${{ secrets.GOOGLE_RECAPTCHA_SITE_KEY }}
        ApplicationInsights.ConnectionString: ${{ secrets.APPLICATION_INSIGHTS_CONNECTION_STRING }}

    - name: Install wasm
      run:  cd src && dotnet workload install wasm-tools

    - name: Configure bswup
      run: |
          sed -i "s/\/\/ self.mode = 'AlwaysPrerender'/self.mode = 'AlwaysPrerender'/g" SalesModule/src/Client/SalesModule.Client.Web/wwwroot/service-worker.published.js

    - name: Configure text embedding
      run: |
          sed -i 's/IsEmbeddingEnabled = false/IsEmbeddingEnabled = true/' SalesModule/src/Server/SalesModule.Server.Api/Infrastructure/Data/AppDbContext.cs

    - name: Generate CSS/JS files
      run: |
          dotnet build SalesModule/src/Client/SalesModule.Client.Core/SalesModule.Client.Core.csproj -t:BeforeBuildTasks -p:Version="${{ vars.APP_VERSION}}" --no-restore -c Release
          dotnet build SalesModule/src/Client/SalesModule.Client.Web/SalesModule.Client.Web.csproj -t:BeforeBuildTasks -p:Version="${{ vars.APP_VERSION}}" --no-restore -c Release

    - name: Publish
      run: dotnet publish SalesModule/src/Server/SalesModule.Server.Web/SalesModule.Server.Web.csproj -c Release -o server -p:Version="${{ vars.APP_VERSION}}"

    # Server-owned; C:\inetpub keeps its own copies. Also keeps them out of the artifact.
    - name: Strip server-owned files from bundle
      shell: pwsh
      run: |
        Get-ChildItem server -File -Include 'appsettings*.json', 'AppCertificate.*', 'AppleAuthKey.p8', '*.pfx' -Recurse |
          ForEach-Object { Write-Host "Removing $($_.FullName)"; Remove-Item $_.FullName -Force }

    - name: Upload server artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: SalesModule
        path: server
        include-hidden-files: true # Required for wwwroot/.well-known folder

  deploy_server_web:
    name: deploy server web
    needs: build_api_blazor
    runs-on: [self-hosted, Windows, X64, bitplatform-iis]
    environment:
      name: production
      url: 'https://sales.bitplatform.dev'

    steps:

    - name: Checkout deploy action
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: .github/actions

    - name: Deploy
      uses: ./.github/actions/deploy-to-server
      with:
        artifact-name: SalesModule
        app-pool: SalesModule
        site-path: C:\inetpub\SalesModule
        sentinel-file: SalesModule.Server.Web.dll
        health-check-url: 'https://sales.bitplatform.dev/health'
        cloudflare-zone-id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        cloudflare-token: ${{ secrets.CLOUDFLARE_TOKEN }}

  build_blazor_hybrid_windows:
    name: build blazor hybrid (windows)
    if: inputs.windows
    runs-on: windows-2025
  
    steps:
     
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: src\global.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24

    - name: Create project from Boilerplate
      run: |
        cd src\Templates\Boilerplate && dotnet build -c Release
        dotnet pack -c Release -o . -p:ReleaseVersion=0.0.0 -p:PackageVersion=0.0.0
        dotnet new install Bit.Boilerplate.0.0.0.nupkg
        cd ..\..\..\ && dotnet new bit-bp --name SalesModule --database PostgreSQL --module Sales --sentry --apiServerUrl ${{ env.SERVER_ADDRESS }} --webAppUrl ${{ env.SERVER_ADDRESS }} --filesStorage AzureBlobStorage --captcha reCaptcha --signalR --ads --brouter false
  
    - name: Update core appsettings.json
      uses: devops-actions/variable-substitution@ae7b1f3676ae374dc70282e6b9650bc50b611222 # v1.2
      with:
        files: 'SalesModule\**\appsettings*json'
      env:
        WebAppUrl: ${{ env.SERVER_ADDRESS }}
        ServerAddress: ${{ env.SERVER_ADDRESS }}
        Logging.Sentry.Dsn: ${{ secrets.SALES_SENTRY_DSN }}
        GoogleRecaptchaSiteKey: ${{ secrets.GOOGLE_RECAPTCHA_SITE_KEY }}
        WindowsUpdate.FilesUrl: https://windows-sales.bitplatform.dev

    - name: Use Bit.ResxTranslator
      run: |
            cd SalesModule
            dotnet tool install --global Bit.ResxTranslator --prerelease
            bit-resx-translate

    - name: Generate CSS/JS files
      run: dotnet build SalesModule\src\Client\SalesModule.Client.Core\SalesModule.Client.Core.csproj -t:BeforeBuildTasks -p:Version="${{ vars.APP_VERSION}}" --no-restore -c Release

    # Needed for delta packages. Fails on the first run, when the bucket is empty.
    - name: Download previous releases from R2
      continue-on-error: true
      run: |
          cd SalesModule\src\Client\SalesModule.Client.Windows\
          dotnet tool restore
          dotnet vpk download s3 --endpoint ${{ vars.R2_ENDPOINT }} --bucket ${{ env.R2_BUCKET }} --keyId ${{ secrets.R2_ACCESS_KEY_ID }} --secret ${{ secrets.R2_SECRET_ACCESS_KEY }} -o .\Releases

    - name: Publish
      run: |
          cd SalesModule\src\Client\SalesModule.Client.Windows\
          dotnet publish SalesModule.Client.Windows.csproj -c Release -o .\publish-result -r win-x64 -p:Version="${{ vars.APP_VERSION}}" -p:PublishReadyToRun=true -p:PublishReadyToRunComposite=true --self-contained
          dotnet tool restore
          dotnet vpk pack -u SalesModule.Client.Windows -v "${{ vars.APP_VERSION }}" -p .\publish-result -e SalesModule.Client.Windows.exe -r win-x64 --framework webview2 --icon .\wwwroot\favicon.ico --packTitle 'SalesModule'

    # The update feed behind WindowsUpdate.FilesUrl.
    - name: Upload releases to R2
      run: |
          cd SalesModule\src\Client\SalesModule.Client.Windows\
          dotnet vpk upload s3 --endpoint ${{ vars.R2_ENDPOINT }} --bucket ${{ env.R2_BUCKET }} --keyId ${{ secrets.R2_ACCESS_KEY_ID }} --secret ${{ secrets.R2_SECRET_ACCESS_KEY }} -o .\Releases --keepMaxReleases 10
