name: Sales module demo CD

# Project templates come equipped with CI/CD for both Azure DevOps and GitHub, providing you with a hassle-free way to get started with your new project. It is important to note that you should not depend on the contents of this file. More info at https://bitplatform.dev/templates/dev-ops

env:
  # Lets the About page show the run, the commit and the attestations of the build.
  ShowBuildProvenance: true
  SERVER_ADDRESS: 'https://sales.bitplatform.dev'
  R2_BUCKET: 'sales'
  OpenAI__ApiKey: ${{ secrets.OpenAI__ApiKey }}
  OpenAI__Endpoint: ${{ secrets.OpenAI__Endpoint }}
  OPENAI__MODEL: ${{ secrets.OPENAI__MODEL }}

on:
  workflow_dispatch:
    inputs:
      server:
        description: Server web
        type: boolean
        default: true
      windows:
        description: Windows app
        type: boolean
        default: true
      prerelease_packages:
        description: Bit packages of the latest Prerelease nuget packages run instead of nuget.org
        type: boolean
        default: false
      windows_stores:
        description: For WinGet and the Microsoft Store, sign every file of the Windows app, keep its installer at a URL of its own version and submit that version to both
        type: boolean
        default: false
  workflow_call:
    inputs:
      server:
        type: boolean
        default: true
      windows:
        type: boolean
        default: true
      prerelease_packages:
        type: boolean
        default: false
      windows_stores:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:

  build_api_blazor:
    name: build api + blazor web
    if: inputs.server
    runs-on: windows-2025
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write

    steps:
    
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false
    
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: src/global.json
        dotnet-version: 10.0.x

    - name: Use prerelease packages
      if: inputs.prerelease_packages
      uses: ./.github/actions/use-prerelease-packages
      with:
        project-folder: src/Templates/Boilerplate/Bit.Boilerplate

    - name: Setup bit CLI
      uses: ./.github/actions/setup-bit-cli

    - name: Create project with bit new
      run: bit new SalesModule --framework net10.0 --database PostgreSQL --module Sales --appInsights --apiServerUrl ${{ env.SERVER_ADDRESS }} --webAppUrl ${{ env.SERVER_ADDRESS }} --filesStorage S3 --notification --captcha reCaptcha --signalR --ads --template-package "${{ env.BIT_TEMPLATE_PACKAGE }}" --yes --no-build --no-format --no-migration --no-trust

    - name: Update core appsettings.json
      uses: devops-actions/variable-substitution@ae7b1f3676ae374dc70282e6b9650bc50b611222 # v1.2
      with:
        files: 'SalesModule/**/appsettings*json'
      env:
        WebAppRender.PrerenderEnabled: true
        ServerAddress: '/'
        WebAppRender.BlazorMode: 'BlazorWebAssembly'
        AdsPushVapid.PublicKey: ${{ secrets.SALES_PUBLIC_VAPIDKEY }}
        GoogleRecaptchaSiteKey: ${{ secrets.GOOGLE_RECAPTCHA_SITE_KEY }}
        ApplicationInsights.ConnectionString: ${{ secrets.APPLICATION_INSIGHTS_CONNECTION_STRING }}

    - name: Configure bswup
      run: |
          sed -i "s/\/\/ self.mode = 'AlwaysPrerender'/self.mode = 'AlwaysPrerender'/g" SalesModule/src/Client/SalesModule.Client.Web/wwwroot/service-worker.published.js

    - name: Configure text embedding
      run: |
          sed -i 's/IsEmbeddingEnabled = false/IsEmbeddingEnabled = true/' SalesModule/src/Server/SalesModule.Server.Api/Infrastructure/Data/AppDbContext.cs

    - name: Publish
      working-directory: SalesModule
      run: dotnet publish src/Server/SalesModule.Server.Web/SalesModule.Server.Web.csproj -c Release -o ../server -p:Version="${{ vars.APP_VERSION}}" -p:AspNetCoreHostingModel=OutOfProcess -p:BitMinifyAggressive=true -p:BitMinifyMapOutputPath="${{ github.workspace }}/bit-minifier.map"

    # Every publish renames afresh, so this map reads the stack traces of this release and of no other. It lives in
    # obj, which this checkout throws away - kept here, and never next to the client, which would serve it.
    - name: Upload minifier map artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: SalesModule-minifier-map
        path: bit-minifier.map

    # Server-owned; C:\inetpub keeps its own copies. Also keeps them out of the artifact.
    - name: Strip server-owned files from bundle
      shell: pwsh
      run: |
        Get-ChildItem server -File -Include 'appsettings*.json', 'AppCertificate.*', 'AppleAuthKey.p8', '*.pfx' -Recurse |
          ForEach-Object { Write-Host "Removing $($_.FullName)"; Remove-Item $_.FullName -Force }

    - name: Upload server artifact
      id: server_artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: SalesModule
        path: server
        include-hidden-files: true # Required for wwwroot/.well-known folder

    - name: Attest server artifact
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: SalesModule
        subject-digest: sha256:${{ steps.server_artifact.outputs.artifact-digest }}

  deploy_server_web:
    name: deploy server web
    needs: build_api_blazor
    runs-on: [self-hosted, Windows, X64, bitplatform-iis]
    environment:
      name: production
      url: 'https://sales.bitplatform.dev'

    steps:

    - name: Checkout deploy action
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: .github/actions

    - name: Deploy
      uses: ./.github/actions/deploy-to-server
      with:
        artifact-name: SalesModule
        app-pool: SalesModule
        site-path: C:\inetpub\SalesModule
        sentinel-file: SalesModule.Server.Web.dll
        health-check-url: 'https://sales.bitplatform.dev/health'
        cloudflare-zone-id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        cloudflare-token: ${{ secrets.CLOUDFLARE_TOKEN }}

  build_blazor_hybrid_windows:
    name: build blazor hybrid (windows)
    if: inputs.windows
    runs-on: windows-2025
    environment: code-signing
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
  
    steps:
     
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: src\global.json
        dotnet-version: 10.0.x

    - name: Use prerelease packages
      if: inputs.prerelease_packages
      uses: ./.github/actions/use-prerelease-packages
      with:
        project-folder: src/Templates/Boilerplate/Bit.Boilerplate

    - name: Setup bit CLI
      uses: ./.github/actions/setup-bit-cli

    - name: Create project with bit new
      run: bit new SalesModule --framework net10.0 --database PostgreSQL --module Sales --sentry --apiServerUrl ${{ env.SERVER_ADDRESS }} --webAppUrl ${{ env.SERVER_ADDRESS }} --filesStorage S3 --captcha reCaptcha --signalR --ads --template-package "${{ env.BIT_TEMPLATE_PACKAGE }}" --yes --platforms windows --no-build --no-format --no-migration --no-trust
  
    - name: Update core appsettings.json
      uses: devops-actions/variable-substitution@ae7b1f3676ae374dc70282e6b9650bc50b611222 # v1.2
      with:
        files: 'SalesModule\**\appsettings*json'
      env:
        WebAppUrl: ${{ env.SERVER_ADDRESS }}
        ServerAddress: ${{ env.SERVER_ADDRESS }}
        Logging.Sentry.Dsn: ${{ secrets.SALES_SENTRY_DSN }}
        GoogleRecaptchaSiteKey: ${{ secrets.GOOGLE_RECAPTCHA_SITE_KEY }}
        WindowsUpdate.FilesUrl: https://windows-sales.bitplatform.dev

    - name: Translate .resx files
      run: |
            cd SalesModule
            bit translate

    - name: Install vpk
      shell: pwsh
      run: |
        dotnet tool install vpk --version 1.2.161 --tool-path "$env:RUNNER_TEMP/vpk"
        Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP/vpk"

    # Needed for delta packages. Fails on the first run, when the bucket is empty.
    - name: Download previous releases from R2
      continue-on-error: true
      run: |
          cd SalesModule\src\Client\SalesModule.Client.Windows\
          vpk download s3 --endpoint ${{ vars.R2_ENDPOINT }} --bucket ${{ env.R2_BUCKET }} --keyId ${{ secrets.R2_ACCESS_KEY_ID }} --secret ${{ secrets.R2_SECRET_ACCESS_KEY }} -o .\Releases

    - name: Log in to Azure for code signing
      if: vars.CODE_SIGNING_ACCOUNT != ''
      uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ secrets.CODE_SIGNING_CLIENT_ID }}
        tenant-id: ${{ secrets.CODE_SIGNING_TENANT_ID }}
        subscription-id: ${{ secrets.CODE_SIGNING_SUBSCRIPTION_ID }}

    # vpk signs through Azure's signing library, whose DefaultAzureCredential tries managed identity, Visual Studio,
    # VS Code and others before the Azure CLI. On a runner they only cost time or could sign in as someone else, so only
    # the az login above is left.
    # '\.dll$' signs only the executables: this CD runs often for end-to-end tests, and a demo's dlls gain nothing from a signature.
    - name: Sign the executables with Artifact Signing
      if: vars.CODE_SIGNING_ACCOUNT != ''
      run: |
          @{ Endpoint = '${{ vars.CODE_SIGNING_ENDPOINT }}'; CodeSigningAccountName = '${{ vars.CODE_SIGNING_ACCOUNT }}'; CertificateProfileName = '${{ vars.CODE_SIGNING_CERTIFICATE_PROFILE }}'; ExcludeCredentials = @('ManagedIdentityCredential', 'WorkloadIdentityCredential', 'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential') } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\code-signing.json"
          "VPK_AZURE_TRUSTED_SIGN_FILE=$env:RUNNER_TEMP\code-signing.json" >> $env:GITHUB_ENV
          if ('${{ inputs.windows_stores }}' -ne 'true') { 'VPK_SIGN_EXCLUDE=\.dll$' >> $env:GITHUB_ENV }

    - name: Publish
      run: |
          cd SalesModule\src\Client\SalesModule.Client.Windows\
          dotnet publish SalesModule.Client.Windows.csproj -c Release -o .\publish-result -r win-x64 -p:Version="${{ vars.APP_VERSION}}" -p:PublishReadyToRun=true -p:PublishReadyToRunComposite=true --self-contained
          vpk pack -u SalesModule.Client.Windows -v "${{ vars.APP_VERSION }}" -p .\publish-result -e SalesModule.Client.Windows.exe -r win-x64 --framework webview2 --icon .\wwwroot\favicon.ico --packTitle 'SalesModule' --packAuthors BitPlatform

    - name: Attest the installer and packages
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: |
          SalesModule/src/Client/SalesModule.Client.Windows/Releases/*-Setup.exe
          SalesModule/src/Client/SalesModule.Client.Windows/Releases/*-Portable.zip
          SalesModule/src/Client/SalesModule.Client.Windows/Releases/*-${{ vars.APP_VERSION }}-*.nupkg

    # The update feed behind WindowsUpdate.FilesUrl.
    - name: Upload releases to R2
      run: |
          cd SalesModule\src\Client\SalesModule.Client.Windows\
          vpk upload s3 --endpoint ${{ vars.R2_ENDPOINT }} --bucket ${{ env.R2_BUCKET }} --keyId ${{ secrets.R2_ACCESS_KEY_ID }} --secret ${{ secrets.R2_SECRET_ACCESS_KEY }} -o .\Releases --keepMaxReleases 10

    - name: Upload this version's installer to R2
      if: inputs.windows_stores
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: auto
        AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
        AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      run: |
          $key = "${{ vars.APP_VERSION }}/SalesModule.Client.Windows-win-Setup.exe"
          aws s3api head-object --bucket ${{ env.R2_BUCKET }} --key $key --endpoint-url ${{ vars.R2_ENDPOINT }} *> $null
          if ($LASTEXITCODE -eq 0) { throw "$key is already on R2, and WinGet and the Microsoft Store need it unchanged. Raise APP_VERSION." }
          aws s3 cp SalesModule\src\Client\SalesModule.Client.Windows\Releases\SalesModule.Client.Windows-win-Setup.exe "s3://${{ env.R2_BUCKET }}/$key" --endpoint-url ${{ vars.R2_ENDPOINT }}
          "::notice title=Installer::https://windows-sales.bitplatform.dev/$key"

    - name: Submit this version to WinGet
      if: inputs.windows_stores
      uses: ./.github/actions/submit-to-winget
      with:
        id: BitPlatform.Sales
        version: ${{ vars.APP_VERSION }}
        installer: SalesModule\src\Client\SalesModule.Client.Windows\Releases\SalesModule.Client.Windows-win-Setup.exe
        installer-url: https://windows-sales.bitplatform.dev/${{ vars.APP_VERSION }}/SalesModule.Client.Windows-win-Setup.exe
        architecture: x64
        product-code: SalesModule.Client.Windows
        name: Sales
        short-description: A product catalog and sales app built with bit Boilerplate.
        package-url: https://sales.bitplatform.dev
        privacy-url: https://sales.bitplatform.dev/en-US/privacy-policy
        token: ${{ secrets.WINGET_TOKEN }}

    - name: Set up the Microsoft Store CLI
      if: inputs.windows_stores
      uses: microsoft/microsoft-store-apppublisher@cc9910a8d59f2eb55cbb83df0a3800cf3b5300e0 # v1.4
      with:
        version: v0.4.3

    - name: Submit this version to the Microsoft Store
      if: inputs.windows_stores
      run: |
          $PSNativeCommandUseErrorActionPreference = $true
          msstore reconfigure --tenantId ${{ secrets.MSSTORE_TENANT_ID }} --sellerId ${{ secrets.MSSTORE_SELLER_ID }} --clientId ${{ secrets.MSSTORE_CLIENT_ID }} --clientSecret ${{ secrets.MSSTORE_CLIENT_SECRET }}
          $package = @{ packages = @(@{ packageUrl = "https://windows-sales.bitplatform.dev/${{ vars.APP_VERSION }}/SalesModule.Client.Windows-win-Setup.exe"; languages = @('en'); architectures = @('X64'); installerParameters = '--silent'; isSilentInstall = $true }) } | ConvertTo-Json -Depth 4 -Compress
          msstore submission update ${{ vars.SALES_MSSTORE_PRODUCT_ID }} $package
          msstore submission publish ${{ vars.SALES_MSSTORE_PRODUCT_ID }}
