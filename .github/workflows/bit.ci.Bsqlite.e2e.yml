name: bit platform CI - Bsqlite E2E

# The worker, the engine builds and every VFS in Chromium, plus every page of the demo website. It takes far longer
# than the build-and-unit pipeline (bit.ci.Bsqlite.yml), so it runs only when started by hand. See
# src/Bsqlite/Tests/Bit.Bsqlite.Tests.E2E/README.md for what the browser suite proves and how to run it locally.

on:
  workflow_dispatch:

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

jobs:

  # The worker, the engine builds and every VFS in Chromium, driven through the library's own modules, plus every
  # page of the demo website, against the Release build that ships.
  e2e:
    name: Bsqlite E2E (Chromium)
    runs-on: ubuntu-24.04

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: src/global.json

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 9.0.x

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 8.0.x

    # Node runs the TypeScript build, and the restore of the storage packages runs it to rewrite the imports of
    # the wa-sqlite VFSes they vendor - so it has to be there before the first restore.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    # Building the E2E suite builds the libraries too (it serves their compiled modules), but not the demo.
    - name: Build the demo and the E2E suite
      run: |
        dotnet build src/Bsqlite/Demo/Server/Bit.Bsqlite.Demo.Server.csproj -c Release
        dotnet build src/Bsqlite/Tests/Bit.Bsqlite.Tests.E2E/Bit.Bsqlite.Tests.E2E.csproj -c Release

    - name: Install Playwright Chromium
      run: pwsh src/Bsqlite/Tests/Bit.Bsqlite.Tests.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

    - name: Run E2E tests
      # Run from inside src so src/global.json's Microsoft.Testing.Platform runner setting applies.
      run: >
        cd src/Bsqlite/Tests/Bit.Bsqlite.Tests.E2E &&
        dotnet test -c Release --no-build
        --report-trx --report-trx-filename bsqlite-e2e.trx

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bsqlite-e2e
        path: '**/bsqlite-e2e.trx'
        if-no-files-found: ignore
