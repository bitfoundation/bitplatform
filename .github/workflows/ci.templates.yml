name: CI Templates

on:
  workflow_dispatch:
    inputs:
      prerelease_packages:
        description: Bit packages of the latest CD Prerelease nuget packages run instead of nuget.org
        type: boolean
        default: false
  workflow_call:
    inputs:
      prerelease_packages:
        type: boolean
        default: false
  pull_request:
    paths:
    - 'src/Templates/**'
    - 'src/Toolings/Minifier/**'
    - 'src/Toolings/Cli/**'
    - '.github/actions/setup-bit-cli/**'

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-templates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-Templates:
    if: startsWith(github.event.pull_request.title, 'Prerelease') != true && startsWith(github.event.pull_request.title, 'Release') != true && startsWith(github.event.pull_request.title, 'Version') != true
    name: build Bit.Templates
    runs-on: ubuntu-26.04

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - name: dotnet pack
      run: |
        dotnet pack src/Templates/Boilerplate/Bit.Boilerplate.ProjectTemplate.csproj --output ./packages --configuration Release
        dotnet pack src/Templates/BlazorEmpty/Bit.BlazorEmpty.ProjectTemplate.csproj --output ./packages --configuration Release

    - name: Use prerelease packages
      if: inputs.prerelease_packages
      uses: ./.github/actions/use-prerelease-packages
      with:
        project-folder: src/Templates/Boilerplate/Bit.Boilerplate

    - name: Setup bit CLI
      uses: ./.github/actions/setup-bit-cli

    # bit setup prints nothing while one of its steps runs, so a download that stalls in CI hangs it without a word, up to
    # the job's six hours. It takes about 5 minutes here.
    - name: Set up and build Boilerplate with bit setup
      run: bit setup src/Templates/Boilerplate/Bit.Boilerplate --platforms android --no-browsers --yes -p:EnforceCodeStyleInBuild=true
      timeout-minutes: 20

    - name: Verify formatting
      run: dotnet format whitespace src/Templates/Boilerplate/Bit.Boilerplate/Boilerplate.slnx --verify-no-changes
