name: CI Templates

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
    - 'src/Templates/**'

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

concurrency:
  group: ci-templates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-Templates:
    name: build Bit.Templates
    runs-on: ubuntu-26.04

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    # BlazorEmpty builds only after dotnet new, which CI Templates E2E does.
    - name: dotnet pack
      run: dotnet pack src/Templates/BlazorEmpty/Bit.BlazorEmpty.ProjectTemplate.csproj --output ./packages --configuration Release
