name: CI Brouter

# Build plus the unit, MCP, source-generator and hosting tests. The browser E2E suites and the trimmed/AOT publish
# gate are in ci.brouter.e2e.yml and run on demand only.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
    - 'src/Brouter/**'

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

concurrency:
  group: bit-ci-Brouter-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  build-Brouter:
    if: startsWith(github.event.pull_request.title, 'Prerelease') != true && startsWith(github.event.pull_request.title, 'Release') != true && startsWith(github.event.pull_request.title, 'Version') != true
    name: build Bit.Brouter
    runs-on: ubuntu-26.04

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: dotnet workload restore
      run:  cd src/Brouter && dotnet workload restore

    - name: dotnet build
      run: dotnet build src/Brouter/Bit.Brouter.slnx

    - name: dotnet test
      run: cd src/Brouter/Tests/Bit.Brouter.Tests && dotnet test --no-build

    - name: dotnet test (MCP server)
      # Run from inside src so src/global.json's "test" runner setting applies
      # (from the repo root the SDK falls back to the unsupported VSTest path).
      run: cd src/Brouter/Tests/Bit.Brouter.Tests.Mcp && dotnet test --no-build

    - name: dotnet test (source generator)
      run: cd src/Brouter/Tests/Bit.Brouter.Tests.Generators && dotnet test --no-build

    - name: dotnet test (hosting - every render mode over HTTP, net10.0/net11.0)
      run: cd src/Brouter/Tests/Bit.Brouter.Tests.Hosting && dotnet test --no-build

    - name: dotnet pack
      run: |
        for project in Bit.Brouter Bit.Brouter.Generators; do
          dotnet build src/Brouter/$project/$project.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
          dotnet pack src/Brouter/$project/$project.csproj --output ./packages --configuration Release
        done
