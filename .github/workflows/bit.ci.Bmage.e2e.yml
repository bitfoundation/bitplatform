name: bit platform CI - Bmage E2E

# The demo website driven in Chromium. It takes far longer than the build-and-unit pipeline (bit.ci.Bmage.yml), so
# it runs only when started by hand. See src/Utilities/Bmage/Tests/Bit.Bmage.Tests.E2E/README.md for what the suite covers and
# how to run it locally.

on:
  workflow_dispatch:

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

jobs:

  # The bit-bmage.js bridge, the browser's own codecs, canvas rendering, editor input and every demo page.
  e2e:
    name: Bmage E2E (Chromium)
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: src/global.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Install wasm-tools
      run: cd src && dotnet workload install wasm-tools

    # The tests drive the demo published the way bmage.demo.cd.yml publishes it, not a build output: only a publish
    # trims the WebAssembly client, and an interop payload the trimmer breaks - an anonymous type whose constructor
    # lost its parameter names, a getter nothing but System.Text.Json reads - works in every build and fails only there.
    - name: Publish the demo
      run: dotnet publish src/Utilities/Bmage/Demo/Server/Bit.Bmage.Demo.Server.csproj -c Release -o demo -p:InvariantGlobalization=true

    - name: Build the E2E suite
      run: dotnet build src/Utilities/Bmage/Tests/Bit.Bmage.Tests.E2E/Bit.Bmage.Tests.E2E.csproj -c Release

    - name: Install Playwright Chromium
      run: pwsh src/Utilities/Bmage/Tests/Bit.Bmage.Tests.E2E/bin/Release/net11.0/playwright.ps1 install --with-deps chromium

    - name: Start the published demo
      run: |
        cd demo
        nohup dotnet Bit.Bmage.Demo.Server.dll --urls http://127.0.0.1:5000 > ../demo.log 2>&1 &
        for attempt in $(seq 1 60); do
          curl --silent --fail --output /dev/null http://127.0.0.1:5000/ && exit 0
          sleep 2
        done
        cat ../demo.log
        exit 1

    - name: Run E2E tests
      env:
        BMAGE_E2E_HOST_URL: http://127.0.0.1:5000
        BMAGE_E2E_CONFIGURATION: Release
        BMAGE_E2E_SKIP_BUILD: 1
      # Run from inside src so src/global.json's Microsoft.Testing.Platform runner setting applies.
      run: >
        cd src/Utilities/Bmage/Tests/Bit.Bmage.Tests.E2E &&
        dotnet test -c Release --no-build
        --report-trx --report-trx-filename bmage-e2e.trx

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: bmage-e2e
        path: |
          **/bmage-e2e.trx
          demo.log
        if-no-files-found: ignore
