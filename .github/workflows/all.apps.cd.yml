name: All Apps CD

# Runs every CD workflow in one run. Local `./` reusable workflows always run from the caller's
# commit, so whatever branch is picked in the "Run workflow" dropdown is the branch they all build.

on:
  workflow_dispatch:
    inputs:
      server:
        description: Server web + api
        type: boolean
        default: true
      wasm:
        description: Blazor WASM standalone
        type: boolean
        default: true
      windows:
        description: Windows apps
        type: boolean
        default: true
      android:
        description: Android apps
        type: boolean
        default: true
      ios:
        description: iOS apps
        type: boolean
        default: true
      prerelease_packages:
        description: Bit packages of the latest Prerelease nuget packages run instead of nuget.org (AdminPanel, Sales, Todo, Workbench, the landing page, and the platform and sales websites)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:

  platform_website:
    name: platform website
    if: inputs.server
    uses: ./.github/workflows/cd.platform.website.yml
    secrets: inherit
    with:
      prerelease_packages: ${{ inputs.prerelease_packages }}

  sales_website:
    name: sales website
    if: inputs.server
    uses: ./.github/workflows/cd.sales.website.yml
    secrets: inherit
    with:
      prerelease_packages: ${{ inputs.prerelease_packages }}

  bevtools_demo:
