name: CI BlazeDb

# Build, engine and EF Core provider tests, the Blex and Bcrdt adapter tests, and MCP server tests. The browser suite
# lives in bit.ci.BlazeDb.e2e.yml and runs on demand only.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
    - 'src/Utilities/BlazeDb/**'
    # The MCP server's search ranking, linked in from there.
    - 'src/Utilities/Shared/Mcp/**'
    # The libraries the Bit.BlazeDb.Blex and Bit.BlazeDb.Bcrdt adapters build on.
    - 'src/Utilities/Blex/Bit.Blex/**'
    - 'src/Utilities/Blex/Bit.Blex.Generators/**'
    - 'src/Utilities/Bcrdt/Bit.Bcrdt/**'
    - 'src/Utilities/Bcrdt/Bit.Bcrdt.Testing/**'

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

concurrency:
  group: bit-ci-BlazeDb-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # Its `if:` skips the job on Release/Prerelease/Version PRs.
  build-BlazeDb:
    if: startsWith(github.event.pull_request.title, 'Prerelease') != true && startsWith(github.event.pull_request.title, 'Release') != true && startsWith(github.event.pull_request.title, 'Version') != true
    name: build Bit.BlazeDb
    runs-on: ubuntu-26.04

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 11.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: src/global.json

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: dotnet workload restore
      run:  cd src/Utilities/BlazeDb && dotnet workload restore

    - name: dotnet build
      run: dotnet build src/Utilities/BlazeDb/Bit.BlazeDb.slnx

    - name: dotnet test (engine + EF Core provider, net10.0/net11.0)
      # Run from inside src so src/global.json's "test" runner setting applies
      # (from the repo root the SDK falls back to the unsupported VSTest path).
      run: cd src/Utilities/BlazeDb/Tests/Bit.BlazeDb.Tests && dotnet test --no-build

    - name: dotnet test (Blex and Bcrdt adapters, net10.0/net11.0)
      run: cd src/Utilities/BlazeDb/Tests/Bit.BlazeDb.Tests.Integrations && dotnet test --no-build

    - name: dotnet test (MCP server)
      run: cd src/Utilities/BlazeDb/Tests/Bit.BlazeDb.Tests.Mcp && dotnet test --no-build
