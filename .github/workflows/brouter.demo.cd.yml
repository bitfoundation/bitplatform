name: Brouter Demo CD

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build_blazor_wasm:
    name: build blazor wasm
    runs-on: ubuntu-24.04

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: src/global.json

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24

    - name: Install wasm
      run:  cd src && dotnet workload install wasm-tools

    - name: Publish
      run: dotnet publish src/Brouter/Bit.Brouter.Demo/Server/Bit.Brouter.Demo.Server.csproj -c Release -o server -p:Version="${{ vars.APP_VERSION}}" -p:InvariantGlobalization=true

    # appsettings*.json in C:\inetpub is hand-maintained, so the bundle must not carry a copy of it.
    - name: Strip server-owned files from bundle
      run: rm -fv server/appsettings*.json server/AppCertificate.* server/AppleAuthKey.p8 server/*.pfx || true

    - name: Upload artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: BrouterDemo
        path: server
        include-hidden-files: true

  deploy_server:
    name: deploy
    needs: build_blazor_wasm
    runs-on: [self-hosted, Windows, X64, bitplatform-iis]
    environment:
      name: production
      url: 'https://brouter.bitplatform.dev'

    steps:

    - name: Checkout deploy action
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: .github/actions

    - name: Deploy
      uses: ./.github/actions/deploy-to-server
      with:
        artifact-name: BrouterDemo
        app-pool: Brouter
        site-path: C:\inetpub\BrouterDemo
        sentinel-file: Bit.Brouter.Demo.Server.dll
        health-check-url: 'https://brouter.bitplatform.dev/'
        cloudflare-zone-id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        cloudflare-token: ${{ secrets.CLOUDFLARE_TOKEN }}
