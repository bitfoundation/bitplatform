name: bit platform CI - BlazorHeadlessUI

# Build plus the unit (component, keyboard, ARIA and audit-engine) and MCP tests. The browser E2E suite is in
# bit.ci.BlazorHeadlessUI.e2e.yml and runs on demand only.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
    - 'src/BlazorHeadlessUI/**'

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

jobs:

  build-BlazorHeadlessUI:
    if: startsWith(github.event.pull_request.title, 'Prerelease') != true && startsWith(github.event.pull_request.title, 'Release') != true && startsWith(github.event.pull_request.title, 'Version') != true
    name: build Bit.BlazorHeadlessUI
    runs-on: ubuntu-24.04

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: src/global.json

    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 9.0.x

    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: 8.0.x

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: dotnet workload restore
      run: cd src/BlazorHeadlessUI && dotnet workload restore

    # BuildAllTfms=true opts back into net9.0 and net8.0, which the Debug configuration skips so that local
    # builds stay on the latest TFM only.
    - name: dotnet build
      run: dotnet build src/BlazorHeadlessUI/Bit.BlazorHeadlessUI.slnx -p:BuildAllTfms=true

    - name: dotnet test (components, keyboard, ARIA and the audit engine - net8.0/net9.0/net10.0)
      # Run from inside src so src/global.json's "test" runner setting applies
      # (from the repo root the SDK falls back to the unsupported VSTest path).
      run: cd src/BlazorHeadlessUI/Tests/Bit.BlazorHeadlessUI.Tests && dotnet test --no-build -p:BuildAllTfms=true

    - name: dotnet test (MCP server)
      run: cd src/BlazorHeadlessUI/Tests/Bit.BlazorHeadlessUI.Tests.Mcp && dotnet test --no-build
