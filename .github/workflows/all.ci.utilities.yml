        dotnet pack src/Utilities/Blex/Bit.Blex/Bit.Blex.csproj --output ./packages --configuration Release

    - name: Build and pack Blex.Maui
      run: |
        dotnet build src/Utilities/Blex/Bit.Blex.Maui/Bit.Blex.Maui.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Blex/Bit.Blex.Maui/Bit.Blex.Maui.csproj --output ./packages --configuration Release

    - name: Build and pack Blex.Testing
      run: |
        dotnet build src/Utilities/Blex/Bit.Blex.Testing/Bit.Blex.Testing.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Blex/Bit.Blex.Testing/Bit.Blex.Testing.csproj --output ./packages --configuration Release

    - name: Build and pack Bonboarding
      run: |
        dotnet build src/Utilities/Bonboarding/Bit.Bonboarding/Bit.Bonboarding.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bonboarding/Bit.Bonboarding/Bit.Bonboarding.csproj --output ./packages --configuration Release

    - name: Build and pack Bdnd
      run: |
        dotnet build src/Utilities/Bdnd/Bit.Bdnd/Bit.Bdnd.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bdnd/Bit.Bdnd/Bit.Bdnd.csproj --output ./packages --configuration Release

    - name: Build and pack Borm
      run: |
        dotnet build src/Utilities/Borm/Bit.Borm/Bit.Borm.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
