name: All Utilities CI

on:
  workflow_dispatch:
    inputs:
      nuget_packages:
        description: NuGet packages
        type: boolean
        default: true

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

jobs:

  build_nuget_packages:
    name: build utilities nuget packages locally
    if: ${{ inputs.nuget_packages }}
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: src/global.json

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - name: Build and pack Bmotion
      run: |
        dotnet build src/Utilities/Bmotion/Bit.Bmotion/Bit.Bmotion.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bmotion/Bit.Bmotion/Bit.Bmotion.csproj --output ./packages --configuration Release

    - name: Build and pack Bmage
      run: |
        dotnet build src/Utilities/Bmage/Bit.Bmage/Bit.Bmage.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bmage/Bit.Bmage/Bit.Bmage.csproj --output ./packages --configuration Release

    - name: Build and pack Bsqlite
      run: |
        dotnet build src/Utilities/Bsqlite/Bit.Bsqlite/Bit.Bsqlite.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bsqlite/Bit.Bsqlite/Bit.Bsqlite.csproj --output ./packages --configuration Release

    - name: Build and pack Bsqlite.Testing
      run: |
        dotnet build src/Utilities/Bsqlite/Bit.Bsqlite.Testing/Bit.Bsqlite.Testing.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bsqlite/Bit.Bsqlite.Testing/Bit.Bsqlite.Testing.csproj --output ./packages --configuration Release

    - name: Build and pack Bink
      run: |
        dotnet build src/Utilities/Bink/Bit.Bink/Bit.Bink.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Bink/Bit.Bink/Bit.Bink.csproj --output ./packages --configuration Release

    - name: Build and pack Balette
      run: |
        dotnet build src/Utilities/Balette/Bit.Balette/Bit.Balette.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Balette/Bit.Balette/Bit.Balette.csproj --output ./packages --configuration Release

    - name: Build and pack BbScanner
      run: |
        dotnet build src/Utilities/BbScanner/Bit.BbScanner/Bit.BbScanner.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/BbScanner/Bit.BbScanner/Bit.BbScanner.csproj --output ./packages --configuration Release

    - name: Build and pack BlazeDb
      run: |
        dotnet build src/Utilities/BlazeDb/Bit.BlazeDb/Bit.BlazeDb.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/BlazeDb/Bit.BlazeDb/Bit.BlazeDb.csproj --output ./packages --configuration Release

    - name: Build and pack BlazeDb.EntityFrameworkCore
