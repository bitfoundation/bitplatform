    if: ${{ inputs.e2e }}
    uses: ./.github/workflows/bit.ci.Bmage.e2e.yml

  bsqlite:
    name: bsqlite
    uses: ./.github/workflows/bit.ci.Bsqlite.yml

  bsqlite_e2e:
