    - name: Build and pack Belemetry
      run: |
        dotnet build src/Utilities/Belemetry/Bit.Belemetry/Bit.Belemetry.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Belemetry/Bit.Belemetry/Bit.Belemetry.csproj --output ./packages --configuration Release

    - name: Build and pack Belemetry.EntityFrameworkCore
      run: |
        dotnet build src/Utilities/Belemetry/Bit.Belemetry.EntityFrameworkCore/Bit.Belemetry.EntityFrameworkCore.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Belemetry/Bit.Belemetry.EntityFrameworkCore/Bit.Belemetry.EntityFrameworkCore.csproj --output ./packages --configuration Release

    - name: Build and pack Belemetry.Hangfire
      run: |
        dotnet build src/Utilities/Belemetry/Bit.Belemetry.Hangfire/Bit.Belemetry.Hangfire.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/Belemetry/Bit.Belemetry.Hangfire/Bit.Belemetry.Hangfire.csproj --output ./packages --configuration Release

    - name: Build and pack BevTools
      run: |
        dotnet build src/Utilities/BevTools/Bit.BevTools/Bit.BevTools.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/BevTools/Bit.BevTools/Bit.BevTools.csproj --output ./packages --configuration Release

    - name: Build and pack BevTools.Server
      run: |
        dotnet build src/Utilities/BevTools/Bit.BevTools.Server/Bit.BevTools.Server.csproj -c Release -p:GeneratePackageOnBuild=false -p:WarningLevel=0 -p:RunCodeAnalysis=false
        dotnet pack src/Utilities/BevTools/Bit.BevTools.Server/Bit.BevTools.Server.csproj --output ./packages --configuration Release

    - name: Upload NuGet packages artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: utilities-nuget-packages
        path: ./packages/*.nupkg
        retention-days: 30



  bmotion:
    name: bmotion
    uses: ./.github/workflows/bit.ci.Bmotion.yml

  bmage:
