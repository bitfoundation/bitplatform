        dotnet pack src/BlazorUI/Bit.BlazorUI.Icons/Bit.BlazorUI.Icons.csproj --output ./packages --configuration Release

    # No "Generate CSS/JS files" pre-step: unlike the BlazorUI projects above, Bit.Bswup generates
