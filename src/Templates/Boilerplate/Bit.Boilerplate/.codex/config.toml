[mcp_servers.bitplatform]
url = "https://bitplatform.dev/mcp?v=10.6.1"

[mcp_servers.dev-mcp]
url = "https://use-your-api-server-url-here.com/dev-mcp"

[mcp_servers.aspire]
command = "aspire"
args = ["agent", "mcp"]

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest", "--output-dir", ".playwright-mcp", "--output-max-size", "52428800"]
