name: Build and Deploy Template

on:
  workflow_call:
    inputs:
      ENV_NAME:
        required: true
        type: string

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
  # Lets the About page show the run, the commit and the attestations of the build, only in a public repository whose links anyone can open.
  ShowBuildProvenance: ${{ github.event.repository.visibility == 'public' }}

permissions:
  contents: read

jobs:

  build_api_blazor:
    name: build api + blazor web
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment: ${{ inputs.ENV_NAME }}
    steps:

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install the bit CLI
        shell: pwsh
        run: |
          dotnet tool install Bit.Cli --prerelease --tool-path "$env:RUNNER_TEMP/bit-cli"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP/bit-cli"

      - name: Prepare this machine with bit setup
        run: bit setup --no-build --yes

      - name: Translate .resx files
        env:
          OpenAI__ApiKey: ${{ secrets.OPENAI_APIKEY }}
          OpenAI__Endpoint: ${{ vars.OPENAI_ENDPOINT }}
        run: |
          bit translate

      - name: Update core appsettings.json
        uses: devops-actions/variable-substitution@ae7b1f3676ae374dc70282e6b9650bc50b611222 # v1.2
        with:
          files: 'src/**/appsettings*json'
        env:
          WebAppRender.BlazorMode: 'BlazorWebAssembly'
          ServerAddress: ${{ vars.SERVER_ADDRESS }}
#if (notification == true)
          AdsPushVapid.PublicKey: ${{ secrets.PUBLIC_VAPIDKEY }}
#endif

      - name: Publish
        run: dotnet publish src/Server/Boilerplate.Server.Web/Boilerplate.Server.Web.csproj -c Release --self-contained -r linux-x64 -o server -p:Version="${{ vars.APP_VERSION }}" -p:Environment=${{ inputs.ENV_NAME }}
      - name: Upload server artifact
        id: server_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-bundle
          path: server
          include-hidden-files: true # Required for wwwroot/.well-known folder

      - name: Attest server artifact
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: server-bundle
          subject-digest: sha256:${{ steps.server_artifact.outputs.artifact-digest }}

  deploy_api_blazor:
    name: deploy api + blazor
    needs: build_api_blazor
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.ENV_NAME }}
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:

      - name: Retrieve server bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-bundle

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ vars.APP_SERVICE_NAME }}
          slot-name: 'production'
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: .
          clean: false

#if (cloudflare == true)
      - name: Purge Cloudflare cache
        uses: jakejarvis/cloudflare-purge-action@eee6dba0236093358f25bb1581bd615dc8b3d8e3 # v0.3.0
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
#endif

#if (api == "Standalone")
  build_api:
    name: build api
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment: ${{ inputs.ENV_NAME }}
    steps:

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Update core appsettings.json
        uses: devops-actions/variable-substitution@ae7b1f3676ae374dc70282e6b9650bc50b611222 # v1.2
        with:
          files: 'src/**/appsettings*json'
        env:
          ServerAddress: ${{ vars.SERVER_ADDRESS }}

      - name: Publish
        run: dotnet publish src/Server/Boilerplate.Server.Api/Boilerplate.Server.Api.csproj -c Release --self-contained -r linux-x64 -o server-api -p:Version="${{ vars.APP_VERSION }}" -p:Environment=${{ inputs.ENV_NAME }}

      - name: Upload api artifact
        id: api_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-bundle
          path: server-api
          include-hidden-files: true # Required for wwwroot/.well-known folder

      - name: Attest api artifact
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: api-bundle
          subject-digest: sha256:${{ steps.api_artifact.outputs.artifact-digest }}

  deploy_api:
    name: deploy api
    needs: build_api
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.ENV_NAME }}
      url: ${{ steps.deploy-api-to-webapp.outputs.webapp-url }}

    steps:

      - name: Retrieve api bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: api-bundle

      - name: Deploy to Azure Web App
        id: deploy-api-to-webapp
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ vars.API_APP_SERVICE_NAME }}
          slot-name: 'production'
          publish-profile: ${{ secrets.API_AZURE_PUBLISH_PROFILE }}
          package: .
          clean: false
#endif

  build_blazor_hybrid_windows:
    name: build blazor hybrid (windows)
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment: ${{ inputs.ENV_NAME }}
    steps:

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
  
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install the bit CLI
        shell: pwsh
        run: |
          dotnet tool install Bit.Cli --prerelease --tool-path "$env:RUNNER_TEMP/bit-cli"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP/bit-cli"

      - name: Prepare this machine with bit setup
        run: bit setup --platforms windows --no-build --yes

      - name: Translate .resx files
        env:
          OpenAI__ApiKey: ${{ secrets.OPENAI_APIKEY }}
          OpenAI__Endpoint: ${{ vars.OPENAI_ENDPOINT }}
        run: |
          bit translate

      - name: Update core appsettings.json
        uses: devops-actions/variable-substitution@ae7b1f3676ae374dc70282e6b9650bc50b611222 # v1.2
        with:
          files: 'src\**\appsettings*json'
        env:
          ServerAddress: ${{ vars.SERVER_ADDRESS }}
          WindowsUpdate.FilesUrl: ${{ vars.WINDOWS_UPDATE_FILES_URL }}

      - name: Log in to Azure for code signing
        if: vars.CODE_SIGNING_ACCOUNT != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.CODE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ secrets.CODE_SIGNING_TENANT_ID }}
          subscription-id: ${{ secrets.CODE_SIGNING_SUBSCRIPTION_ID }}

      # vpk signs through Azure's signing library, whose DefaultAzureCredential tries managed identity, Visual Studio,
      # VS Code and others before the Azure CLI. On a runner they only cost time or could sign in as someone else, so only
      # the az login above is left.
      - name: Sign the app with Artifact Signing
        if: vars.CODE_SIGNING_ACCOUNT != ''
        run: |
          @{ Endpoint = '${{ vars.CODE_SIGNING_ENDPOINT }}'; CodeSigningAccountName = '${{ vars.CODE_SIGNING_ACCOUNT }}'; CertificateProfileName = '${{ vars.CODE_SIGNING_CERTIFICATE_PROFILE }}'; ExcludeCredentials = @('ManagedIdentityCredential', 'WorkloadIdentityCredential', 'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential') } | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP\code-signing.json"
          "VPK_AZURE_TRUSTED_SIGN_FILE=$env:RUNNER_TEMP\code-signing.json" >> $env:GITHUB_ENV

      - name: Publish
        run: |
          cd src\Client\Boilerplate.Client.Windows\
          dotnet publish Boilerplate.Client.Windows.csproj -c Release -o .\publish-result -r win-x86 -p:Version="${{ vars.APP_VERSION }}" --self-contained -p:Environment=${{ inputs.ENV_NAME }}
          dnx vpk@1.2.161 -- pack -u ${{ vars.APP_ID }} -v "${{ vars.APP_VERSION }}" -p .\publish-result -e Boilerplate.Client.Windows.exe -r win-x86 --framework webview2 --icon .\wwwroot\favicon.ico --packTitle '${{ vars.APP_TITLE }}'

      - name: Upload artifact
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-exe-bundle
          path: src\Client\Boilerplate.Client.Windows\Releases

      - name: Attest artifact
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: win-exe-bundle
          subject-digest: sha256:${{ steps.artifact.outputs.artifact-digest }}

  build_blazor_hybrid_android:
    name: build blazor hybrid (android)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment: ${{ inputs.ENV_NAME }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install the bit CLI
        shell: pwsh
        run: |
          dotnet tool install Bit.Cli --prerelease --tool-path "$env:RUNNER_TEMP/bit-cli"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP/bit-cli"

      - name: Prepare this machine with bit setup
        run: bit setup --platforms android --no-build --yes

      - name: Extract Android signing key
        uses: timheuer/base64-to-file@dfa5a5dd38803cb4f5c3a081eeb28e8362d43e9c # v2.0.0
        with:
          fileDir: './src/Client/Boilerplate.Client.Maui/'
          fileName: 'Boilerplate.keystore'
          encodedString: ${{ secrets.ANDROID_RELEASE_KEYSTORE_FILE_BASE64 }}

      - name: Translate .resx files
        env:
          OpenAI__ApiKey: ${{ secrets.OPENAI_APIKEY }}
          OpenAI__Endpoint: ${{ vars.OPENAI_ENDPOINT }}
        run: |
          bit translate

      - name: Update core appsettings.json
        uses: devops-actions/variable-substitution@ae7b1f3676ae374dc70282e6b9650bc50b611222 # v1.2
        with:
          files: 'src/**/appsettings*json'
        env:
          ServerAddress: ${{ vars.SERVER_ADDRESS }}

      - name: Publish aab
        run: dotnet publish src/Client/Boilerplate.Client.Maui/Boilerplate.Client.Maui.csproj -c Release -p:ApplicationId=${{ vars.APP_ID }} -p:AndroidPackageFormat=aab -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="Boilerplate.keystore" -p:AndroidSigningKeyAlias=Boilerplate -p:AndroidSigningKeyPass="${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}" -p:AndroidSigningStorePass="${{ secrets.ANDROID_RELEASE_SIGNING_PASSWORD }}" -p:Version="${{ vars.APP_VERSION }}" -p:Environment=${{ inputs.ENV_NAME }} -f net11.0-android

      - name: Upload artifact
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-bundle
          path: src/Client/Boilerplate.Client.Maui/bin/Release/net11.0-android/*-Signed.*

      - name: Attest artifact
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: android-bundle
          subject-digest: sha256:${{ steps.artifact.outputs.artifact-digest }}

  build_blazor_hybrid_iOS:
    name: build blazor hybrid (iOS)
    runs-on: macOS-26
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment: ${{ inputs.ENV_NAME }}

    steps:

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '26.6'

      - name: Install the bit CLI
        shell: pwsh
        run: |
          dotnet tool install Bit.Cli --prerelease --tool-path "$env:RUNNER_TEMP/bit-cli"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP/bit-cli"

      - name: Prepare this machine with bit setup
        run: bit setup --platforms ios --no-build --yes

      - name: Translate .resx files
        env:
          OpenAI__ApiKey: ${{ secrets.OPENAI_APIKEY }}
          OpenAI__Endpoint: ${{ vars.OPENAI_ENDPOINT }}
        run: |
          bit translate

      - name: Update core appsettings.json
        uses: devops-actions/variable-substitution@ae7b1f3676ae374dc70282e6b9650bc50b611222 # v1.2
        with:
          files: 'src/**/appsettings*json'
        env:
          ServerAddress: ${{ vars.SERVER_ADDRESS }}

      - name: Import Code-Signing Certificates
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CODE_SIGNING_CERTIFICATE_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CODE_SIGNING_CERTIFICATE_FILE_PASSWORD }}

      - name: Download Apple Provisioning Profiles
        uses: Apple-Actions/download-provisioning-profiles@2126b5f86a0e2863cbf4d2d312112b22b943a594 # v6.1.0
        with:
          bundle-id: ${{ vars.APP_ID }}
          issuer-id: ${{ secrets.APPSTORE_API_KEY_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_KEY_PRIVATE_KEY }}

      - name: Build ipa
        run: dotnet publish src/Client/Boilerplate.Client.Maui/Boilerplate.Client.Maui.csproj -p:ApplicationId=${{ vars.APP_ID }} -p:RuntimeIdentifier=ios-arm64 -c Release -p:ArchiveOnBuild=true -p:CodesignKey="iPhone Distribution" -p:CodesignProvision="${{ vars.IOS_CODE_SIGN_PROVISION }}" -p:Version="${{ vars.APP_VERSION }}" -p:Environment=${{ inputs.ENV_NAME }} -f net11.0-ios

      - name: Upload artifact
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iOS-bundle
          path: src/Client/Boilerplate.Client.Maui/bin/release/net11.0-ios/ios-arm64/publish/*.ipa

      - name: Attest artifact
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: iOS-bundle
          subject-digest: sha256:${{ steps.artifact.outputs.artifact-digest }}
