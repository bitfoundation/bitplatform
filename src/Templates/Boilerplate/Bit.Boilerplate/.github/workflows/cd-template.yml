name: Build and Deploy Template

on:
  workflow_call:
    inputs:
      ENV_NAME:
        required: true
        type: string

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
  # Lets the About page show the run, the commit and the attestations of the build, only in a public repository whose links anyone can open.
  ShowBuildProvenance: ${{ github.event.repository.visibility == 'public' }}

permissions:
  contents: read

jobs:

#if (aspire == true)
  # The server is a Docker Compose project that .NET Aspire publishes from the app host. This job builds its images on
  # a GitHub-hosted runner, pushes them to GitHub Container Registry tagged with the environment and the commit, and
  # hands the Compose file to deploy_server, which runs on the environment's own server and builds nothing.
  build_server:
    name: build server
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    environment: ${{ inputs.ENV_NAME }}
    steps:

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Prepare this machine with bit setup
        uses: bitfoundation/bitplatform/.github/actions/boilerplate/bit-setup@v-11.0.0-pre-15
        with:
          arguments: --no-build

      - name: Translate .resx files
        env:
          OpenAI__ApiKey: ${{ secrets.OPENAI_APIKEY }}
          OpenAI__Endpoint: ${{ vars.OPENAI_ENDPOINT }}
        run: |
          bit translate

      - name: Update core appsettings.json
        uses: devops-actions/variable-substitution@ae7b1f3676ae374dc70282e6b9650bc50b611222 # v1.2
        with:
          files: 'src/**/appsettings*json'
        env:
          WebAppRender.BlazorMode: 'BlazorWebAssembly'
          ServerAddress: ${{ vars.SERVER_ADDRESS }}
#if (notification == true)
          AdsPushVapid.PublicKey: ${{ secrets.PUBLIC_VAPIDKEY }}
#endif

      # bit setup leaves the Aspire CLI out in CI, so it is installed here, at the version of the app host's Aspire SDK.
      - name: Install the Aspire CLI
        run: |
          version="$(grep -oE 'Aspire\.AppHost\.Sdk/[^"]+' src/Server/Boilerplate.Server.AppHost/Boilerplate.Server.AppHost.csproj | cut -d/ -f2)"
          dotnet tool install Aspire.Cli --version "$version" --tool-path "$RUNNER_TEMP/aspire-cli"
          echo "$RUNNER_TEMP/aspire-cli" >> "$GITHUB_PATH"

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push the images
        env:
          ENV_NAME: ${{ inputs.ENV_NAME }}
          APP_VERSION: ${{ vars.APP_VERSION }}
        run: |
          # Every dotnet build and publish from here on reads Directory.Build.rsp - the ones Aspire runs to build the images
          # included - which gives the images the version and the environment the other jobs pass with -p.
          { if [ -n "$APP_VERSION" ]; then echo "-p:Version=$APP_VERSION"; fi; echo "-p:Environment=$ENV_NAME"; } > Directory.Build.rsp
          export REGISTRY_ENDPOINT=ghcr.io REGISTRY_REPOSITORY="${GITHUB_REPOSITORY,,}" IMAGE_TAG="${ENV_NAME,,}-$GITHUB_SHA"
          # shellcheck disable=SC1010 # `do` is the aspire subcommand here, not the shell keyword.
          aspire do push --apphost src/Server/Boilerplate.Server.AppHost/Boilerplate.Server.AppHost.csproj --environment "$ENV_NAME" --non-interactive

      - name: Publish the Docker Compose project
        env:
          ENV_NAME: ${{ inputs.ENV_NAME }}
        run: aspire publish --apphost src/Server/Boilerplate.Server.AppHost/Boilerplate.Server.AppHost.csproj --environment "$ENV_NAME" --non-interactive --no-build --output-path aspire-output

      - name: Upload the Docker Compose project
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose
          path: |
            aspire-output/docker-compose.yaml
            aspire-output/.env
          include-hidden-files: true # Required for .env, the list of values the deploy job has to supply

      # In a public repository, also find each pushed image's digest, attest it with actions/attest-build-provenance, and push the attestation to GHCR.

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

  # Runs on the environment's own server: a self-hosted runner labeled with the environment's name (Test or
  # Production) on a machine that has Docker and nothing else - no SDK and no source code. It keeps each environment's
  # Compose project in ~/deployments/<project>-<environment> of the runner's user.
  deploy_server:
    name: deploy server
    needs: build_server
    runs-on: [self-hosted, "${{ inputs.ENV_NAME }}"]
    permissions:
      contents: read
      packages: read
    environment:
      name: ${{ inputs.ENV_NAME }}
      url: ${{ vars.SERVER_ADDRESS }}
    steps:

      - name: Retrieve the Docker Compose project
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compose
          path: compose

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Writes the Compose project to ~/deployments/<project> - its .env, the apps' settings files and the AppCertificate,
      # from this environment's secrets - then pulls the images, runs the migrations on their own so a failure leaves the
      # running version alone, brings the project up, and fails when a container isn't healthy.
      - name: Deploy
        env:
          ENV_NAME: ${{ inputs.ENV_NAME }}
          SMTP: ${{ secrets.SMTP_CONNECTION_STRING }}
          APP_CERTIFICATE: ${{ secrets.APP_CERTIFICATE }}
          APP_CERTIFICATE_RETIRED: ${{ secrets.APP_CERTIFICATE_RETIRED }}
          SERVERWEB_SETTINGS: ${{ secrets.SERVERWEB_SETTINGS }}
#if (api == "Standalone")
          SERVERAPI_SETTINGS: ${{ secrets.SERVERAPI_SETTINGS }}
#endif
#if (database == "SqlServer")
          SQLSERVER_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
#elif (database == "PostgreSQL")
          POSTGRESSERVER_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
#elif (database == "MySql")
          MYSQLSERVER_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
#elif (database == "Other")
          OTHERDB: ${{ secrets.DATABASE_CONNECTION_STRING }}
#endif
#if (filesStorage == "S3")
          S3: ${{ secrets.S3_CONNECTION_STRING }}
#elif (filesStorage == "AzureBlobStorage")
          AZUREBLOBSTORAGE: ${{ secrets.AZURE_BLOB_STORAGE_CONNECTION_STRING }}
#endif
#if (redis == true)
          REDIS_CACHE_PASSWORD: ${{ secrets.REDIS_CACHE_PASSWORD }}
          REDIS_PERSISTENT_PASSWORD: ${{ secrets.REDIS_PERSISTENT_PASSWORD }}
#endif
#if (cloudflare == true)
          CLOUDFLARE_TUNNEL_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
#endif
#if (notification == true)
          VAPID_PRIVATE_KEY: ${{ secrets.PRIVATE_VAPIDKEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
#endif
        run: |
          set -euo pipefail

          project="$(printf '%s' "boilerplate-$ENV_NAME" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9_\n-' '-')"
          deploy_dir="$HOME/deployments/$project"
          compose() { docker compose --project-name "$project" --project-directory "$deploy_dir" --file "$deploy_dir/docker-compose.yaml" "$@"; }

          umask 077
          mkdir -p "$deploy_dir"
          cp compose/docker-compose.yaml "$deploy_dir/docker-compose.yaml"

          # The .env that aspire publish wrote lists every value the Compose project reads: the images and ports, and the
          # parameters this step's env carries. Single quotes keep Compose from expanding a $ inside a secret.
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          missing=()
          : > "$deploy_dir/.env.new"
          while IFS= read -r key; do
            case "$key" in
              *_IMAGE) value="$repository/$(printf '%s' "${key%_IMAGE}" | tr '[:upper:]_' '[:lower:]-'):${ENV_NAME,,}-$GITHUB_SHA" ;;
              *_PORT) value=8080 ;;
              *) value="${!key:-}" ;;
            esac
            if [[ -z "$value" || "$value" == *"'"* ]]; then
              missing+=("$key")
              continue
            fi
            printf "%s='%s'\n" "$key" "$value" >> "$deploy_dir/.env.new"
          done < <(grep -oE '^[A-Z0-9_]+' compose/.env)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::These values are empty, or contain a single quote: ${missing[*]}"
            exit 1
          fi
          mv "$deploy_dir/.env.new" "$deploy_dir/.env"

          # The settings no parameter carries - serverweb.env (and serverapi.env) - from KEY=value lines, the same way.
          while IFS= read -r file; do
            settings="$(printf '%s' "${file%.env}" | tr '[:lower:]-' '[:upper:]_')_SETTINGS"
            : > "$deploy_dir/$file"
            while IFS= read -r line; do
              line="${line%$'\r'}"
              if [[ -z "$line" || "$line" == "#"* ]]; then
                continue
              fi
              if [[ "$line" != *=* || "${line#*=}" == *"'"* ]]; then
                echo "::error::$settings has a line that is not KEY=value, or whose value contains a single quote: ${line%%=*}"
                exit 1
              fi
              printf "%s='%s'\n" "${line%%=*}" "${line#*=}" >> "$deploy_dir/$file"
            done <<< "${!settings:-}"
          done < <(grep -E '^ +- "?[a-z0-9-]+\.env"?$' compose/docker-compose.yaml | grep -oE '[a-z0-9-]+\.env' | sort -u)

          # The environment's own AppCertificate, and the retired one it replaced while that one still validates tokens
          # (See AppCertificate.md), in the folder the api mounts. Each secret is a .crt and its .key in one PEM, which openssl
          # splits, failing the step on one it can't read. The files are replaced in place, so a running container never
          # finds the folder empty.
          if [[ -z "$APP_CERTIFICATE" ]]; then
            echo "::error::APP_CERTIFICATE is not set."
            exit 1
          fi
          certificates="$deploy_dir/app-certificate"
          mkdir -p "$certificates"
          rm -f "$certificates"/AppCertificate.*
          printf '%s\n' "$APP_CERTIFICATE" | openssl x509 -out "$certificates/AppCertificate.crt"
          printf '%s\n' "$APP_CERTIFICATE" | openssl pkey -out "$certificates/AppCertificate.key"
          if [[ -n "$APP_CERTIFICATE_RETIRED" ]]; then
            printf '%s\n' "$APP_CERTIFICATE_RETIRED" | openssl x509 -out "$certificates/AppCertificate.retired.crt"
            printf '%s\n' "$APP_CERTIFICATE_RETIRED" | openssl pkey -out "$certificates/AppCertificate.retired.key"
          fi
          # Readable by the container's non-root user; the folder around them stays private to the runner's user.
          chmod 0755 "$certificates"
          chmod 0444 "$certificates"/AppCertificate.*

          compose pull --quiet

          # The new version's migrations first, on their own: if they fail, this step fails and the running version of
          # the app is left untouched. `up` would replace the app's container before finding out.
          compose run --rm migrations

          compose up --detach --wait --wait-timeout 600 --remove-orphans || { compose logs --tail 200; exit 1; }

      - name: Check the public address
        env:
          SERVER_ADDRESS: ${{ vars.SERVER_ADDRESS }}
        run: |
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "${SERVER_ADDRESS%/}/alive"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::${SERVER_ADDRESS%/}/alive did not answer for five minutes."
          exit 1
#if (cloudflare == true)

      - name: Purge Cloudflare cache
        uses: jakejarvis/cloudflare-purge-action@eee6dba0236093358f25bb1581bd615dc8b3d8e3 # v0.3.0
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
#endif

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io
#else
  # This project has no .NET Aspire app host, so these workflows do not deploy the server. It deploys once .NET Aspire
  # is in the project.
#endif

  build_blazor_hybrid_windows:
    name: build blazor hybrid (windows)
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment: ${{ inputs.ENV_NAME }}
    steps:

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
  
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Prepare this machine with bit setup
        uses: bitfoundation/bitplatform/.github/actions/boilerplate/bit-setup@v-11.0.0-pre-15
        with:
          arguments: --platforms windows --no-build

      - name: Translate .resx files
        env:
          OpenAI__ApiKey: ${{ secrets.OPENAI_APIKEY }}
          OpenAI__Endpoint: ${{ vars.OPENAI_ENDPOINT }}
        run: |
          bit translate

      - name: Update core appsettings.json
        uses: devops-actions/variable-substitution@ae7b1f3676ae374dc70282e6b9650bc50b611222 # v1.2
        with:
          files: 'src\**\appsettings*json'
        env:
          ServerAddress: ${{ vars.SERVER_ADDRESS }}
          WindowsUpdate.FilesUrl: ${{ vars.WINDOWS_UPDATE_FILES_URL }}

      # Logs in to Azure with the job's OIDC token and points vpk at the Artifact Signing account, so vpk pack signs the app.
      - name: Sign the app with Artifact Signing
        if: vars.CODE_SIGNING_ACCOUNT != ''
        uses: bitfoundation/bitplatform/.github/actions/boilerplate/artifact-signing@v-11.0.0-pre-15
        with:
          endpoint: ${{ vars.CODE_SIGNING_ENDPOINT }}
          account: ${{ vars.CODE_SIGNING_ACCOUNT }}
          certificate-profile: ${{ vars.CODE_SIGNING_CERTIFICATE_PROFILE }}
          client-id: ${{ secrets.CODE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ secrets.CODE_SIGNING_TENANT_ID }}
          subscription-id: ${{ secrets.CODE_SIGNING_SUBSCRIPTION_ID }}

      - name: Publish
        run: |
          cd src\Client\Boilerplate.Client.Windows\
          dotnet publish Boilerplate.Client.Windows.csproj -c Release -o .\publish-result -r win-x86 -p:Version="${{ vars.APP_VERSION }}" --self-contained -p:Environment=${{ inputs.ENV_NAME }}
          dnx vpk@1.3.39-g8d2844f -- pack -u ${{ vars.APP_ID }} -v "${{ vars.APP_VERSION }}" -p .\publish-result -e Boilerplate.Client.Windows.exe -r win-x86 --framework webview2 --icon .\wwwroot\favicon.ico --packTitle '${{ vars.APP_TITLE }}'

      - name: Upload artifact
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-exe-bundle
          path: src\Client\Boilerplate.Client.Windows\Releases

      - name: Attest artifact
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: win-exe-bundle
          subject-digest: sha256:${{ steps.artifact.outputs.artifact-digest }}

  build_blazor_hybrid_android:
    name: build blazor hybrid (android)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment: ${{ inputs.ENV_NAME }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Prepare this machine with bit setup
        uses: bitfoundation/bitplatform/.github/actions/boilerplate/bit-setup@v-11.0.0-pre-15
        with:
          arguments: --platforms android --no-build

      - name: Extract Android signing key
        uses: timheuer/base64-to-file@dfa5a5dd38803cb4f5c3a081eeb28e8362d43e9c # v2.0.0
        with:
          fileDir: './src/Client/Boilerplate.Client.Maui/'
          fileName: 'Boilerplate.keystore'
          encodedString: ${{ secrets.ANDROID_RELEASE_KEYSTORE_FILE_BASE64 }}

      - name: Translate .resx files
        env:
          OpenAI__ApiKey: ${{ secrets.OPENAI_APIKEY }}
          OpenAI__Endpoint: ${{ vars.OPENAI_ENDPOINT }}
        run: |
          bit translate

      - name: Update core appsettings.json
        uses: devops-actions/variable-substitution@ae7b1f3676ae374dc70282e6b9650bc50b611222 # v1.2
        with:
          files: 'src/**/appsettings*json'
        env:
          ServerAddress: ${{ vars.SERVER_ADDRESS }}

      - name: Publish aab
        run: dotnet publish src/Client/Boilerplate.Client.Maui/Boilerplate.Client.Maui.csproj -c Release -p:ApplicationId=${{ vars.APP_ID }} -p:AndroidPackageFormat=aab -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="Boilerplate.keystore" -p:AndroidSigningKeyAlias=Boilerplate -p:AndroidSigningKeyPass="${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}" -p:AndroidSigningStorePass="${{ secrets.ANDROID_RELEASE_SIGNING_PASSWORD }}" -p:Version="${{ vars.APP_VERSION }}" -p:Environment=${{ inputs.ENV_NAME }} -f net11.0-android

      - name: Upload artifact
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-bundle
          path: src/Client/Boilerplate.Client.Maui/bin/Release/net11.0-android/*-Signed.*

      - name: Attest artifact
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: android-bundle
          subject-digest: sha256:${{ steps.artifact.outputs.artifact-digest }}

  build_blazor_hybrid_iOS:
    name: build blazor hybrid (iOS)
    runs-on: xcode-27
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment: ${{ inputs.ENV_NAME }}

    steps:

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '27.0'

      - name: Prepare this machine with bit setup
        uses: bitfoundation/bitplatform/.github/actions/boilerplate/bit-setup@v-11.0.0-pre-15
        with:
          arguments: --platforms ios --no-build

      - name: Translate .resx files
        env:
          OpenAI__ApiKey: ${{ secrets.OPENAI_APIKEY }}
          OpenAI__Endpoint: ${{ vars.OPENAI_ENDPOINT }}
        run: |
          bit translate

      - name: Update core appsettings.json
        uses: devops-actions/variable-substitution@ae7b1f3676ae374dc70282e6b9650bc50b611222 # v1.2
        with:
          files: 'src/**/appsettings*json'
        env:
          ServerAddress: ${{ vars.SERVER_ADDRESS }}

      - name: Import Code-Signing Certificates
        uses: apple-actions/import-codesign-certs@77ba2a2a8f5cfc8c405ebf3159f767c323e238f9 # v7.1.0
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CODE_SIGNING_CERTIFICATE_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CODE_SIGNING_CERTIFICATE_FILE_PASSWORD }}

      - name: Download Apple Provisioning Profiles
        uses: Apple-Actions/download-provisioning-profiles@230860ab5f632551a5f9a5e1d98a774485463888 # v7.0.0
        with:
          bundle-id: ${{ vars.APP_ID }}
          issuer-id: ${{ secrets.APPSTORE_API_KEY_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_KEY_PRIVATE_KEY }}

      - name: Build ipa
        run: dotnet publish src/Client/Boilerplate.Client.Maui/Boilerplate.Client.Maui.csproj -p:ApplicationId=${{ vars.APP_ID }} -p:RuntimeIdentifier=ios-arm64 -c Release -p:ArchiveOnBuild=true -p:CodesignKey="iPhone Distribution" -p:CodesignProvision="${{ vars.IOS_CODE_SIGN_PROVISION }}" -p:Version="${{ vars.APP_VERSION }}" -p:Environment=${{ inputs.ENV_NAME }} -f net11.0-ios

      - name: Upload artifact
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iOS-bundle
          path: src/Client/Boilerplate.Client.Maui/bin/release/net11.0-ios/ios-arm64/publish/*.ipa

      - name: Attest artifact
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: iOS-bundle
          subject-digest: sha256:${{ steps.artifact.outputs.artifact-digest }}
