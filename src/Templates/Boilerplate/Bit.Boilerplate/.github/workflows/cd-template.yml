name: Build and Deploy Template

on:
  workflow_call:
    inputs:
      ENV_NAME:
        required: true
        type: string

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true
  # Lets the About page show the run, the commit and the attestations of the build, only in a public repository whose links anyone can open.
  ShowBuildProvenance: ${{ github.event.repository.visibility == 'public' }}

permissions:
  contents: read

jobs:

#if (aspire == true)
  # The server is a Docker Compose project that .NET Aspire publishes from the app host. This job builds its images on
  # a GitHub-hosted runner, pushes them to GitHub Container Registry tagged with the environment and the commit, and
  # hands the Compose file to deploy_server, which runs on the environment's own server and builds nothing.
  build_server:
    name: build server
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    environment: ${{ inputs.ENV_NAME }}
    steps:

      # The runner's preinstalled toolchains leave a thin margin once the app is published and its images are built, so drop
      # the ones no step here uses, as ci.yml does.
      - name: Free disk space
        run: |
          sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/miniconda /opt/az /usr/local/lib/android/sdk/ndk
          df -h /

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Prepare this machine with bit setup
        uses: bitfoundation/bitplatform/.github/actions/bit-bp/bit-setup@v-11.0.0-pre-19
        with:
          arguments: --no-build

      - name: Check the api against the released versions
        if: inputs.ENV_NAME == 'Production'
        run: bit api check --release

      - name: Translate .resx files
        env:
          OpenAI__ApiKey: ${{ secrets.OPENAI_APIKEY }}
          OpenAI__Endpoint: ${{ vars.OPENAI_ENDPOINT }}
        run: |
          bit translate

      - name: Update core appsettings.json
        uses: devops-actions/variable-substitution@ae7b1f3676ae374dc70282e6b9650bc50b611222 # v1.2
        with:
          files: 'src/**/appsettings*json'
        env:
          ServerAddress: ${{ vars.SERVER_API_ADDRESS || vars.SERVER_ADDRESS }}
#if (notification == true)
          AdsPushVapid.PublicKey: ${{ secrets.PUBLIC_VAPIDKEY }}
#endif

      # bit setup leaves the Aspire CLI out in CI, so it is installed here, at the version of the app host's Aspire SDK.
      - name: Install the Aspire CLI
        run: |
          version="$(grep -oE 'Aspire\.AppHost\.Sdk/[^"]+' src/Server/Boilerplate.Server.AppHost/Boilerplate.Server.AppHost.csproj | cut -d/ -f2)"
          dotnet tool install Aspire.Cli --version "$version" --tool-path "$RUNNER_TEMP/aspire-cli"
          echo "$RUNNER_TEMP/aspire-cli" >> "$GITHUB_PATH"

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push the images
        env:
          ENV_NAME: ${{ inputs.ENV_NAME }}
        run: |
          # Every dotnet build and publish from here on reads Directory.Build.rsp - the ones Aspire runs to build the images
          # included - which gives the images the environment the other jobs pass with -p.
          echo "-p:Environment=$ENV_NAME" > Directory.Build.rsp
          export REGISTRY_ENDPOINT=ghcr.io REGISTRY_REPOSITORY="${GITHUB_REPOSITORY,,}" IMAGE_TAG="${ENV_NAME,,}-$GITHUB_SHA"
          # shellcheck disable=SC1010 # `do` is the aspire subcommand here, not the shell keyword.
          aspire do push --apphost src/Server/Boilerplate.Server.AppHost/Boilerplate.Server.AppHost.csproj --environment "$ENV_NAME" --non-interactive

      - name: Publish the Docker Compose project
        env:
          ENV_NAME: ${{ inputs.ENV_NAME }}
        run: aspire publish --apphost src/Server/Boilerplate.Server.AppHost/Boilerplate.Server.AppHost.csproj --environment "$ENV_NAME" --non-interactive --no-build --output-path aspire-output

      - name: Upload the Docker Compose project
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose
          path: |
            aspire-output/docker-compose.yaml
            aspire-output/.env
          include-hidden-files: true # Required for .env, the list of values the deploy job has to supply
          retention-days: 1

      # In a public repository, also find each pushed image's digest, attest it with actions/attest-build-provenance, and push the attestation to GHCR.

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

  # Runs on the environment's own server: a self-hosted runner labeled with the environment's name (Test or
  # Production) on a machine that has Docker and nothing else - no SDK and no source code. It keeps each environment's
  # Compose project in ~/deployments/<project>-<environment> of the runner's user.
  deploy_server:
    name: deploy server
    needs: build_server
    runs-on: [self-hosted, "${{ inputs.ENV_NAME }}"]
    permissions:
      contents: read
      packages: read
    environment:
      name: ${{ inputs.ENV_NAME }}
      url: ${{ vars.SERVER_ADDRESS }}
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:

      - name: Retrieve the Docker Compose project
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compose
          path: compose

      # The login is this job's own: DOCKER_CONFIG points every later step at a folder in the job's temporary folder. One VM
      # can host both environments with their runners as one user, and a login in that user's ~/.docker would be shared, so
      # the deployment that ended first would log the other out before it pulled its images.
      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker_config="$RUNNER_TEMP/docker-config"
          mkdir -p "$docker_config"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
          echo "$GITHUB_TOKEN" | DOCKER_CONFIG="$docker_config" docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Writes the Compose project to ~/deployments/<project>: its .env, the apps' settings files and the AppCertificate, from
      # this environment's secrets. The steps below read them from there, so only this one sees the secrets.
      - name: Write the Compose project
        env:
          ENV_NAME: ${{ inputs.ENV_NAME }}
          SERVER_ADDRESS: ${{ vars.SERVER_ADDRESS }}
          LANDING_PAGE_ADDRESS: ${{ vars.LANDING_PAGE_ADDRESS }}
          SMTP: ${{ secrets.SMTP_CONNECTION_STRING }}
          APP_CERTIFICATE: ${{ secrets.APP_CERTIFICATE }}
          APP_CERTIFICATE_RETIRED: ${{ secrets.APP_CERTIFICATE_RETIRED }}
          # Every variable and secret of the environment, for the settings no parameter carries: one each (see below).
          VARIABLES: ${{ toJSON(vars) }}
          SECRETS: ${{ toJSON(secrets) }}
#if (cloudflare == true)
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
#endif
#if (database == "SqlServer")
          SQLSERVER_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
#elif (database == "PostgreSQL")
          POSTGRESSERVER_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
#elif (database == "MySql")
          MYSQLSERVER_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
#elif (database == "Other")
          OTHERDB: ${{ secrets.DATABASE_CONNECTION_STRING }}
#endif
#if (filesStorage == "S3")
          S3: ${{ secrets.S3_CONNECTION_STRING }}
#elif (filesStorage == "AzureBlobStorage")
          AZUREBLOBSTORAGE: ${{ secrets.AZURE_BLOB_STORAGE_CONNECTION_STRING }}
#endif
#if (redis == true)
          REDIS_CACHE_PASSWORD: ${{ secrets.REDIS_CACHE_PASSWORD }}
          REDIS_PERSISTENT_PASSWORD: ${{ secrets.REDIS_PERSISTENT_PASSWORD }}
#endif
#if (cloudflare == true)
          CLOUDFLARE_TUNNEL_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
#endif
#if (api == "Standalone")
          SERVER_API_ADDRESS: ${{ vars.SERVER_API_ADDRESS }}
#endif
#if (notification == true)
          VAPID_PRIVATE_KEY: ${{ secrets.PRIVATE_VAPIDKEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
#endif
        run: |
          project="$(printf '%s' "boilerplate-$ENV_NAME" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9_\n-' '-')"
          deploy_dir="$HOME/deployments/$project"
          # Every docker compose command of the steps below finds the project through these.
          { echo "COMPOSE_PROJECT_NAME=$project"; echo "COMPOSE_FILE=$deploy_dir/docker-compose.yaml"; } >> "$GITHUB_ENV"

          umask 077
          mkdir -p "$deploy_dir"
          cp compose/docker-compose.yaml "$deploy_dir/docker-compose.yaml"

          # An origin is scheme://host[:port] with no path, which is how TrustedOrigins entries and Caddy's sites are matched.
          origin() { printf '%s' "$1" | grep -oE '^https?://[^/]+' || true; }
          #if (api == "Standalone")

          # A standalone api is reached at its own address: the apps were built with it as ServerAddress. Given the web app's
          # address instead, the SignalR hub, the discovery document and everything else only the api serves are missing.
          api_origin="$(origin "$SERVER_API_ADDRESS")"
          if [[ -z "$api_origin" ]]; then
            echo "::error::Set SERVER_API_ADDRESS, the api's public address. The clients call the api there."
            exit 1
          fi
          #endif

          DASHBOARD_API_KEY="$(sed -n "s/^DASHBOARD_API_KEY='\([0-9a-f]*\)'$/\1/p" "$deploy_dir/.env" 2>/dev/null || true)"
          DASHBOARD_API_KEY="${DASHBOARD_API_KEY:-$(openssl rand -hex 32)}"
          DASHBOARD_BROWSER_TOKEN="$(sed -n "s/^DASHBOARD_BROWSER_TOKEN='\([0-9a-f]*\)'$/\1/p" "$deploy_dir/.env" 2>/dev/null || true)"
          DASHBOARD_BROWSER_TOKEN="${DASHBOARD_BROWSER_TOKEN:-$(openssl rand -hex 32)}"

          # The .env that aspire publish wrote lists every value the Compose project reads: the images and ports, and the
          # parameters this step's env carries. Single quotes keep Compose from expanding a $ inside a secret.
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          missing=()
          : > "$deploy_dir/.env.new"
          while IFS= read -r key; do
            case "$key" in
              *_IMAGE) value="$repository/$(printf '%s' "${key%_IMAGE}" | tr '[:upper:]_' '[:lower:]-'):${ENV_NAME,,}-$GITHUB_SHA" ;;
              *_PORT) value=8080 ;;
              *) value="${!key:-}" ;;
            esac
            if [[ -z "$value" || "$value" == *"'"* ]]; then
              missing+=("$key")
              continue
            fi
            printf "%s='%s'\n" "$key" "$value" >> "$deploy_dir/.env.new"
          done < <(grep -oE '^[A-Z0-9_]+' compose/.env)
          if (( ${#missing[@]} > 0 )); then
            echo "::error::These values are empty, or contain a single quote: ${missing[*]}"
            exit 1
          fi
          mv "$deploy_dir/.env.new" "$deploy_dir/.env"

          # The settings no parameter carries go into each app's own settings file - serverweb.env, landingpage.env (and
          # serverapi.env) - one KEY='value' line each. Setting the same key twice is a mistake, not an override, so it stops
          # the deployment.
          declare -A settings_file=() set_by=()
          setting() {
            local file="$1" key="$2" value="$3" source="$4" id="$1:${2^^}"
            if [[ -n "${set_by[$id]:-}" ]]; then
              echo "::error::${source^} sets $key in $file, which ${set_by[$id]} already sets. Keep one of them."
              exit 1
            fi
            if [[ "$value" == *"'"* || "$value" == *$'\n'* ]]; then
              echo "::error::${source^} holds a single quote or a line break, which $file can't carry."
              exit 1
            fi
            set_by[$id]="$source"
            printf "%s='%s'\n" "$key" "$value" >> "$deploy_dir/$file"
          }

          while IFS= read -r file; do
            settings_file[$(printf '%s' "${file%.env}" | tr '[:lower:]-' '[:upper:]_')]="$file"
            : > "$deploy_dir/$file"

            # Each app first trusts its own public address. The Host header is the client's to write, so the apps link
            # emails, the sitemap and the like only to a host in TrustedOrigins, and answer any other host with a 400.
            # The web app (and the api, whose links point to the web app) trusts SERVER_ADDRESS; the landing page its own.
            address="$SERVER_ADDRESS"
            if [[ "$file" == "landingpage.env" ]]; then
              address="$LANDING_PAGE_ADDRESS"
            fi
            origin="$(origin "$address")"
            # Without it the app would refuse its own address, so stop here rather than deploy one that answers 400.
            if [[ -z "$origin" ]]; then
              echo "::error::$file has no public address to trust: set SERVER_ADDRESS, and LANDING_PAGE_ADDRESS for the landing page."
              exit 1
            fi
            # Index 100 adds the address after the TrustedOrigins of appsettings.json (the binder keeps the order and skips
            # the missing indexes) instead of replacing its first entry. The lines below can still add more.
            setting "$file" TrustedOrigins__100 "$origin" "this deployment"
            #if (api == "Standalone")
            # An OAuth client, such as an MCP client signing in to /dev-mcp, reaches a standalone api with no origin, so the api
            # takes the consent page's address from WebAppUrl. Without it, the client lands on the api's own host.
            if [[ "$file" == "serverapi.env" ]]; then
              setting "$file" WebAppUrl "$origin" "this deployment"
              setting "$file" TrustedOrigins__101 "$api_origin" "this deployment"
            fi
            #endif
            #if (cloudflare == true)
            # The landing page's browser posts its telemetry to its own address, where the tunnel sends /v1/ to the dashboard.
            #else
            # The landing page's browser posts its telemetry to its own address, where Caddy sends /v1/ to the dashboard.
            #endif
            if [[ "$file" == "landingpage.env" ]]; then
              setting "$file" Belemetry__OtlpEndpoint "$origin" "this deployment"
            fi
          done < <(grep -E '^ +- "?[a-z0-9-]+\.env"?$' compose/docker-compose.yaml | grep -oE '[a-z0-9-]+\.env' | sort -u)
          #if (api != "Standalone")
          # The api runs inside serverweb, so its settings go there, whether their secret starts with SERVERWEB__ or SERVERAPI__.
          settings_file[SERVERAPI]="${settings_file[SERVERWEB]}"
          #endif
          #if (cloudflare == true)

          # The api purges Cloudflare's cache by tag with the token and zone this deployment purges it with, rather than a
          # second copy of them.
          if [[ -n "$CLOUDFLARE_TOKEN" && -n "$CLOUDFLARE_ZONE" ]]; then
            setting "${settings_file[SERVERAPI]}" Cloudflare__ApiToken "$CLOUDFLARE_TOKEN" CLOUDFLARE_TOKEN
            setting "${settings_file[SERVERAPI]}" Cloudflare__ZoneIds__0 "$CLOUDFLARE_ZONE" CLOUDFLARE_ZONE
          fi
          #endif

          # Every other setting is a variable or a secret of its own, named <SERVICE>__<Section>__<Key>:
          # SERVERAPI__SMS__PROVIDERS__TWILIO__AUTHTOKEN is the api's Sms:Providers:Twilio:AuthToken. A secret for a key, a
          # variable for what isn't secret, such as a model name or a flag: GitHub blanks a secret's value out of every log, so
          # a secret holding `true` would hide every "true" there. GitHub keeps their names in upper case, which .NET's
          # configuration doesn't mind, and changing one setting changes it alone. jq reads them out of toJSON(vars) and
          # toJSON(secrets).
          if ! command -v jq > /dev/null; then
            echo "::error::Install jq on this server (sudo apt-get install -y jq). The deployment reads the apps' settings out of the environment's variables and secrets with it."
            exit 1
          fi
          while IFS=$'\t' read -r kind name value; do
            if [[ "${name^^}" == *__SUPPORTEDAPPVERSIONS__* || "${name^^}" == APP_VERSION ]]; then
              echo "::error::Delete the $kind $name: the version stays in src/Directory.Build.props and SupportedAppVersions in Server.Api's appsettings files, where bit api check reads them."
              exit 1
            fi
            prefix="${name%%__*}"
            file=""
            if [[ -n "$prefix" && -n "${name#*__}" ]]; then
              file="${settings_file[${prefix^^}]:-}"
            fi
            if [[ -z "$file" ]]; then
              echo "::error::The $kind $name isn't <SERVICE>__<Section>__<Key> with a SERVICE of this deployment: ${!settings_file[*]}."
              exit 1
            fi
            setting "$file" "${name#*__}" "$(printf '%s' "$value" | base64 -d)" "the $kind $name"
          done < <(
            jq -r 'to_entries[] | select(.key | contains("__") or . == "APP_VERSION") | "variable\t\(.key)\t\(.value | @base64)"' <<< "$VARIABLES"
            jq -r 'to_entries[] | select(.key | contains("__") or . == "APP_VERSION") | "secret\t\(.key)\t\(.value | @base64)"' <<< "$SECRETS"
          )
          #if (cloudflare != true)

          # Anyone can post to the landing page's /v1/ paths, so each request's body is capped. A rate limit needs a Caddy
          # build with a plugin, so without Cloudflare nothing limits how often.
          {
            printf '%s {\n\treverse_proxy serverweb:8080\n}\n\n' "$(origin "$SERVER_ADDRESS")"
          #if (api == "Standalone")
            printf '%s {\n\treverse_proxy serverapi:8080\n}\n\n' "$(origin "$SERVER_API_ADDRESS")"
          #endif
            printf '%s {\n\t@otlp path_regexp ^/v1/(traces|logs|metrics)$\n\thandle @otlp {\n\t\trequest_body {\n\t\t\tmax_size 2MB\n\t\t}\n\t\treverse_proxy compose-dashboard:18890\n\t}\n\thandle {\n\t\treverse_proxy landingpage:8080\n\t}\n}\n' "$(origin "$LANDING_PAGE_ADDRESS")"
          } > "$deploy_dir/Caddyfile"
          #endif

          # The environment's own AppCertificate, and the retired one it replaced while that one still validates tokens
          # (See AppCertificate.md), in the folder the api mounts. Each secret is a .crt and its .key in one PEM, which openssl
          # splits, failing the step on one it can't read. The files are replaced in place, so a running container never
          # finds the folder empty.
          if [[ -z "$APP_CERTIFICATE" ]]; then
            echo "::error::APP_CERTIFICATE is not set."
            exit 1
          fi
          certificates="$deploy_dir/app-certificate"
          mkdir -p "$certificates"
          rm -f "$certificates"/AppCertificate.*
          printf '%s\n' "$APP_CERTIFICATE" | openssl x509 -out "$certificates/AppCertificate.crt"
          printf '%s\n' "$APP_CERTIFICATE" | openssl pkey -out "$certificates/AppCertificate.key"
          if [[ -n "$APP_CERTIFICATE_RETIRED" ]]; then
            printf '%s\n' "$APP_CERTIFICATE_RETIRED" | openssl x509 -out "$certificates/AppCertificate.retired.crt"
            printf '%s\n' "$APP_CERTIFICATE_RETIRED" | openssl pkey -out "$certificates/AppCertificate.retired.key"
          fi
          # Readable by the container's non-root user; the folder around them stays private to the runner's user.
          chmod 0755 "$certificates"
          chmod 0444 "$certificates"/AppCertificate.*

      - name: Pull the images
        run: |
          # A registry or a network that drops one download shouldn't fail a deployment.
          for attempt in 1 2 3; do
            if docker compose pull --quiet; then
              break
            fi
            if (( attempt == 3 )); then
              echo "::error::The images could not be pulled."
              exit 1
            fi
            sleep 15
          done

      # A failure leaves the running version alone. It keeps serving while the migrations run, so a migration has to leave
      # the database working for that version too. The run prints where the database stood, for the two undo steps below.
      - name: Migrate the database
        id: migrate
        run: |
          status=0
          docker compose run --rm migrations | tee "$RUNNER_TEMP/migrations.log" || status=$?
          printed() { sed -n "s/^$1=//p" "$RUNNER_TEMP/migrations.log" | tr -d '\r' | tail -n 1; }

          if ! grep -q '^LastSharedMigration=' "$RUNNER_TEMP/migrations.log"; then
            echo "undo_to=$(printed LastAppliedMigration)" >> "$GITHUB_OUTPUT"
          elif shared="$(printed LastSharedMigration)"; [[ -z "$shared" ]]; then
            echo "::warning::The database has migrations this version doesn't know and shares none with it, so they stay applied."
          else
            # An older commit, or another branch on Test, is being deployed: only the image running now has the Down of the
            # migrations this one doesn't know, and it goes back to the last migration both know. That is also where this
            # image goes back to if the deployment fails before any new container starts, undoing what it applied after it.
            echo "undo_to=$shared" >> "$GITHUB_OUTPUT"
            #if (api == "Standalone")
            api=serverapi
            #else
            api=serverweb
            #endif
            image="$(docker ps --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" --filter "label=com.docker.compose.service=$api" --format '{{.Image}}' | tail -n 1)"
            { echo "rollback_to=$shared"; echo "rollback_image=$image"; echo "rollback_image_key=${api^^}_IMAGE"; } >> "$GITHUB_OUTPUT"
            echo "rollback_keeps=$(printed RunningImageKeeps)" >> "$GITHUB_OUTPUT"
          fi
          # Going back to a migration leaves those applied before it, which each image names, for the two undo steps to say so
          # (DeploymentMigrations has an example).
          echo "undo_keeps=$(printed ThisImageKeeps)" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Start everything but the apps
        run: |
          # migrations and container-volume-init are one-shot: the migrate step has run them, and --wait fails on a container
          # that exited.
          others=()
          while IFS= read -r service; do
            case "$service" in
              serverapi | serverweb | landingpage | migrations | container-volume-init) ;;
              *) others+=("$service") ;;
            esac
          done < <(docker compose config --services)
          docker compose up --detach --wait --wait-timeout 600 --no-deps --remove-orphans "${others[@]}" || { docker compose logs --tail 200; exit 1; }

      # No downtime: each new container starts next to the running one, whatever routes to the service's name finds both and
      # skips the one that isn't listening yet. The old ones are stopped only once every new one is healthy, so all the apps
      # change together or none does, and stopping lets the requests in flight finish. Healthy is Docker's health check of
      # the container, its /alive.
      - name: Replace the apps
        id: apps
        run: |
          apps=()
          while IFS= read -r service; do
            case "$service" in
              serverapi | serverweb | landingpage) apps+=("$service") ;;
            esac
          done < <(docker compose config --services)
          containers() { docker ps "$@" --quiet --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" --filter "label=com.docker.compose.service=$service"; }

          old=()
          new=()
          replaced=false
          # Whatever goes wrong before the old containers stop, the new ones go and the old ones keep serving. Anything that
          # wasn't running before this step counts as new, so a container that a failed `up` started goes too.
          before=()
          for service in "${apps[@]}"; do
            mapfile -t -O "${#before[@]}" before < <(containers)
          done
          remove_new() {
            [[ "$replaced" != true ]] || return 0
            for service in "${apps[@]}"; do
              mapfile -t current < <(containers --all)
              for id in "${current[@]}"; do
                [[ " ${before[*]} " == *" $id "* ]] || docker rm --force "$id" > /dev/null || true
              done
            done
          }
          trap remove_new EXIT

          for service in "${apps[@]}"; do
            mapfile -t stale < <(containers --all --filter status=created --filter status=exited --filter status=dead)
            if (( ${#stale[@]} > 0 )); then
              docker rm --force "${stale[@]}" > /dev/null
            fi

            mapfile -t running < <(containers)
            docker compose up --detach --no-deps --no-recreate --scale "$service=$(( ${#running[@]} + 1 ))" "$service"
            mapfile -t started < <(containers | grep --invert-match --line-regexp --fixed-strings --file <(printf '%s\n' "${running[@]}"))
            if (( ${#started[@]} == 0 )); then
              echo "::error::No new container of $service started."
              exit 1
            fi
            old+=("${running[@]}")
            new+=("${started[@]}")
          done

          deadline=$(( SECONDS + 600 ))
          for container in "${new[@]}"; do
            while true; do
              health="$(docker inspect --format '{{.State.Health.Status}}' "$container")"
              if [[ "$health" == healthy ]]; then
                break
              fi
              if [[ "$health" == unhealthy ]] || (( SECONDS > deadline )); then
                docker logs --tail 200 "$container" || true
                echo "::error::A new container never got healthy ($health). The running version keeps serving, on the new database schema. Undoing the migrations is left to a person, as the new containers may have taken requests."
                exit 1
              fi
              sleep 5
            done
          done

          # /alive only says the process runs. /health also runs every dependency's check, so a 503 there says the new
          # version can't reach one. It doesn't stop the swap: a dependency both versions share, such as an outside service
          # that is down, would then also block the deployment that fixes it.
          for container in "${new[@]}"; do
            name="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$container")"
            status="$(timeout 40 docker exec "$container" bash -c "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -n 1 <&3" || true)"
            read -r _ code _ <<< "$status"
            if [[ "$code" != 200 ]]; then
              echo "::warning::/health of the new $name answered ${code:-nothing}. The swap goes on. The health checks page, or GetHealth on dev-mcp for the api, says which check fails."
            fi
          done

          replaced=true
          echo "replaced=true" >> "$GITHUB_OUTPUT"
          if (( ${#old[@]} > 0 )); then
            docker stop --time 30 "${old[@]}" > /dev/null
            docker rm "${old[@]}" > /dev/null
          fi
          #if (cloudflare != true)
          docker compose exec -T reverse-proxy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
          #endif

      # The deployment failed before any new container started, so nobody has used the new schema and the database goes
      # back to where it stood. Once one has started it may have taken requests, and a Down would delete what they wrote:
      # the database then stays ahead, which the running version works on. It doesn't run on the first deployment, which
      # has nothing to go back to.
      - name: Undo this deployment's migrations
        if: failure() && steps.migrate.outputs.undo_to != '' && steps.apps.outcome == 'skipped'
        env:
          UNDO_TO: ${{ steps.migrate.outputs.undo_to }}
          UNDO_KEEPS: ${{ steps.migrate.outputs.undo_keeps }}
        run: |
          if ! docker compose run --rm --env "MigrateDatabaseTo=$UNDO_TO" migrations; then
            echo "::error::The migrations could not be undone. The database stays ahead of the running version."
          elif [[ -n "$UNDO_KEEPS" ]]; then
            echo "::warning::Migrations of this version that come before $UNDO_TO stay applied, since going back to it undoes only those after it: $UNDO_KEEPS. The running version works on them, but undo them by hand if they get in the way."
          fi

      # After the swap, because the version just stopped needed them, and this version works on that database meanwhile.
      - name: Undo the migrations this version doesn't have
        if: steps.migrate.outputs.rollback_image != ''
        env:
          ROLLBACK_TO: ${{ steps.migrate.outputs.rollback_to }}
          ROLLBACK_IMAGE: ${{ steps.migrate.outputs.rollback_image }}
          ROLLBACK_IMAGE_KEY: ${{ steps.migrate.outputs.rollback_image_key }}
          ROLLBACK_KEEPS: ${{ steps.migrate.outputs.rollback_keeps }}
        run: |
          if ! env "$ROLLBACK_IMAGE_KEY=$ROLLBACK_IMAGE" docker compose run --rm --env "MigrateDatabaseTo=$ROLLBACK_TO" migrations; then
            echo "::warning::The migrations this version doesn't have could not be undone. It works on them, but the next deployment finds them applied."
          elif [[ -n "$ROLLBACK_KEEPS" ]]; then
            echo "::warning::Migrations this version doesn't have that come before $ROLLBACK_TO stay applied, since going back to it undoes only those after it: $ROLLBACK_KEEPS. This version works on them, but the next deployment finds them applied."
          fi

      # Every deployment pulls images tagged with its commit, so the old ones would fill the disk. Those of the running
      # containers stay, and a rollback pulls its images again. A failed prune isn't worth failing a deployment that is up.
      - name: Remove old images
        run: docker image prune --all --force --filter "until=72h" > /dev/null || echo "::warning::The old images were not pruned."

      - name: Check the public address
        env:
          SERVER_ADDRESS: ${{ vars.SERVER_ADDRESS }}
#if (api == "Standalone")
          SERVER_API_ADDRESS: ${{ vars.SERVER_API_ADDRESS }}
#endif
        run: |
          for address in "$SERVER_ADDRESS" ${SERVER_API_ADDRESS:+"$SERVER_API_ADDRESS"}; do
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 10 "${address%/}/alive"; then
                continue 2
              fi
              sleep 10
            done
            echo "::error::${address%/}/alive did not answer for five minutes."
            exit 1
          done

      - name: Check the landing page's public address
        env:
          LANDING_PAGE_ADDRESS: ${{ vars.LANDING_PAGE_ADDRESS }}
        run: |
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "${LANDING_PAGE_ADDRESS%/}/alive"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::${LANDING_PAGE_ADDRESS%/}/alive did not answer for five minutes."
          exit 1

      # /alive only says the process runs. /health runs every check, and a 503 there is a dependency failing, for which a
      # load balancer or a monitor takes the instance for dead. Degraded, such as a service with no settings yet, still
      # answers 200. A report rather than a gate: the old version has already stopped, so there is nothing to go back to.
      # The swap's gate is each new container's /alive, in Replace the apps.
      - name: Report the dependencies' health
        env:
          SERVER_ADDRESS: ${{ vars.SERVER_ADDRESS }}
          LANDING_PAGE_ADDRESS: ${{ vars.LANDING_PAGE_ADDRESS }}
#if (api == "Standalone")
          SERVER_API_ADDRESS: ${{ vars.SERVER_API_ADDRESS }}
#endif
        run: |
          for address in "$SERVER_ADDRESS" "$LANDING_PAGE_ADDRESS" ${SERVER_API_ADDRESS:+"$SERVER_API_ADDRESS"}; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 "${address%/}/health" || true)"
            if [[ "$status" != 200 ]]; then
              echo "::warning::${address%/}/health answered $status. The health checks page, or GetHealth on dev-mcp for the api, says which check fails."
            fi
          done
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 --request POST --header 'Content-Type: application/x-protobuf' --data-binary '' "${LANDING_PAGE_ADDRESS%/}/v1/logs" || true)"
          if [[ "$status" != 200 ]]; then
            echo "::warning::${LANDING_PAGE_ADDRESS%/}/v1/logs answered $status, so the landing page's browser telemetry doesn't reach the Aspire dashboard."
          fi
#if (cloudflare == true)

      - name: Purge Cloudflare cache
        uses: jakejarvis/cloudflare-purge-action@eee6dba0236093358f25bb1581bd615dc8b3d8e3 # v0.3.0
        env:
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
#endif

      - name: Log out of GitHub Container Registry
        if: always()
        run: docker logout ghcr.io
#else
  # This project has no .NET Aspire app host, so these workflows do not deploy the server. It deploys once .NET Aspire
  # is in the project.
#endif

  build_blazor_hybrid_windows:
    name: build blazor hybrid (windows)
    # Off until the app ships on this platform: every run spends Actions minutes. Turn it on for the environments that
    # build it, such as `if: inputs.ENV_NAME == 'Production'`, and set its secrets (.docs/16).
    if: false
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment: ${{ inputs.ENV_NAME }}
    steps:

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
  
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Prepare this machine with bit setup
        uses: bitfoundation/bitplatform/.github/actions/bit-bp/bit-setup@v-11.0.0-pre-19
        with:
          arguments: --platforms windows --no-build

      - name: Translate .resx files
        env:
          OpenAI__ApiKey: ${{ secrets.OPENAI_APIKEY }}
          OpenAI__Endpoint: ${{ vars.OPENAI_ENDPOINT }}
        run: |
          bit translate

      - name: Update core appsettings.json
        uses: devops-actions/variable-substitution@ae7b1f3676ae374dc70282e6b9650bc50b611222 # v1.2
        with:
          files: 'src\**\appsettings*json'
        env:
          ServerAddress: ${{ vars.SERVER_API_ADDRESS || vars.SERVER_ADDRESS }}
          WindowsUpdate.FilesUrl: ${{ vars.WINDOWS_UPDATE_FILES_URL }}

      # Logs in to Azure with the job's OIDC token and points vpk at the Artifact Signing account, so vpk pack signs the app.
      - name: Sign the app with Artifact Signing
        if: vars.CODE_SIGNING_ACCOUNT != ''
        uses: bitfoundation/bitplatform/.github/actions/bit-bp/artifact-signing@v-11.0.0-pre-19
        with:
          endpoint: ${{ vars.CODE_SIGNING_ENDPOINT }}
          account: ${{ vars.CODE_SIGNING_ACCOUNT }}
          certificate-profile: ${{ vars.CODE_SIGNING_CERTIFICATE_PROFILE }}
          client-id: ${{ secrets.CODE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ secrets.CODE_SIGNING_TENANT_ID }}
          subscription-id: ${{ secrets.CODE_SIGNING_SUBSCRIPTION_ID }}

      - name: Publish
        env:
          # Read from the environment, so no character of the title is read as part of the script.
          APP_TITLE: ${{ vars.APP_TITLE }}
          BUILD_NUMBER: ${{ inputs.ENV_NAME != 'Production' && github.run_number || '' }}
        run: |
          cd src\Client\Boilerplate.Client.Windows\
          dotnet publish Boilerplate.Client.Windows.csproj -c Release -o .\publish-result -r win-x86 --self-contained -p:Environment=${{ inputs.ENV_NAME }}
          $version = dotnet msbuild Boilerplate.Client.Windows.csproj -getProperty:Version
          if ($env:BUILD_NUMBER) { $version = "$version-build.$env:BUILD_NUMBER" }
          dnx vpk@1.3.39-g8d2844f -- pack -u ${{ vars.APP_ID }} -v $version -p .\publish-result -e Boilerplate.Client.Windows.exe -r win-x86 --framework webview2 --icon .\wwwroot\favicon.ico --packTitle $env:APP_TITLE

      - name: Upload artifact
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-exe-bundle
          path: src\Client\Boilerplate.Client.Windows\Releases
          retention-days: 1

      - name: Attest artifact
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: win-exe-bundle
          subject-digest: sha256:${{ steps.artifact.outputs.artifact-digest }}

  build_blazor_hybrid_android:
    name: build blazor hybrid (android)
    # Off until the app ships on this platform: every run spends Actions minutes. Turn it on for the environments that
    # build it, such as `if: inputs.ENV_NAME == 'Production'`, and set its secrets (.docs/16).
    if: false
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment: ${{ inputs.ENV_NAME }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Prepare this machine with bit setup
        uses: bitfoundation/bitplatform/.github/actions/bit-bp/bit-setup@v-11.0.0-pre-19
        with:
          arguments: --platforms android --no-build

      - name: Extract Android signing key
        uses: timheuer/base64-to-file@dfa5a5dd38803cb4f5c3a081eeb28e8362d43e9c # v2.0.0
        with:
          fileDir: './src/Client/Boilerplate.Client.Maui/'
          fileName: 'Boilerplate.keystore'
          encodedString: ${{ secrets.ANDROID_RELEASE_KEYSTORE_FILE_BASE64 }}

      - name: Translate .resx files
        env:
          OpenAI__ApiKey: ${{ secrets.OPENAI_APIKEY }}
          OpenAI__Endpoint: ${{ vars.OPENAI_ENDPOINT }}
        run: |
          bit translate

      - name: Update core appsettings.json
        uses: devops-actions/variable-substitution@ae7b1f3676ae374dc70282e6b9650bc50b611222 # v1.2
        with:
          files: 'src/**/appsettings*json'
        env:
          ServerAddress: ${{ vars.SERVER_API_ADDRESS || vars.SERVER_ADDRESS }}

      - name: Publish aab
        env:
          # Read from the environment, so no character of the title is read as part of the script, and passed to MSBuild in
          # quotes of its own, so a comma in it doesn't end the property.
          APP_TITLE: ${{ vars.APP_TITLE }}
          BUILD_NUMBER: ${{ inputs.ENV_NAME != 'Production' && github.run_number || '' }}
        run: dotnet publish src/Client/Boilerplate.Client.Maui/Boilerplate.Client.Maui.csproj -c Release -p:ApplicationId=${{ vars.APP_ID }} "-p:ApplicationTitle=\"$APP_TITLE\"" ${BUILD_NUMBER:+-p:ApplicationVersion=$BUILD_NUMBER} -p:AndroidPackageFormat=aab -p:AndroidKeyStore=true -p:AndroidSigningKeyStore="Boilerplate.keystore" -p:AndroidSigningKeyAlias=Boilerplate -p:AndroidSigningKeyPass="${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}" -p:AndroidSigningStorePass="${{ secrets.ANDROID_RELEASE_SIGNING_PASSWORD }}" -p:Environment=${{ inputs.ENV_NAME }} -f net11.0-android

      - name: Upload artifact
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-bundle
          path: src/Client/Boilerplate.Client.Maui/bin/Release/net11.0-android/*-Signed.*
          retention-days: 1

      - name: Attest artifact
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: android-bundle
          subject-digest: sha256:${{ steps.artifact.outputs.artifact-digest }}

  build_blazor_hybrid_iOS:
    name: build blazor hybrid (iOS)
    # Off until the app ships on this platform: every run spends Actions minutes. Turn it on for the environments that
    # build it, such as `if: inputs.ENV_NAME == 'Production'`, and set its secrets (.docs/16).
    if: false
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment: ${{ inputs.ENV_NAME }}

    steps:

      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '27.2'

      - name: Prepare this machine with bit setup
        uses: bitfoundation/bitplatform/.github/actions/bit-bp/bit-setup@v-11.0.0-pre-19
        with:
          arguments: --platforms ios --no-build

      - name: Translate .resx files
        env:
          OpenAI__ApiKey: ${{ secrets.OPENAI_APIKEY }}
          OpenAI__Endpoint: ${{ vars.OPENAI_ENDPOINT }}
        run: |
          bit translate

      - name: Update core appsettings.json
        uses: devops-actions/variable-substitution@ae7b1f3676ae374dc70282e6b9650bc50b611222 # v1.2
        with:
          files: 'src/**/appsettings*json'
        env:
          ServerAddress: ${{ vars.SERVER_API_ADDRESS || vars.SERVER_ADDRESS }}

      - name: Import Code-Signing Certificates
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CODE_SIGNING_CERTIFICATE_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CODE_SIGNING_CERTIFICATE_FILE_PASSWORD }}

      - name: Download Apple Provisioning Profiles
        uses: Apple-Actions/download-provisioning-profiles@233aa54e59082c0e8a8cf8b0b02c72dea2422ef9 # v7.1.0
        with:
          bundle-id: ${{ vars.APP_ID }}
          issuer-id: ${{ secrets.APPSTORE_API_KEY_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_KEY_PRIVATE_KEY }}

      - name: Build ipa
        env:
          # As for Android.
          APP_TITLE: ${{ vars.APP_TITLE }}
          BUILD_NUMBER: ${{ inputs.ENV_NAME != 'Production' && github.run_number || '' }}
        run: dotnet publish src/Client/Boilerplate.Client.Maui/Boilerplate.Client.Maui.csproj -p:ApplicationId=${{ vars.APP_ID }} "-p:ApplicationTitle=\"$APP_TITLE\"" ${BUILD_NUMBER:+-p:ApplicationVersion=$BUILD_NUMBER} -p:RuntimeIdentifier=ios-arm64 -c Release -p:ArchiveOnBuild=true -p:CodesignKey="iPhone Distribution" -p:CodesignProvision="${{ vars.IOS_CODE_SIGN_PROVISION }}" -p:Environment=${{ inputs.ENV_NAME }} -f net11.0-ios

      - name: Upload artifact
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iOS-bundle
          path: src/Client/Boilerplate.Client.Maui/bin/release/net11.0-ios/ios-arm64/publish/*.ipa
          retention-days: 1

      - name: Attest artifact
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: iOS-bundle
          subject-digest: sha256:${{ steps.artifact.outputs.artifact-digest }}
