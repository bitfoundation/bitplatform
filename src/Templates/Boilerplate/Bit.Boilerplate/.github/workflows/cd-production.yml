name: Boilerplate Production CD

on:
  workflow_dispatch:
  # The deploy skill uncomments this once the first deployment to Production has worked. Until then this runs only by hand,
  # so a project with nowhere to deploy to yet spends no Actions minutes on it. Uncomment all of it: `paths` without
  # `branches` would run this on every branch. This file is in its own `paths`, so the merge that turns it on deploys.
  # push:
  #   branches: [ "main" ]
  #   paths: [ ".github/workflows/cd-production.yml", "src/Shared/**", "src/Server/**", "src/Client/**", "src/LandingPage/**", "src/Directory.Build.props", "src/Directory.Packages.props" ]

# `environment:` gates approval but does NOT serialize runs, so without this two pushes in quick
# succession can finish out of order and leave the OLDER commit deployed. Queue instead of cancelling:
# a deploy that has already started must not be killed halfway.
concurrency:
  group: cd-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  ci:
    name: ci
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build_and_deploy_prod:
    name: build and deploy to production
    needs: ci
    permissions:
      contents: read
      id-token: write
      attestations: write
#if (aspire == true)
      # build_server pushes the server's images to GitHub Container Registry (write), and deploy_server pulls them (read).
      packages: write
#endif
    uses: ./.github/workflows/cd-template.yml
    with:
      ENV_NAME: Production
    secrets: inherit
