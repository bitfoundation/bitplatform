name: Boilerplate CI

# https://bitplatform.dev/templates/dev-ops

on:
  workflow_dispatch:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  build_and_test:
    name: build and test
    # A draft is still changing, so it spends none of the plan's Actions minutes. Marking it ready runs this.
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-26.04
    # Without a cap, a hung job runs for six hours, close to a fifth of a GitHub Free plan's monthly minutes.
    timeout-minutes: 45

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    # The runner's preinstalled toolchains leave a thin margin once the tests are built, so drop the ones no project here uses.
    - name: Free disk space
      run: |
        sudo rm -rf /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/miniconda /opt/az /usr/local/lib/android/sdk/ndk
        df -h /

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: global.json

    - name: Verify formatting
      run: dotnet format whitespace --folder . --verify-no-changes

    - name: Set up and build with bit setup
      uses: bitfoundation/bitplatform/.github/actions/bit-bp/bit-setup@v-11.0.0-pre-17
      with:
        arguments: --platforms android -p:EnforceCodeStyleInBuild=true

    - name: Test
      id: test
      run: cd src/Tests && dotnet test

    - name: Upload Tests Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ failure() && steps.test.conclusion == 'failure' }}
      with:
        name: tests-artifact
        path: ./src/Tests/TestResults
        retention-days: 14
#if (advancedTests == true)

    - name: Test the landing page
      if: ${{ !cancelled() }}
      run: cd src/LandingPage/Boilerplate.LandingPage.Tests && dotnet test

    - name: Test the Workbench
      id: test-workbench
      if: ${{ !cancelled() }}
      run: cd src/WorkbenchTests && dotnet test

    - name: Upload Workbench Tests Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ failure() && steps.test-workbench.conclusion == 'failure' }}
      with:
        name: workbench-tests-artifact
        path: ./src/WorkbenchTests/TestResults
        retention-days: 14
#endif
