name: Boilerplate CI

# https://bitplatform.dev/templates/dev-ops

on:
  workflow_dispatch:
  workflow_call:
  pull_request:

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read

jobs:

  build:
    name: build
    runs-on: ubuntu-26.04

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Verify formatting
      run: dotnet format whitespace --folder . --verify-no-changes

    - name: Set up and build with bit setup
      uses: bitfoundation/bitplatform/.github/actions/boilerplate/bit-setup@v-11.0.0-pre-16
      with:
        arguments: --platforms android --no-browsers -p:EnforceCodeStyleInBuild=true

  test:
    name: test
    runs-on: ubuntu-26.04

    steps:

    - name: Checkout source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
          persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Prepare this machine and build with bit setup
      uses: bitfoundation/bitplatform/.github/actions/boilerplate/bit-setup@v-11.0.0-pre-16

    - name: Test
      id: test
      run: cd src/Tests && dotnet test

    - name: Upload Tests Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ failure() && steps.test.conclusion == 'failure' }}
      with:
        name: tests-artifact
        path: ./src/Tests/TestResults
        retention-days: 14
#if (advancedTests == true)

    - name: Test the Workbench
      id: test-workbench
      if: ${{ !cancelled() }}
      run: cd src/WorkbenchTests && dotnet test

    - name: Upload Workbench Tests Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: ${{ failure() && steps.test-workbench.conclusion == 'failure' }}
      with:
        name: workbench-tests-artifact
        path: ./src/WorkbenchTests/TestResults
        retention-days: 14
#endif
