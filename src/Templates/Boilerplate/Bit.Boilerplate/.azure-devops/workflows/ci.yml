trigger:
- develop

#if (IsInsideProjectTemplate == true)
# [mirror] .github/workflows/ci.yml
# Only one of the two pipeline directories ships to a generated project, so this note is template-only.
#endif

# https://bitplatform.dev/templates/devops

jobs:
- job: build
  displayName: 'CI build'

  pool:
    vmImage: 'ubuntu-24.04'

  steps:
  - task: UseDotNet@2
    displayName: 'Setup .NET'
    inputs:
      useGlobalJson: true
      workingDirectory: 'src'

  - task: NodeTool@1
    inputs:
      versionSpec: '24.x'
    displayName: 'Install Node.js'

  - task: Bash@3
    displayName: 'Verify formatting'
    inputs:
      targetType: 'inline'
      script: 'dotnet format whitespace --folder . --verify-no-changes'

  - task: Bash@3
    displayName: 'Workload restore'
    inputs:
      targetType: 'inline'
      script: 'dotnet workload restore'

  - task: Bash@3
    displayName: 'Build'
    inputs:
      targetType: 'inline'
      script: 'dotnet build Boilerplate.slnx -p:EnforceCodeStyleInBuild=true'

  - task: Bash@3
    displayName: 'Install Playwright'
    inputs:
      targetType: 'inline'
      script: 'pwsh src/Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps'

  - task: Bash@3
    displayName: 'Trust dotnet cert'
    continueOnError: true # Fails on hosted linux images where the OS trust store is not writable.
    inputs:
      targetType: 'inline'
      script: 'dotnet dev-certs https --trust' # Necessary for aspire related resources

  - task: Bash@3
    name: test
    displayName: 'Test'
    inputs:
      targetType: 'inline'
      script: 'cd src/Tests && dotnet test'

  - task: PublishPipelineArtifact@1
    displayName: 'Upload Tests Artifact'
    condition: failed()
    inputs:
      targetPath: 'src/Tests/TestResults'
      artifactName: 'tests-artifact'
