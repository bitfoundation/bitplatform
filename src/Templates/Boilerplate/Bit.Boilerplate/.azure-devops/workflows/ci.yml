trigger:
- develop

#if (IsInsideProjectTemplate == true)
# [mirror] .github/workflows/ci.yml
# Only one of the two pipeline directories ships to a generated project, so this note is template-only.
#endif

# https://bitplatform.dev/templates/devops

jobs:
- job: build
  displayName: 'CI build'

  pool:
    vmImage: 'ubuntu-24.04'

  steps:
  - task: UseDotNet@2
    displayName: 'Setup .NET'
    inputs:
      useGlobalJson: true
      workingDirectory: 'src'

  - task: Bash@3
    displayName: 'Verify formatting'
    inputs:
      targetType: 'inline'
      script: 'dotnet format whitespace --folder . --verify-no-changes'

  - pwsh: |
      Write-Host "##vso[task.prependpath]$(Agent.ToolsDirectory)/bit-cli"
      dotnet tool install Bit.Cli --prerelease --tool-path "$(Agent.ToolsDirectory)/bit-cli"
    displayName: 'Install the bit CLI'

  - script: bit setup --platforms android --no-browsers --yes -p:EnforceCodeStyleInBuild=true
    displayName: 'Set up and build with bit setup'

- job: test
  displayName: 'CI test'

  pool:
    vmImage: 'ubuntu-24.04'

  steps:
  - task: UseDotNet@2
    displayName: 'Setup .NET'
    inputs:
      useGlobalJson: true
      workingDirectory: 'src'

  - pwsh: |
      Write-Host "##vso[task.prependpath]$(Agent.ToolsDirectory)/bit-cli"
      dotnet tool install Bit.Cli --prerelease --tool-path "$(Agent.ToolsDirectory)/bit-cli"
    displayName: 'Install the bit CLI'

  - script: bit setup --yes
    displayName: 'Prepare this machine and build with bit setup'

  - task: Bash@3
    name: test
    displayName: 'Test'
    inputs:
      targetType: 'inline'
      script: 'cd src/Tests && dotnet test'

  - task: PublishPipelineArtifact@1
    displayName: 'Upload Tests Artifact'
    condition: failed()
    inputs:
      targetPath: 'src/Tests/TestResults'
      artifactName: 'tests-artifact'
