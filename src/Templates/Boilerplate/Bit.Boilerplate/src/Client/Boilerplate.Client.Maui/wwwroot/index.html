<!DOCTYPE html>
<!-- [mirror] host page head tags, stylesheet and script list - keep in sync with:
     - src/Server/Boilerplate.Server.Web/Components/App.razor
     - src/Client/Boilerplate.Client.Web/wwwroot/index.html
     [mirror] loading indicator markup and css - keep in sync with:
     - src/Client/Boilerplate.Client.Core/Components/Common/LoadingComponent.razor
     - src/Client/Boilerplate.Client.Web/wwwroot/index.html
-->

<html bit-theme-system bit-theme-persist bit-theme-view-transition
      bit-theme-light="fluent2-light" bit-theme-dark="fluent2-dark">
<head>
    <base href="/" />
    <meta charset="utf-8" />
    <!-- [mirror] The WebView's status bar / chrome color. A static page cannot read them off
         AppThemePresets the way the other heads do, so these two must equal its light / dark backgrounds - the
         same ones MauiDeviceCoordinator paints the native status bar with.
         The OS media queries only cover the first paint: Scripts/theme.ts rewrites BOTH tags with the live --bit-clr-bg-pri on every theme or accent change, so a
         theme pinned against the OS, or a picked accent, wins as well. Keep in sync with: src/Client/Boilerplate.Client.Web/wwwroot/index.html,
         src/Client/Boilerplate.Client.Web/wwwroot/manifest.json, src/Server/Boilerplate.Server.Web/Components/App.razor -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#131313" media="(prefers-color-scheme: dark)">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!--#if (captcha == "reCaptcha")-->
    <link rel="preconnect" href="https://www.google.com">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <!--#endif-->

    <link rel="preconnect" href="https://use-your-api-server-url-here.com">

    <link rel="preload" href="_content/Bit.BlazorUI.Icons/fonts/FabMDL2.4.66.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="_content/Bit.BlazorUI.Assets/fonts/segoe-ui-bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="_content/Bit.BlazorUI.Assets/fonts/segoe-ui-light.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="_content/Bit.BlazorUI.Assets/fonts/segoe-ui-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="_content/Bit.BlazorUI.Assets/fonts/segoe-ui-semibold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="_content/Bit.BlazorUI.Assets/fonts/segoe-ui-semilight.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" href="_content/Bit.BlazorUI/styles/bit.blazorui.css" />
    <link rel="stylesheet" href="_content/Bit.BlazorUI.Icons/styles/bit.blazorui.icons.css" />
    <link rel="stylesheet" href="_content/Bit.BlazorUI.Assets/styles/bit.blazorui.assets.css" />
    <link rel="stylesheet" href="_content/Bit.BlazorUI.Extras/styles/bit.blazorui.extras.css" />
    <!--#if (theme == "Cupertino")-->
    <link rel="stylesheet" href="_content/Bit.BlazorUI.Extras/styles/bit.blazorui.cupertino.css" />
    <!--#endif-->
    <!--#if (theme == "Material")-->
    <link rel="stylesheet" href="_content/Bit.BlazorUI.Extras/styles/bit.blazorui.material.css" />
    <!--#endif-->
    <!--#if (theme == "Fluent2")-->
    <link rel="stylesheet" href="_content/Bit.BlazorUI.Extras/styles/bit.blazorui.fluent2.css" />
    <!--#endif-->
    <link rel="stylesheet" href="_content/Boilerplate.Client.Core/styles/app.css" />
    <!-- This one physical page is the host for BOTH hybrid heads (Boilerplate.Client.Windows.csproj links it), and
         each project emits only its own scoped css bundle, so exactly one of the next two lines resolves and the
         other 404s at every start. That is expected, not a broken asset: neither link can be dropped, because both
         projects have scoped css of their own. -->
    <link rel="stylesheet" href="Boilerplate.Client.Maui.styles.css" />
    <link rel="stylesheet" href="Boilerplate.Client.Windows.styles.css" />

    <style>

        /* LoadingComponent.razor's body has been copied here due the lack of razor rending support at this stage */
        .bit-lds-grid div {
            background-color: var(--bit-clr-pri, #1276C6);
        }

        .bit-lds-wrapper-nfs {
            top: 50%;
            left: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
        }

        .bit-lds-grid {
            width: 80px;
            height: 80px;
            position: relative;
            display: inline-block;
        }

            .bit-lds-grid div {
                width: 16px;
                height: 16px;
                position: absolute;
                border-radius: 50%;
                animation: bit-lds-grid 1.2s linear infinite;
            }

                .bit-lds-grid div:nth-child(1) {
                    top: 8px;
                    left: 8px;
                    animation-delay: 0s;
                }

                .bit-lds-grid div:nth-child(2) {
                    top: 8px;
                    left: 32px;
                    animation-delay: -0.4s;
                }

                .bit-lds-grid div:nth-child(3) {
                    top: 8px;
                    left: 56px;
                    animation-delay: -0.8s;
                }

                .bit-lds-grid div:nth-child(4) {
                    top: 32px;
                    left: 8px;
                    animation-delay: -0.4s;
                }

                .bit-lds-grid div:nth-child(5) {
                    top: 32px;
                    left: 32px;
                    animation-delay: -0.8s;
                }

                .bit-lds-grid div:nth-child(6) {
                    top: 32px;
                    left: 56px;
                    animation-delay: -1.2s;
                }

                .bit-lds-grid div:nth-child(7) {
                    top: 56px;
                    left: 8px;
                    animation-delay: -0.8s;
                }

                .bit-lds-grid div:nth-child(8) {
                    top: 56px;
                    left: 32px;
                    animation-delay: -1.2s;
                }

                .bit-lds-grid div:nth-child(9) {
                    top: 56px;
                    left: 56px;
                    animation-delay: -1.6s;
                }


        @keyframes bit-lds-grid {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }
    </style>
</head>

<body class="bit-css-clr-bg-pri bit-css-clr-fg-pri bit-blazor-hybrid">

    <!-- LoadingComponent.razor's body has been copied here due the lack of razor rending support at this stage -->
    <div id="app-container">
        <div class="bit-lds-wrapper-nfs">
            <div class="bit-lds-grid">
                <div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div>
            </div>
        </div>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="_content/Bit.Butil/bit-butil.js"></script>
    <script src="_content/Bit.BlazorUI/scripts/bit.blazorui.js"></script>
    <script src="_content/Boilerplate.Client.Core/scripts/app.js"></script>
    <script src="_content/Bit.BlazorUI.Extras/scripts/bit.blazorui.extras.js"></script>

</body>

</html>
