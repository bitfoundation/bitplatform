<!DOCTYPE html>
<html lang="en">

<head>
    <base href="/" />
    <meta charset="utf-8" />
    <title>Bdnd samples (MAUI)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- No stylesheet for Bdnd: it ships none, what a drag looks like is app.css's. -->
    <link rel="stylesheet" href="_content/Bit.Bdnd.Samples.Core/app.css" />
</head>

<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- No script tag for Bdnd: its components import _content/Bit.Bdnd/bit-bdnd.js themselves the first time they need it. -->
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
