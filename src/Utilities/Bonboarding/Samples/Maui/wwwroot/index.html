<!DOCTYPE html>
<html lang="en">

<head>
    <base href="/" />
    <meta charset="utf-8" />
    <title>Bonboarding samples (MAUI)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- The library's stylesheet first, so the samples' own rules (and an application's) come later in the cascade. -->
    <link rel="stylesheet" href="_content/Bit.Bonboarding/bit-bonboarding.css" />
    <link rel="stylesheet" href="_content/Bit.Bonboarding.Samples.Core/app.css" />
    <!-- The app has no favicon; an empty one keeps the WebView from requesting /favicon.ico on every load. -->
    <link rel="icon" href="data:," />
</head>

<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- No script tag for Bonboarding: the library imports its one small module itself, on demand. -->
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
