<!DOCTYPE html>
<html lang="en">

<head>
    <base href="/" />
    <meta charset="utf-8" />
    <title>BbScanner samples (MAUI)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- No link to _content/Bit.BbScanner/bit-bbscanner.css: Bit.BbScanner's JS initializer adds it to the page by
         itself, in a BlazorWebView as much as in a browser. -->
    <link rel="stylesheet" href="_content/Bit.BbScanner.Samples.Core/app.css" />
    <!-- The app has no favicon; an empty one keeps the WebView from requesting /favicon.ico on every load. -->
    <link rel="icon" href="data:," />
</head>

<body>
    <div id="app">Loading...</div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- No script tag for BbScanner: it ships its JavaScript as a static web asset and imports it itself. -->
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>

</html>
