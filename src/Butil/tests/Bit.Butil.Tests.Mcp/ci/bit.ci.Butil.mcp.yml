# Ready-to-merge GitHub Actions workflow for the Bit.Butil MCP server suite.
#
# This file lives inside the test project because the repo's `.github/workflows`
# folder is outside this package's tree. To enable it, copy this file to
#   .github/workflows/bit.ci.Butil.mcp.yml
# (it's self-contained and won't clash with the existing bit.ci.Butil.yml build job).

name: bit platform CI - Butil MCP

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/Butil/**'

env:
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

jobs:
  mcp-Butil:
    if: startsWith(github.event.pull_request.title, 'Prerelease') != true && startsWith(github.event.pull_request.title, 'Release') != true && startsWith(github.event.pull_request.title, 'Version') != true
    name: Bit.Butil MCP server
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: src/global.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: dotnet workload restore
        run: cd src/Butil && dotnet workload restore

      # The suite boots the demo server as a child process, and the demo serves bit-butil.js as a
      # static web asset of the library - so the library's Node/TypeScript pipeline has to have run
      # once before the demo is built.
      - name: Build Bit.Butil (net10.0)
        run: dotnet build src/Butil/Bit.Butil/Bit.Butil.csproj -c Release -f net10.0

      # Built up front so the six-minute readiness deadline in the fixture is spent waiting for the
      # app to start rather than for the WebAssembly client to compile.
      - name: Build the demo server the suite boots
        run: >
          dotnet build src/Butil/Bit.Butil.Demo/Server/Bit.Butil.Demo.Server.csproj
          --artifacts-path ${{ runner.temp }}/bit-butil-mcp-tests

      - name: Build the MCP test project
        run: dotnet build src/Butil/tests/Bit.Butil.Tests.Mcp/Bit.Butil.Tests.Mcp.csproj -c Release

      - name: Run the MCP tests
        env:
          BUTIL_MCP_ARTIFACTS_PATH: ${{ runner.temp }}/bit-butil-mcp-tests
        run: >
          dotnet test src/Butil/tests/Bit.Butil.Tests.Mcp/Bit.Butil.Tests.Mcp.csproj
          -c Release
          --no-build
          --report-trx --report-trx-filename butil-mcp.trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: butil-mcp-results
          path: '**/butil-mcp.trx'
          if-no-files-found: ignore
