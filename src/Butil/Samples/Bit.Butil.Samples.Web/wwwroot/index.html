<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/" />
    <meta charset="utf-8" />
    <title>Bit.Butil.Samples</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="_content/Bit.Butil.Samples.Core/app.css" />
</head>

<body>
    <div id="app"></div>

    <script>
        navigator.serviceWorker.register('/sw.js');
    </script>
    <!-- Bundle mode by default; the E2E suite appends ?lazy=1 to run the same app with lazy scripts, in which
         case the bundle must not be on the page at all. The test is for that exact value, and not merely for
         the parameter being present, so that it agrees with Program.cs - any other value (?lazy=0 included)
         is bundle mode on both sides rather than an app with neither the bundle nor lazy loading. -->
    <script>
        if (new URLSearchParams(location.search).get('lazy') !== '1') {
            document.write('<script src="_content/Bit.Butil/bit-butil.js"><\/script>');
        }
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
