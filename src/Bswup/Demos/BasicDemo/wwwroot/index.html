<!DOCTYPE html>
<html lang="en">

<head>
    <base href="/" />
    <meta charset="utf-8" />
    <title>bit Bswup Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="manifest.json" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <style>
        #bit-bswup {
            position: fixed;
            background: #fff;
            left: 0;
            right: 0;
            bottom: 0;
            top: 0;
            padding: 20px;
            text-align: center;
            display: none;
            font-family: Arial, Helvetica, sans-serif;
        }

        .bit-bswup-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 70%;
            margin: 0 auto;
            margin-top: 45px;
        }

        .bit-bswup-title,
        #bit-bswup-percent {
            font-size: 20px;
        }

        #bit-bswup-description {
            font-size: 14px;
            margin-bottom: 20px;
        }

        .bit-bswup-progress {
            border: 1px solid #ebebff;
            background-color: #eee;
            border-radius: 4px;
            width: 100%;
            height: 5px;
        }

        #bit-bswup-progress-bar {
            background-color: #538fc3;
            border-radius: 2px;
            height: 5px;
        }

        #bit-bswup-reload {
            display: none;
            position: fixed;
            top: 10px;
            right: 10px;
        }

        #bit-bswup-assets {
            font-size: 10px;
            overflow: auto;
            height: 666px;
            text-align: left;
        }
    </style>
</head>

<body>
    <div id="bit-bswup">
        <div class="bit-bswup-container">
            <p class="bit-bswup-title">New version is available</p>
            <p id="bit-bswup-description">Downloading updates, please wait...</p>
            <div class="bit-bswup-progress">
                <div id="bit-bswup-progress-bar" style="width: 0%"></div>
            </div>
            <p id="bit-bswup-percent">0 %</p>
            <ul id="bit-bswup-assets"></ul>
        </div>
    </div>
    <button id="bit-bswup-reload">Update ready, Click to reload!</button>

    <div id="app">Loading...</div>

    <script>
        const appEl = document.getElementById('app');
        const bswupEl = document.getElementById('bit-bswup');
        const descriptionLabel = document.getElementById('bit-bswup-description');
        const progressBar = document.getElementById('bit-bswup-progress-bar');
        const percentLabel = document.getElementById('bit-bswup-percent');
        const reloadButton = document.getElementById('bit-bswup-reload');
        const assetsUl = document.getElementById('bit-bswup-assets');

        function bitBswupHandler(type, data) {
            switch (type) {

                case BswupMessage.updateFound: return console.log('an update found.');

                case BswupMessage.stateChanged: return console.log('state has changed to:', data.currentTarget.state);

                case BswupMessage.activate: return console.log('new version activated:', data.version);

                case BswupMessage.downloadStarted:
                    // A background update downloads behind the running app - only a first
                    // install owns the screen (firstInstall rides on every message).
                    if (data?.firstInstall === false) return console.log('downloading update assets started:', data?.version);
                    appEl.style.display = 'none';
                    bswupEl.style.display = 'block';
                    return console.log('downloading assets started:', data?.version);

                case BswupMessage.downloadProgress: {
                    // Built with textContent (not innerHTML) so asset names can never be
                    // parsed as markup - the same hardening as the bundled progress script.
                    const li = document.createElement('li');
                    const urlEl = document.createElement('b');
                    urlEl.textContent = data.asset.url;
                    li.append(`${data.index}: `, urlEl, `: ${data.asset.hash}`);
                    assetsUl.prepend(li);
                    const percent = Math.round(data.percent);
                    progressBar.style.width = `${percent}%`;
                    percentLabel.textContent = `${percent} %`;
                    return console.log('asset downloaded:', data);
                }

                case BswupMessage.downloadFinished: {
                    if (data.firstInstall) {
                        descriptionLabel.textContent = 'Downloading finished, starting Blazor...';
                        // Same recovery the built-in progress UI performs: a reload that fails
                        // leaves the splash up with a manual retry wired back to data.reload,
                        // instead of freezing on "starting Blazor..." with no way forward. The
                        // timer covers the stall case the .catch cannot: reload() never settles
                        // when the activation handshake goes missing, so a grace period is the
                        // only signal left (see autoReloadWithFallback in bit-bswup.progress.ts).
                        const showRetry = () => {
                            descriptionLabel.textContent = 'Starting failed, click the button to retry.';
                            bswupEl.style.display = 'block';
                            reloadButton.style.display = 'block';
                            reloadButton.onclick = data.reload;
                        };
                        const fallbackTimer = setTimeout(showRetry, 10000);
                        data.reload().then(() => {
                            clearTimeout(fallbackTimer);
                            appEl.style.display = 'block';
                            bswupEl.style.display = 'none';
                        }).catch(() => {
                            clearTimeout(fallbackTimer);
                            showRetry();
                        });
                    } else {
                        descriptionLabel.textContent = 'Downloading finished, ready to reload.';
                        reloadButton.style.display = 'block';
                        reloadButton.onclick = data.reload;
                    }
                    return console.log('downloading assets finished.');
                }

                case BswupMessage.updateReady:
                    reloadButton.style.display = 'block';
                    reloadButton.onclick = data.reload;
                    return console.log('new update ready.');

                case BswupMessage.error:
                    // This demo deliberately ships a 404ing external asset (see the dev
                    // service-worker.js), so non-fatal errors are expected here: under the
                    // default lax tolerance the install continues and the asset lazy-fills.
                    console.error('installation error:', data);
                    if (data.fatal === false) return;
                    // A fatal failure during a background update leaves the running app
                    // untouched - the previous worker keeps serving it.
                    if (data.firstInstall === false) return;
                    // Fatal first-install failure: bit-bswup.js force-starts Blazor from the
                    // network; reveal the app instead of leaving it booted behind the splash.
                    descriptionLabel.textContent = 'Install failed; starting without offline support...';
                    appEl.style.display = 'block';
                    bswupEl.style.display = 'none';
                    return;
            }
        }
    </script>
    <script src="_framework/blazor.webassembly.js" autostart=false></script>
    <!-- blazorScript is omitted on purpose: both default entry scripts
         (blazor.web.js / blazor.webassembly.js) are auto-detected, fingerprints and
         query strings included - the attribute is only needed for non-default paths. -->
    <script src="_content/Bit.Bswup/bit-bswup.js"
            scope="/"
            log="none"
            sw="service-worker.js"
            handler="bitBswupHandler"></script>
</body>

</html>
